<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Эд ПВЗ — VK ID</title><style>body{font:16px system-ui;background:#f7f3fa;color:#222;margin:0;padding:24px}main{max-width:520px;margin:40px auto;background:white;border-radius:24px;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px;border:0;border-radius:12px;background:#07f;color:white}</style></head><body><main><h1>Проверка VK ID</h1><p>Авторизация для проверки поиска публичных сообществ. Не изменяет ваш аккаунт Эд ПВЗ.</p><div id="vk"></div><pre id="status" role="status">Загрузка VK ID…</pre><a href="/">На главную</a></main><script src="https://unpkg.com/@vkid/sdk@2.6.3/dist-sdk/umd/index.js"></script><script>
const status=document.getElementById('status');let stage='SDK';document.querySelector('h1').textContent='Проверка VK ID · v3';
(async()=>{try{if(!window.VKIDSDK)throw Error('SDK недоступен');const V=window.VKIDSDK;V.Config.init({app:54919711,redirectUrl:'https://edpvz.ru/vk-auth/',responseMode:V.ConfigResponseMode.Callback,source:V.ConfigSource.LOWCODE,scope:''});const one=new V.OneTap();one.render({container:document.getElementById('vk'),showAlternativeLogin:true}).on(V.WidgetEvents.ERROR,()=>{status.textContent='Ошибка авторизации VK ID';}).on(V.OneTapInternalEvents.LOGIN_SUCCESS,async payload=>{try{stage='Обмен кода';status.textContent='Проверяем доступ к поиску…';let result;try{result=await V.Auth.exchangeCode(payload.code,payload.device_id);}catch(e){status.textContent='Этап 1: обмен кода VK ID не выполнен. Код: '+(typeof e?.code==='number'?e.code:'неизвестен');return;}if(!result.access_token){status.textContent='Этап 1: токен отсутствует';return;}status.textContent='Этап 1: токен получен. Проверяем API на сервере…';stage='Серверный запрос';const response=await fetch('https://duerixyhzapotoeclggz.supabase.co/functions/v1/edpvz-vk-search-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:result.access_token})});stage='Разбор ответа сервера HTTP '+response.status;const data=await response.json();status.textContent=!data.ok?'Токен получен. VK API: '+(data.code??data.error??response.status):'Поиск доступен. Найдено: '+data.count+'\n'+data.items.map(x=>x.name+' — https://vk.com/'+x.screen_name).join('\n');}catch(e){status.textContent='v3 — '+stage+': '+(e instanceof TypeError?'Сетевая ошибка (TypeError)':e instanceof SyntaxError?'Ответ не JSON':'Ошибка '+(e?.name||'unknown'));}});status.textContent='Войдите через VK ID.';}catch(e){status.textContent='Не удалось загрузить VK ID SDK.';}})();
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Эд ПВЗ — VK ID</title><style>body{font:16px system-ui;background:#f7f3fa;color:#222;margin:0;padding:24px}main{max-width:520px;margin:40px auto;background:white;border-radius:24px;padding:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px;border:0;border-radius:12px;background:#07f;color:white}</style></head><body><main><h1>Проверка VK ID</h1><p>Авторизация для проверки поиска публичных сообществ. Не изменяет ваш аккаунт Эд ПВЗ.</p><div id="vk"></div><pre id="status" role="status">Загрузка VK ID…</pre><a href="/">На главную</a></main><script src="https://unpkg.com/@vkid/sdk@2.6.3/dist-sdk/umd/index.js"></script><script>
const status=document.getElementById('status');
(async()=>{try{if(!window.VKIDSDK)throw Error('SDK недоступен');const V=window.VKIDSDK;V.Config.init({app:54919711,redirectUrl:'https://edpvz.ru/vk-auth/',responseMode:V.ConfigResponseMode.Callback,source:V.ConfigSource.LOWCODE,scope:''});const one=new V.OneTap();one.render({container:document.getElementById('vk'),showAlternativeLogin:true}).on(V.WidgetEvents.ERROR,()=>{status.textContent='Ошибка авторизации VK ID';}).on(V.OneTapInternalEvents.LOGIN_SUCCESS,async payload=>{try{status.textContent='Проверяем доступ к поиску…';const result=await V.Auth.exchangeCode(payload.code,payload.device_id);const response=await fetch('https://api.vk.com/method/groups.search',{method:'POST',body:new URLSearchParams({q:'работа ПВЗ',country_id:'1',count:'10',v:'5.199',access_token:result.access_token})});const data=await response.json();status.textContent=data.error?'VK API: '+data.error.error_code+' — '+data.error.error_msg:'Поиск доступен. Найдено: '+data.response.count+'\n'+data.response.items.map(x=>x.name+' — https://vk.com/'+x.screen_name).join('\n');}catch(e){status.textContent='Не удалось проверить API. Возможны ограничения браузера или VK ID.';}});status.textContent='Войдите через VK ID.';}catch(e){status.textContent='Не удалось загрузить VK ID SDK.';}})();
</script></body></html>

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/ed-pvz-supervisord.pid

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
user=pwuser
priority=10
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:window-manager]
command=/usr/bin/fluxbox
user=pwuser
environment=DISPLAY=":99",HOME="/home/pwuser"
priority=20
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:vnc]
command=/usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -nopw -forever -shared
user=pwuser
priority=30
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:desktop-proxy]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=pwuser
priority=40
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:app]
command=/usr/bin/node /app/server.mjs
user=pwuser
environment=DISPLAY=":99",HOME="/home/pwuser"
priority=50
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

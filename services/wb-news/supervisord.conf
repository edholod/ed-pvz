[supervisord]
user=root
nodaemon=true
logfile=/dev/null
pidfile=/tmp/ed-pvz-supervisord.pid

[program:display]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
user=pwuser
priority=10
autorestart=true
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:app]
command=/usr/bin/node /app/server.mjs
user=pwuser
environment=DISPLAY=":99",HOME="/home/pwuser"
priority=50
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вопросы по площадкам — Эд ПВЗ</title><style>body{margin:0;background:#faf8fb;color:#342d39;font:15px system-ui,-apple-system,sans-serif}main{max-width:980px;margin:auto;padding:18px 14px 70px}a{color:#85427b}.back{display:inline-block;background:white;border:1px solid #e8dce8;padding:12px 16px;border-radius:12px;text-decoration:none;color:inherit}h1{font-size:clamp(24px,5vw,32px)}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin:18px 0}.tab{border:1px solid #e3d9e6;border-radius:15px;background:white;padding:13px 8px;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;cursor:pointer}.tab[aria-pressed=true]{background:#fce7f1;border-color:#b37eac}.logo{display:inline-grid;place-items:center;width:33px;height:33px;border-radius:10px;font-weight:850;background:#eee;color:#555}.logo.wb{background:#a12d9c;color:white}.logo.oz{background:#1769ff;color:white}.logo.ym{background:#ffdf36;color:#222}.logo.av{background:#e9f4ff;color:#1675e5}.search{width:100%;padding:14px;border:1px solid #ddd1df;border-radius:13px;font:inherit}.item{background:white;border:1px solid #e9dfea;border-radius:14px;margin:10px 0;padding:15px}.question{font-weight:700;line-height:1.5}.meta{display:flex;align-items:center;gap:8px;color:#766d79;font-size:12px;margin-bottom:9px}.answer{border-left:3px solid #d7b6db;padding:9px 0 9px 12px;margin-top:10px;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.answer b{display:block;font-size:12px;margin-bottom:4px}.more{display:block;margin:22px auto;padding:12px 24px;border:1px solid #e2d4e4;background:white;border-radius:12px;font:inherit;cursor:pointer}.muted{color:#786e7b;font-size:13px}.item p{overflow-wrap:anywhere}@media(max-width:480px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><a class="back" href="./faq.html">← Все темы</a><h1>Вопросы по площадкам</h1><p class="muted">Выберите маркетплейс. Вопросы сгруппированы по площадке, а ответы сохранены из обсуждений. Это не официальные инструкции.</p><div class="tabs" id="tabs"></div><input id="search" class="search" type="search" placeholder="Поиск по вопросам и ответам…" aria-label="Поиск"><p id="status" class="muted">Загружаем базу…</p><div id="items"></div><button id="more" class="more" hidden>Показать ещё</button></main><script>(()=>{'use strict';const files=["chat-data.json","extra-1.json","extra-2.json","extra-3.json","extra-4.json","extra-5.json","extra-6.json","extra-7.json","extra-8.json","ozon-2026-1.json","ozon-2026-2.json","ozon-2026-3.json","ozon-2026-4.json","ozon-2026-5.json","ozon-2026-6.json","ozon-2026-7.json","ozon-2026-8.json","ozon-2026-9.json","ozon-2026-10.json","ozon-2026-11.json","ozon-may-aug-1.json","ozon-may-aug-2.json","ozon-may-aug-3.json","ozon-may-aug-4.json","ozon-may-aug-5.json","ozon-may-aug-6.json"];const keys=['Wildberries','Ozon','Яндекс Маркет','Авито','Неизвестно'];const marks=['WB','O₃','Я','A','?'];const classes=['wb','oz','ym','av','unknown'];const $=id=>document.getElementById(id);const tabs=$('tabs'),items=$('items'),status=$('status'),more=$('more'),search=$('search');let data=[],current=new URLSearchParams(location.search).get('platform')||'Wildberries',shown=0,filtered=[];if(!keys.includes(current))current='Wildberries';function platform(e){const p=String(e.platform||'').trim().toLowerCase();const source=String(e.source||'').toLowerCase();if(/wildberries|вайлдберриз|вайлдберрис|^wb$|^вб$/.test(p))return 'Wildberries';if(/ozon|озон/.test(p))return 'Ozon';if(/яндекс|yandex|маркет/.test(p))return 'Яндекс Маркет';if(/авито|avito/.test(p))return 'Авито';if(p)return 'Неизвестно';if(/wbpoint|wildberries|вайлдберриз/.test(source))return 'Wildberries';if(/ozon|озон/.test(source))return 'Ozon';if(/яндекс|yandex/.test(source))return 'Яндекс Маркет';if(/avito|авито/.test(source))return 'Авито';return 'Неизвестно'}function badge(p){const i=keys.indexOf(p),s=document.createElement('span');s.className='logo '+classes[i];s.textContent=marks[i];s.setAttribute('aria-label',p);return s}function renderTabs(){tabs.replaceChildren();keys.forEach(k=>{const b=document.createElement('button');b.className='tab';b.type='button';b.setAttribute('aria-pressed',String(current===k));b.append(badge(k),document.createTextNode(k));b.addEventListener('click',()=>{current=k;history.replaceState(null,'','?platform='+encodeURIComponent(k));renderTabs();apply()});tabs.append(b)})}function apply(){const q=search.value.trim().toLocaleLowerCase('ru');filtered=data.filter(e=>e._platform===current&&(!q||(e.question+' '+(e.answers||[]).map(a=>a.text).join(' ')).toLocaleLowerCase('ru').includes(q)));shown=0;items.replaceChildren();renderMore()}function renderMore(){const frag=document.createDocumentFragment();for(const e of filtered.slice(shown,shown+40)){const box=document.createElement('article');box.className='item';const meta=document.createElement('div');meta.className='meta';meta.append(badge(e._platform),document.createTextNode((e.date||'')+(e.source?' · '+e.source:'')));box.append(meta);const question=document.createElement('div');question.className='question';question.textContent=e.question;box.append(question);for(const a of e.answers||[]){if(!a.text)continue;const ans=document.createElement('div');ans.className='answer';const who=document.createElement('b');who.textContent=a.name||'Ответ';ans.append(who,document.createTextNode(a.text));box.append(ans)}frag.append(box)}items.append(frag);shown=Math.min(shown+40,filtered.length);status.textContent='Показано '+shown+' из '+filtered.length+' вопросов · '+current;more.hidden=shown>=filtered.length;if(!filtered.length)items.textContent='В этой категории пока нет вопросов.'}search.addEventListener('input',apply);more.addEventListener('click',renderMore);renderTabs();Promise.allSettled(files.map(f=>fetch('./apps/faq/'+f).then(r=>{if(!r.ok)throw Error(f+' HTTP '+r.status);return r.json()}))).then(all=>{const failed=[];const seen=new Set();for(let i=0;i<all.length;i++){const r=all[i];if(r.status!=='fulfilled'||!Array.isArray(r.value)){failed.push(files[i]);continue}for(const e of r.value){if(!e||typeof e.question!=='string')continue;const id=e.id!=null?'id:'+e.id:'text:'+e.question+'|'+e.source;if(seen.has(id))continue;seen.add(id);data.push({...e,_platform:platform(e)})}}data.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''),'ru'));apply();if(failed.length){const warning=document.createElement('p');warning.className='muted';warning.textContent='Не удалось загрузить '+failed.length+' файлов: '+failed.join(', ');status.after(warning)}}).catch(e=>{status.textContent='Ошибка загрузки: '+e.message})})();</script></body></html>

name: Collect My PVZ news for free
on:
  push:
    paths:
      - '.github/workflows/wb-news-scheduled.yml'
      - 'services/wb-news/scheduled.mjs'
      - 'services/wb-news/session.mjs'
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wb-authenticated-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check WB session configuration
        id: session
        env:
          WB_SESSION: ${{ secrets.WB_SESSION }}
        run: |
          if [ -n "$WB_SESSION" ]; then echo 'configured=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.session.outputs.configured == 'true'
        run: npm ci --ignore-scripts
        working-directory: services/wb-news
      - if: steps.session.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: services/wb-news
      - name: Collect read-only news
        id: collect
        continue-on-error: true
        env:
          WB_SESSION: ${{ secrets.WB_SESSION }}
        run: node services/wb-news/scheduled.mjs
      - name: Publish news and encrypted renewed session
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wb-news.json
          if [ -f data/wb-session.enc ]; then git add data/wb-session.enc; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh My PVZ news and encrypted session'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.collect.outcome == 'failure'
        run: exit 1

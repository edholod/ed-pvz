name: Wake private WB synchronization
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-disputes-wake
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake existing server without exposing private data
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 120 https://ed-pvz-wb-login.onrender.com/healthz

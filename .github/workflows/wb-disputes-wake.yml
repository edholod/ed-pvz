name: Wake private WB synchronization
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-disputes-wake
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Keep the existing worker awake for its bounded collection window
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 6600))
          reached=0
          while (( SECONDS < deadline )); do
            if curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 120 https://ed-pvz-wb-login.onrender.com/healthz >/dev/null; then
              reached=1
            else
              echo "Worker temporarily unavailable; retrying on the next heartbeat."
            fi
            sleep 240
          done
          test "$reached" -eq 1

<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Эд ПВЗ — поиск сообществ</title><style>body{font:16px system-ui;background:#f5f3fa;color:#222;padding:20px}main{max-width:700px;margin:auto;background:white;padding:24px;border-radius:20px}button{background:#07f;color:white;border:0;border-radius:12px;padding:14px;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>Поиск сообществ ПВЗ</h1><p>Откройте внутри мини-приложения VK. Токен используется только в памяти страницы.</p><button id="start">Проверить доступ и найти группы</button><button id="save" disabled>Скачать список кандидатов</button><pre id="status">Ожидание запуска</pre></main><script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.11/dist/browser.min.js"></script><script>
const b=window.vkBridge,s=document.getElementById('status'),start=document.getElementById('start'),save=document.getElementById('save');let found=new Map();const sleep=ms=>new Promise(r=>setTimeout(r,ms));const queries=['работа ПВЗ','вакансии ПВЗ','подмена ПВЗ','замена ПВЗ','подработка ПВЗ','смены ПВЗ','работа пункт выдачи','работа ПВЗ Wildberries','работа ПВЗ Ozon','работа ПВЗ Яндекс Маркет','работа ПВЗ Авито'];start.onclick=async()=>{start.disabled=true;let token;try{if(!b)throw Error('Bridge SDK недоступен');await b.send('VKWebAppInit');s.textContent='Запрос разрешения groups';const a=await b.send('VKWebAppGetAuthToken',{app_id:54919545,scope:'groups'});token=a.access_token;if(!token)throw Error('Токен отсутствует');const api=async(method,params)=>{const x=await b.send('VKWebAppCallAPIMethod',{method,params:{...params,v:'5.199',access_token:token}});return x.response};await api('users.get',{});s.textContent='Авторизация успешна. Поиск…';for(const q of queries){for(let offset=0;offset<1000;offset+=100){const r=await api('groups.search',{q,country_id:1,count:100,offset});for(const g of r.items||[]){if(!g.is_closed)found.set(g.id,{id:g.id,name:g.name,url:'https://vk.com/'+(g.screen_name||'club'+g.id)});}s.textContent='Запрос: '+q+' | кандидатов: '+found.size;save.disabled=!found.size;if(offset+100>=r.count||!r.items?.length)break;await sleep(400);}await sleep(400);}s.textContent='Поиск завершён. Кандидатов: '+found.size+'\n'+Array.from(found.values()).map(g=>g.name+' — '+g.url).join('\n');}catch(e){s.textContent='Поиск остановлен. Код Bridge: '+(e?.error_data?.error_code??e?.error_type??'неизвестен')+'; кандидатов: '+found.size;}finally{token=undefined;start.disabled=false;save.disabled=!found.size;}};save.onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify([...found.values()],null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='vk-pvz-candidates.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поиск по Эд ПВЗ</title><style>:root{font-family:system-ui,-apple-system,Arial;background:#faf8fb;color:#292430}*{box-sizing:border-box}main{max-width:850px;margin:auto;padding:24px 16px 60px}h1{font-size:29px}p{color:#777}input{width:100%;padding:17px;border:1px solid #ddd;border-radius:14px;font:inherit}article{background:white;border:1px solid #eee;border-radius:16px;padding:18px;margin:12px 0}article h2{font-size:17px;margin:0 0 8px}article p{font-size:13px;margin:0 0 12px;line-height:1.5}a{color:#a13b75;text-decoration:none}small{color:#777}</style></head><body><main><h1>Поиск по Эд ПВЗ</h1><p>Ищите инструмент, справочник или шаблон. Поиск работает без регистрации.</p><input id="q" type="search" placeholder="Например: штраф, смена, подмена, печать…" autofocus><div id="results"></div><p><small>Поиск охватывает названия, описания и темы разделов. Полнотекстовый поиск по всем урокам и публикациям пока не подключён.</small></p></main><script>const docs=[['Новости Wildberries','Новости, правила, изменения, тарифы, ПВЗ, продавцы, каналы','../news/'],['Конструктор тикетов WB','Обращение поддержка штраф подмена недобросовестный клиент поставка оценка тариф оборудование режим работы','../tickets/'],['Справочник штрафов','Удержание подмена штраф недостача утеря оспорить апелляция камера рейтинг','../fines/'],['Центр печати','Объявление табличка A4 режим работы технический перерыв печать PDF','../print/'],['Обучение ПВЗ','Уроки инструкция обучение сотрудник WB Academy','../academy/'],['WB ЕГЭ','Тест экзамен знания вопросы проверка','../ege/'],['Календарь смен','График сотрудники зарплата PVZ CONTROL расписание','../control/'],['Генератор QR','QR штрихкод ШК стикер товар','../qr/'],['Доходность ПВЗ','Калькулятор доходность прибыль расходы сезонность','../finance/'],['Калькулятор оценок','Рейтинг отзывы оценки звёзды','../rating/'],['WB PVZ TYCOON','Игра симулятор управление ПВЗ','../tycoon/'],['Рабочие приложения WB','Скачать Windows Linux Android iPhone установка','../downloads/'],['Мой аккаунт','Регистрация облако синхронизация резервная копия','../account/']];const $=id=>document.getElementById(id);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const words=$('q').value.toLocaleLowerCase('ru').trim().split(/\s+/).filter(Boolean);const scored=docs.map(x=>({x,score:words.reduce((n,w)=>n+(x[0].toLowerCase().includes(w)?4:0)+(x[1].toLowerCase().includes(w)?1:0),0)})).filter(o=>!words.length||o.score>=words.length).sort((a,b)=>b.score-a.score);$('results').innerHTML=scored.map(({x})=>'<article><h2>'+esc(x[0])+'</h2><p>'+esc(x[1])+'</p><a href="'+x[2]+'">Открыть раздел →</a></article>').join('')||'<p>Совпадений нет. Попробуйте другой запрос.</p>'}$('q').oninput=render;render();</script><script defer src="../../assets/svg-icons.js?v=1"></script></body></html>

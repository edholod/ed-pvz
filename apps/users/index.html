<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fce7f1"><title>Поиск пользователей — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,Arial;background:linear-gradient(125deg,#fff5fa,#eef4ff);color:#282530;min-height:100dvh}main{max-width:760px;margin:auto;padding:25px 18px}a{color:#9b286c;text-decoration:none}h1{font-size:27px;margin:25px 0 8px}p{color:#706a74;line-height:1.5}.panel{border:1px solid #e8dfe9;background:#fff;border-radius:22px;padding:20px;margin-top:20px}label{font-weight:650;display:block;margin-bottom:12px}input{width:100%;font:inherit;padding:15px;border:1px solid #dcd6e1;border-radius:14px;outline-color:#b9367b}button{background:#9b286c;color:white;border:0;border-radius:12px;padding:13px 18px;font:inherit;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}.result{padding:14px 4px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}.avatar{background:#f9e6f1;color:#9b286c;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:750}.result strong{display:block}.result small{color:#777}#status{font-size:14px;color:#6c6070}#results{margin-top:12px}</style></head><body><main><a href="../../">← На главную</a><h1>Поиск пользователей</h1><p>Найди зарегистрированного пользователя Эд ПВЗ по логину. Для защиты личных данных доступны только логин и роль, без телефонов и паролей.</p><section class="panel"><label for="q">Логин пользователя</label><input id="q" autocomplete="off" maxlength="32" placeholder="Введите минимум 2 символа" aria-describedby="status"><button id="search">Найти</button><p id="status" role="status">Для поиска войдите в свой аккаунт.</p><div id="results"></div></section></main><script src="../../assets/account.js"></script><script>(function(){const q=document.getElementById('q'),button=document.getElementById('search'),status=document.getElementById('status'),results=document.getElementById('results');const base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV';async function search(){results.replaceChildren();const term=q.value.trim();if(!/^[a-zA-Z0-9_]{2,32}$/.test(term)){status.textContent='Введите от 2 до 32 латинских букв, цифр или подчёркиваний.';return}button.disabled=true;status.textContent='Поиск…';try{const session=await window.EdPVZAccount.ensure();if(!session?.access_token){status.textContent='Войдите в аккаунт в разделе «Мой аккаунт», затем повторите поиск.';return}const response=await fetch(base+'/rest/v1/rpc/edpvz_search_users',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({search_term:term})});if(!response.ok)throw Error('HTTP '+response.status);const users=await response.json();if(!Array.isArray(users))throw Error('Неверный ответ');status.textContent=users.length?'Найдено: '+users.length:'Пользователи не найдены';for(const user of users){const row=document.createElement('div');row.className='result';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(user.username||'?').slice(0,1).toUpperCase();const info=document.createElement('div');const name=document.createElement('strong');name.textContent='@'+user.username;const role=document.createElement('small');role.textContent=user.role==='owner'?'Собственник':'Сотрудник';info.append(name,role);row.append(avatar,info);results.append(row)}}catch(e){status.textContent='Не удалось выполнить поиск: '+e.message}finally{button.disabled=false}}button.addEventListener('click',search);q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});window.EdPVZAccount.ensure().then(s=>{if(s?.access_token)status.textContent='Введите логин и нажмите «Найти».'}).catch(()=>{})})();</script></body></html>

play:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:96px;padding:8px 2px;border-radius:16px;font-size:clamp(10px,3.1vw,14px);line-height:1.15;white-space:nowrap;background:#fff}.tabs svg{width:23px;height:23px;flex:none}.tabs .tab-count{font-size:18px;font-weight:750;line-height:1}.tabs #active{color:#27824e}.tabs #scheduledTab{color:#7850ad}.tabs #done{color:#3868a5}.tabs #active[aria-selected=true]{background:#e8f7ed;border-color:#91c9a5}.tabs #scheduledTab[aria-selected=true]{background:#eee7fa;border-color:#b99bd8}.tabs #done[aria-selected=true]{background:#e6effa;border-color:#9cb9dd}</style></head><body><main><a class="back" href="../../">← Назад</a><h1>Личные задачи</h1><p>🔒 Личные задачи видны только вам. Совместные — приглашённым участникам.</p><button class="primary" id="add" disabled>＋ Новая задача</button><form id="editor" hidden><label>Название<input id="title" required maxlength="250"></label><label>Описание<textarea id="description" maxlength="10000" rows="3"></textarea></label><label>Прикрепить ПВЗ<select id="point"><option value="">Без ПВЗ</option></select></label><label id="manualPointLabel">Или указать ПВЗ вручную<input id="pointManual" maxlength="500" placeholder="Название или адрес пункта"></label><label>Повторение<select id="repeatUnit"><option value="">Не повторять</option><option value="day">Ежедневно / каждые N дней</option><option value="week">Еженедельно</option><option value="month">Ежемесячно</option><option value="year">Ежегодно</option></select></label><label id="repeatEveryLabel" hidden>Интервал повторения<input id="repeatEvery" type="number" min="1" max="365" step="1" value="1"></label><label>Начало задачи<select id="startMode"><option value="now">Сразу</option><option value="later">Отложить</option></select></label><label id="startLabel" hidden>Дата и время начала<span class="deadline-wrap"><input id="scheduled" type="datetime-local" aria-label="Дата и время начала"><span class="deadline-placehol row Error('Войдите в аккаунт');const r=await fetch(base+'/rest/v1/'+path,{method,headers:{apikey:key,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',Prefer:'return=representation'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});if(!r.ok)throw Error('Ошибка сохранения или загрузки: '+r.status);return r.status===204?[]:r.json()}function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function status(t,error=false){$('status').textContent=t;$('status').className=error?'error':''}function local(s){const d=new Date(s);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function syncRepeat(){$('repeatEveryLabel').hidden=!$('repeatUnit').value;$('repeatEvery').required=!!$('repeatUnit').value}$('repeatUnit').onchange=syncRepeat;function edit(t){editing=t||null;$('repeatUnit').value=t?.repeat_unit||'';$('repeatEvery').value=t?.repeat_every||1;$('repeatUnit').disabled=!!t?.repeat_generated;$('repeatEvery').disabled=!!t?.repeat_generated;syncRepeat();$('title').value=t?.title||'';$('description').value=t?.description||'';$('point').value=t?.point_id||'';$('pointManual').value=t?.point_manual||'';syncPoint();$('deadline').value=t?.deadline?local(t.deadline):'';syncDeadline();$('startMode').value=t?.scheduled_at?'later':'now';$('scheduled').value=t?.scheduled_at?local(t.scheduled_at):'';syncStart();$('editor').hidden=false;$('title').focus()}function duration(ms){let n=Math.ceil(Math.abs(ms)/1000);const d=Math.floor(n/86400),h=Math.floor(n/3600)%24,m=Math.floor(n/60)%60,s=n%60;return (d?d+' д ':'')+(h?h+' ч ':'')+m+' мин '+String(s).padStart(2,'0')+' сек'}function isScheduled(t){return !t.completed_at&&!!t.scheduled_at&&Date.parse(t.scheduled_at)>Date.now()}function syncStart(){$('startLabel').hidden=$('startMode').value!=='later';$('scheduled').required=!$('startLabel').hidden;$('scheduled').parentElement.classList.toggle('has-value',!!$('scheduled').value)}$('startMode').onchange=syncStart;$('scheduled').oninput=syncStart;$('scheduled').onchange=syncStart;function tick(){for(const card of $('list').querySelectorAll('article[data-id]')){const t=tasks.find(x=>x.id===card.dataset.id);if(!t||t.completed_at)continue;if(isScheduled(t)){const el=card.querySelector('.timer');if(el)el.textContent='Начнётся через '+duration(Date.parse(t.scheduled_at)-Date.now());continue}if(!t.deadline)continue;const left=Date.parse(t.deadline)-Date.now(),total=Math.max(1,Date.parse(t.deadline)-Date.parse(t.timer_start)),pct=Math.max(0,Math.min(100,left/total*100));card.className=left<=0?'red':pct>=70?'green':pct>=40?'yellow':'orange';card.querySelector('.timer').textContent=(left<=0?'Просрочено на ':'Осталось ')+duration(left);card.querySelector('.track span').style.width=pct+'%'}}async function invite(t){const name=prompt('Ник пользователя Эд ПВЗ');if(!name)return;try{const p=await req('edpvz_profiles?select=user_id,username&username=eq.'+encodeURIComponent(name.trim().replace(/^@/, '').toLowerCase()));if(p.length!==1||p[0].user_id===uid)throw Error('Пользователь не найден или это ваш аккаунт');await req('edpvz_personal_task_members','POST',{task_id:t.id,member_id:p[0].user_id});await load()}catch(e){status(e.message,true)}}async function membership(m,accept){try{await req('edpvz_personal_task_members?task_id=eq.'+m.task_id+'&member_id=eq.'+m.member_id,accept?'PATCH':'DELETE',accept?{accepted:true}:undefined);await load()}catch(e){status(e.message,true)}}function render(){const root=$('list');root.replaceChildren();for(const m of members.filter(m=>m.member_id===uid&&!m.accepted)){const a=node('article');a.append(node('h2','Приглашение в совместную задачу'));for(const [s,v] of [['Принять',true],['Отклонить',false]]){const b=node('button',s);b.onclick=()=>membership(m,v);a.append(b)}root.append(a)}const filtered=tasks.filter(t=>tab==='done'?!!t.completed_at:tab==='scheduledTab'?isScheduled(t):!t.completed_a l').hidden=!!$('point').value; }$('point').onchange=()=>{if($('point').value)$('pointManual').value='';syncPoint()};$('pointManual').oninput=()=>{if($('pointManual').value.trim())$('point').value='';syncPoint()};function syncDeadline(){$('deadline').parentElement.classList.toggle('has-value',!!$('deadline').value)}$('deadline').addEventListener('input',syncDeadline);$('deadline').addEventListener('change',syncDeadline);$('add').onclick=()=>edit(null);$('cancel').onclick=()=>{$('editor').hidden=true};$('editor').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const title=$('title').value.trim();if(!title)throw Error('Введите название');const raw=$('deadline').value,deadline=raw?new Date(raw).toISOString():null;const data={title,description:$('description').value,point_id:$('pointManual').value.trim()?null:($('point').value||null),point_manual:$('pointManual').value.trim()||null,deadline};if(!editing||((editing.deadline?local(editing.deadline):'')!==raw))data.timer_start=new Date().toISOString();else data.deadline=editing.deadline;const startRaw=$('startMode').value==='later'?$('scheduled').value:'';if($('startMode').value==='later'&&!startRaw)throw Error('Укажите время начала');const start=startRaw?new Date(startRaw).toISOString():null;if(start&&Date.parse(start)<=Date.now()&&(!editing?.scheduled_at||local(editing.scheduled_at)!==startRaw))throw Error('Выберите будущее время начала');if(start&&deadline&&Date.parse(deadline)<=Date.parse(start))throw Error('Срок должен быть позже начала');data.scheduled_at=start;if(start)data.timer_start=start;else if(editing?.scheduled_at)data.timer_start=new Date().toISOString();if(!editing?.repeat_generated){data.repeat_unit=$('repeatUnit').value||null;data.repeat_every=Number($('repeatEvery').value||1);if(!Number.isInteger(data.repeat_every)||data.repeat_every<1||data.repeat_every>365)throw Error('Укажите интервал от 1 до 365');if(data.repeat_unit&&(!editing||editing.repeat_unit!==data.repeat_unit||editing.repeat

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Личные задачи — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8fc;color:#382c43;font:16px system-ui}main{max-width:850px;margin:auto;padding:16px 16px 40px}h1{font-size:25px;margin:12px 0}p{color:#74687e}button,input,textarea,select{font:inherit}button,a.back{cursor:pointer;border:1px solid #e5d9ed;border-radius:13px;background:white;color:#65458b;padding:10px 14px;text-decoration:none;font-weight:650}button.primary{background:#7442a9;color:white;border:0}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{margin:18px 0}.tabs button{flex:1}.tabs button[aria-selected=true]{background:#eee3fa;border-color:#b99bd8}form{display:grid;gap:12px;background:white;border:1px solid #e5d9ed;padding:16px;border-radius:18px;margin:12px 0}form[hidden]{display:none}label{display:grid;gap:5px;color:#675571;font-size:14px}input,textarea,select{width:100%;border:1px solid #dfd5e6;border-radius:10px;padding:10px;background:#fcfbfd;color:#382c43;font-size:16px}article{--c:#79658b;--bg:#f4f0f8;margin:10px 0;padding:15px;background:var(--bg);border:1px solid var(--c);border-radius:18px;overflow-wrap:anywhere}article.green{--c:#27824e;--bg:#e8f7ed}article.yellow{--c:#a17b10;--bg:#fff5d2}article.orange{--c:#d56b18;--bg:#fff0dc;animation:pulse 1.6s infinite}article.red{--c:#bc3546;--bg:#ffe9eb}article.done{--c:#6d8b78;--bg:#eef5ef} @keyframes pulse{50%{box-shadow:0 0 0 4px #f4a14c55;background:#ffe1b9}}@media(prefers-reduced-motion:reduce){article.orange{animation:none}}h2{font-size:18px;margin:0 0 8px}.desc{white-space:pre-wrap;margin:5px 0}.meta{font-size:13px;color:#675571}.timer{color:var(--c);font-weight:750;font-variant-numeric:tabular-nums;margin:8px 0}.track{height:6px;border-radius:8px;background:#0001;overflow:hidden;margin:8px 0 12px}.track span{display:block;height:100%;background:var(--c);border-radius:8px}.actions button{font-size:13px;padding:8px 10px}.error{color:#b52d42}.empty{text-align:center;padding:35px 10px}</style></head><body><main><a class="back" href="../../">← Назад</a><h1>Личные задачи</h1><p>🔒 Личные задачи видны только вам. Совместные — приглашённым участникам.</p><button class="primary" id="add" disabled>＋ Новая задача</button><form id="editor" hidden><label>Название<input id="title" required maxlength="250"></label><label>Описание<textarea id="description" maxlength="10000" rows="3"></textarea></label><label>Прикрепить ПВЗ<select id="point"><option value="">Без ПВЗ</option></select></label><label>Дедлайн (необязательно)<input id="deadline" type="datetime-local"></label><div class="row"><button class="primary" type="submit">Сохранить</button><button type="button" id="cancel">Отмена</button></div></form><div class="row tabs"><button id="active" aria-selected="true">Активные</button><button id="done" aria-selected="false">Выполненные</button></div><p id="status" role="status">Загрузка…</p><section id="list"></section></main><script src="../../assets/account.js?v=presence-2"></script><script>(()=>{const $=id=>document.getElementById(id),api=window.EdPVZAccount,base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV',table='edpvz_personal_tasks';let members=[],tasks=[],points=new Map(),editing=null,done=false,busy=false,uid='';async function req(path,method='GET',body){const s=await api.ensure();if(!s?.access_token||s.user.id!==uid)throw Error('Войдите в аккаунт');const r=await fetch(base+'/rest/v1/'+path,{method,headers:{apikey:key,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',Prefer:'return=representation'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});if(!r.ok)throw Error('Ошибка сохранения или загрузки: '+r.status);return r.status===204?[]:r.json()}function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function status(t,error=false){$('status').textContent=t;$('status').className=error?'error':''}function local(s){const d=new Date(s);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}function edit(t){editing=t||null;$('title').value=t?.title||'';$('description').value=t?.description||'';$('point').value=t?.point_id||'';$('deadline').value=t?.deadline?local(t.deadline):'';$('editor').hidden=false;$('title').focus()}function duration(ms){let n=Math.ceil(Math.abs(ms)/1000);const d=Math.floor(n/86400),h=Math.floor(n/3600)%24,m=Math.floor(n/60)%60,s=n%60;return (d?d+' д ':'')+(h?h+' ч ':'')+m+' мин '+String(s).padStart(2,'0')+' сек'}function tick(){for(const card of $('list').querySelectorAll('article[data-id]')){const t=tasks.find(x=>x.id===card.dataset.id);if(!t||t.completed_at||!t.deadline)continue;const left=Date.parse(t.deadline)-Date.now(),total=Math.max(1,Date.parse(t.deadline)-Date.parse(t.timer_start)),pct=Math.max(0,Math.min(100,left/total*100));card.className=left<=0?'red':pct>=70?'green':pct>=40?'yellow':'orange';card.querySelector('.timer').textContent=(left<=0?'Просрочено на ':'Осталось ')+duration(left);card.querySelector('.track span').style.width=pct+'%'}}async function invite(t){const name=prompt('Ник пользователя Эд ПВЗ');if(!name)return;try{const p=await req('edpvz_profiles?select=user_id,username&username=eq.'+encodeURIComponent(name.trim().replace(/^@/, '').toLowerCase()));if(p.length!==1||p[0].user_id===uid)throw Error('Пользователь не найден или это ваш аккаунт');await req('edpvz_personal_task_members','POST',{task_id:t.id,member_id:p[0].user_id});await load()}catch(e){status(e.message,true)}}async function membership(m,accept){try{await req('edpvz_personal_task_members?task_id=eq.'+m.task_id+'&member_id=eq.'+m.member_id,accept?'PATCH':'DELETE',accept?{accepted:true}:undefined);await load()}catch(e){status(e.message,true)}}function render(){const root=$('list');root.replaceChildren();for(const m of members.filter(m=>m.member_id===uid&&!m.accepted)){const a=node('article');a.append(node('h2','Приглашение в совместную задачу'));for(const [s,v] of [['Принять',true],['Отклонить',false]]){const b=node('button',s);b.onclick=()=>membership(m,v);a.append(b)}root.append(a)}const filtered=tasks.filter(t=>!!t.completed_at===done).sort((a,b)=>done?Date.parse(b.completed_at)-Date.parse(a.completed_at):(a.deadline?Date.parse(a.deadline):Infinity)-(b.deadline?Date.parse(b.deadline):Infinity));$('active').textContent='Активные ('+tasks.filter(t=>!t.completed_at).length+')';$('done').textContent='Выполненные ('+tasks.filter(t=>t.completed_at).length+')';if(!filtered.length)root.append(node('p',done?'Нет выполненных задач':'Нет активных задач','empty'));for(const t of filtered){const a=node('article');a.dataset.id=t.id;if(t.completed_at)a.className='done';a.append(node('h2',t.title));const shared=members.filter(m=>m.task_id===t.id);if(shared.length)a.append(node('div','Совместная задача · '+shared.filter(m=>m.accepted).length+' участник(ов)','meta'));if(t.description)a.append(node('p',t.description,'desc'));if(t.point_id)a.append(node('div','ПВЗ: '+(points.get(t.point_id)||'Прикреплённый пункт'),'meta'));if(t.deadline)a.append(node('div','Дедлайн: '+new Date(t.deadline).toLocaleString('ru-RU'),'meta'));if(t.completed_at)a.append(node('div','Выполнено: '+new Date(t.completed_at).toLocaleString('ru-RU'),'meta'));else if(t.deadline){const track=node('div',undefined,'track');track.append(node('span'));a.append(node('div','','timer'),track)}else a.append(node('div','Без дедлайна','meta'));const row=node('div',undefined,'row actions');for(const [label,fn] of [[t.completed_at?'Вернуть':'✓ Выполнить',()=>change(t,{completed_at:t.completed_at?null:new Date().toISOString()})],['Изменить',()=>edit(t)],['Удалить',()=>{if(confirm('Удалить задачу?'))change(t,null)}]]){const b=node('button',label);if(t.user_id!==uid&&label!=='✓ Выполнить'&&label!=='Вернуть')continue;b.onclick=fn;row.append(b)}if(t.user_id===uid){const b=node('button','＋ Пригласить');b.onclick=()=>invite(t);row.append(b);for(const m of shared){const x=node('button',m.accepted?'Отозвать доступ':'Отменить приглашение');x.onclick=()=>membership(m,false);row.append(x)}}else{const m=shared.find(m=>m.member_id===uid);if(m){const b=node('button','Покинуть задачу');b.onclick=()=>membership(m,false);row.append(b)}}a.append(row);root.append(a)}tick()}async function load(){const s=await api.ensure();if(!s?.user){tasks=[];render();status('Войдите в профиль для работы с задачами',true);return}uid=s.user.id;tasks=await req(table+'?select=*&order=created_at.desc');members=await req('edpvz_personal_task_members?select=*');render();$('add').disabled=false;status('');try{const rows=await req('edpvz_points?select=point_id,name,address&order=name');points=new Map(rows.map(p=>[p.point_id,[p.name,p.address].filter(Boolean).join(' · ')]));$('point').replaceChildren(new Option('Без ПВЗ',''),...Array.from(points,([id,name])=>new Option(name,id)));render()}catch(e){status('Не удалось загрузить список ПВЗ',true)}}async function change(t,body){if(busy)return;busy=true;try{if(t.user_id!==uid){await req('rpc/personal_task_member_complete','POST',{p_task:t.id,p_done:!!body?.completed_at});await load();return}const rows=await req(table+'?id=eq.'+encodeURIComponent(t.id)+'&user_id=eq.'+encodeURIComponent(uid),body?'PATCH':'DELETE',body||undefined);if(!rows.length)throw Error('Задача недоступна');tasks=tasks.filter(x=>x.id!==t.id);if(body)tasks.push(rows[0]);render();status('')}catch(e){status(e.message,true)}finally{busy=false}}$('add').onclick=()=>edit(null);$('cancel').onclick=()=>{$('editor').hidden=true};$('editor').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const title=$('title').value.trim();if(!title)throw Error('Введите название');const raw=$('deadline').value,deadline=raw?new Date(raw).toISOString():null;const data={title,description:$('description').value,point_id:$('point').value||null,deadline};if(!editing||((editing.deadline?local(editing.deadline):'')!==raw))data.timer_start=new Date().toISOString();else data.deadline=editing.deadline;const rows=await req(table+(editing?'?id=eq.'+encodeURIComponent(editing.id)+'&user_id=eq.'+encodeURIComponent(uid):''),editing?'PATCH':'POST',data);if(!rows.length)throw Error('Не удалось сохранить');tasks=tasks.filter(x=>x.id!==rows[0].id);tasks.push(rows[0]);$('editor').hidden=true;render();status('')}catch(e){status(e.message,true)}finally{busy=false}};for(const id of ['active','done'])$(id).onclick=()=>{done=id==='done';$('done').setAttribute('aria-selected',String(done));$('active').setAttribute('aria-selected',String(!done));render()};setInterval(tick,1000);window.addEventListener('edpvz-auth-changed',()=>{tasks=[];members=[];points.clear();$('editor').hidden=true;$('add').disabled=true;render();load().catch(e=>status(e.message,true))});load().catch(e=>status(e.message,true));})();</script></body></html>

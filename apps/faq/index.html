<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fce7f1"><title>Вопросы — ответы · Эд ПВЗ</title><link rel="icon" href="../../icons/icon.svg" type="image/svg+xml"><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#342d39;background:#faf8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px 16px 55px}header{display:flex;gap:12px;align-items:center;margin-bottom:20px}h1{font-size:clamp(23px,4vw,31px);margin:0}p{color:#726a76;margin:7px 0 18px}.back{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border:1px solid #e5d8e6;border-radius:13px;color:inherit;text-decoration:none;background:white;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px}.tile{text-align:left;cursor:pointer;min-height:142px;border:1px solid #e7dbe6;border-radius:17px;padding:17px;background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:inherit;box-shadow:0 2px 9px #36253d08;transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-2px);border-color:#bfa4be}.tile:focus-visible,.back:focus-visible{outline:3px solid #9c56b1;outline-offset:2px}.symbol{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#f9e4f1;color:#a12d77}.symbol svg{width:25px;height:25px}.blue .symbol{background:#e4efff;color:#2d6abb}.yellow .symbol{background:#fff3d4;color:#98630b}.green .symbol{background:#e0f5e8;color:#248153}.purple .symbol{background:#efe5fc;color:#8050a6}.cyan .symbol{background:#dff5f9;color:#187e92}.tile b{font-size:15px}.tile small{font-size:12px;color:#736a78}#detail{display:none}#detail:target{display:block}#detail:target~#topics{display:none}.notice[hidden]{display:none}.notice{border:1px solid #e7dbe6;border-radius:16px;background:white;padding:20px;margin-top:18px;line-height:1.6}.muted{color:#736a78}@media(max-width:450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{padding:13px;min-height:150px}.tile b{font-size:14px}.wrap{padding:15px 12px}}details.qa{border:1px solid #e7dbe6;border-radius:14px;background:white;margin:10px 0;padding:14px 16px}details.qa summary{cursor:pointer;font-weight:650;line-height:1.4}details.qa p{line-height:1.6;color:#423847}details.qa a{color:#8d377d}#topicTitle{margin-top:20px}</style></head><body><main class="wrap"><header><a class="back" href="../../">← Главная</a><div><h1>Вопросы — ответы</h1><p>Справочник по темам работы ПВЗ</p></div></header><section id="detail" aria-live="polite"><a class="back" href="#topics" id="backTopics">← Все темы</a><h2 id="topicTitle"></h2><div id="answers" class="answers"></div><div class="notice" id="emptyAnswers"><strong>Материалы готовятся</strong><p>В этом разделе пока нет подтверждённых ответов. Не используйте непроверенные советы из переписок как официальные правила.</p></div></section><section id="topics"><div class="grid"><button class="tile pink" type="button" data-topic="0"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s8-5.5 8-12a8 8 0 1 0-16 0c0 6.5 8 12 8 12z M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg></span><b>Адреса и переезды</b><small>Вопросы и ответы по теме</small></button><button class="tile blue" type="button" data-topic="1"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10v11h14V10M3 10l2-7h14l2 7M9 21v-7h6v7"/></svg></span><b>Открытие, закрытие, ИП</b><small>Вопросы и ответы по теме</small></button><button class="tile yellow" type="button" data-topic="2"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M5 9a8 8 0 0 1 14-2l1 5M4 12l1 5a8 8 0 0 0 14-2"/></svg></span><b>Ресейл</b><small>Вопросы и ответы по теме</small></button><button class="tile green" type="button" data-topic="3"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5zM3 7l9 5 9-5M12 12v10"/></svg></span><b>Расходники</b><small>Вопросы и ответы по теме</small></button><button class="tile purple" type="button" data-topic="4"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14M6 5v14M10 5v14M13 5v14M17 5v14M21 5v14"/></svg></span><b>Возвраты, товары, ШК</b><small>Вопросы и ответы по теме</small></button><button class="tile cyan" type="button" data-topic="5"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><b>Выдача, клиенты</b><small>Вопросы и ответы по теме</small></button><button class="tile pink" type="button" data-topic="6"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h12v12H3zM15 9h4l3 4v4h-7M7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4M19 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/></svg></span><b>Курьеры</b><small>Вопросы и ответы по теме</small></button><button class="tile blue" type="button" data-topic="7"><span class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1 13H5L4 8zM9 9V6a3 3 0 0 1 6 0v3"/></svg></span><b>Селлеры</b><small>Вопросы и ответы по теме< 1 0 0-8 4 4 0 0 0 0 8"/></svg></span><b>Камеры</b><small>Вопросы и ответы по теме</small></button></div></section></main><script>const topics=["Адреса и переезды","Открытие, закрытие, ИП","Ресейл","Расходники","Возвраты, товары, ШК","Выдача, клиенты","Курьеры","Селлеры","Рейтинг","Зависшие, браки, подмены","Поставки, отгрузки","Площади, помещения","Форс-мажор","Камеры"];const faq=[{"topic":4,"q":"Что делать, если оплата заказа при выдаче не проходит?","a":"После трёх неудачных нажатий «Оплатить и выдать» может появиться обращение «Проблема с оплатой». По инструкции WB нужно в течение 24 часов приложить ссылку на доступное для просмотра видеодоказательство. Перед закрытием ПВЗ снимите товары с примерки, не отменяя заказ. Условия могут обновляться.","url":"https://t.me/s/wbpvzlearning/1337"},{"topic":9,"q":"Что важно при оспаривании зависшего ШК или подмены?","a":"Прикладывайте доступные для просмотра видеодоказательства, не защищённые паролем. Не удаляйте материалы до завершения рассмотрения. Если поддержка запросит дополнительные сведения, отвечайте в установленный срок; в опубликованной инструкции указан срок 72 часа.","url":"https://t.me/s/wbpvzlearning/950"},{"topic":9,"q":"Что означает статус «К удержанию»?","a":"В материалах WB этот раздел описан как товары, по которым доступно оспаривание в течение 7 дней с появления в отчёте. Проверяйте актуальный срок и условия непосредственно в личном кабинете.","url":"https://t.me/s/wbpvzlearning?q=%23%D0%BD%D0%BE%D0%B2%D1%8B%D0%B9_%D1%84%D1%83%D0%BD%D0%BA%D1%86%D0%B8%D0%BE%D0%BD%D0%B0%D0%BB"},{"topic":12,"q":"Что делать при подозрительном запросе кода доступа от «поддержки»?","a":"Не передавайте коды доступа и не переходите по подозрительным ссылкам. При подозрении на компрометацию завершите активные сеансы и обратитесь в поддержку через официальный интерфейс WB.","url":"https://t.me/s/wbpvzlearning?before=1352"},{"topic":1,"q":"Что делать, если WB отказал новому собственнику при смене ИП?","asker":".","answers":[{"name":"Натусик Малыффка","text":"Попробовать подать заявку ещё раз позже. Участница назвала возможными причинами долги нового собственника или недавно открытое ИП; предложила также рассмотреть другое ИП."}],"url":"https://t.me/wbpointchat/183247"},{"topic":4,"q":"Как вернуть зависший штрихкод?","asker":"Anastasya","answers":[{"name":"Zhaslan","text":"Просто добавляйте в возвратную коробку программно и физически."}],"url":"https://t.me/wbpointchat/167870"},{"topic":10,"q":"Что делать, если крупногабаритный товар добавили в общую возвратную коробку и закрыли её?","asker":"Алина","answers":[{"name":"Вадим","text":"Примите его в излишки и переоформите заново."}],"url":"https://t.me/wbpointchat/181036"},{"topic":10,"q":"Можно ли завершить приёмку утром, если поставка приехала перед закрытием?","asker":"Семён","answers":[{"name":"Виктория","text":"Ориентируйтесь на срок приёмки, указанный в программе. Если там указано «до 10 утра», участница считает, что завершить можно до этого времени."}],"url":"https://t.me/wbpointchat/188841"},{"topic":11,"q":"Почему тариф ПВЗ мог снизиться с 6% до 4%?","asker":"Дмитрий","answers":[{"name":"Сергей Коробков","text":"Проверьте площадь в настройках: не изменилась ли она."}],"url":"https://t.me/wbpointchat/189536"},{"topic":3,"q":"Что делать, если закончились этикетки для переупаковки?","asker":"Марина Егорова","answers":[{"name":"Вадим","text":"Отключите переупаковку в «Мой ПВЗ»."}],"url":"https://t.me/wbpointchat/190583"},{"topic":11,"q":"Кто оплачивает замену сломанной вывески ПВЗ?","asker":"Hermine","answers":[{"name":"Анна","text":"По опыту участницы, ремонт или покупку новой вывески организует сам владелец ПВЗ."}],"url":"https://t.me/wbpointchat/186224"},{"topic":4,"q":"Почему товары попадают на разные ячейки при приёмке?","asker":".","answers":[{"name":"ВЛАДЕЛЕЦ А.К","text":"Возможная причина — приёмка с двух устройств одновременно под одним аккаунтом."},{"name":"katze 🍂","text":"Рекомендует принимать товары с одного устройства, если используются два или больше."}],"url":"https://t.me/wbpointchat/180505"}];function showTopic(i){document.getElementById('topicTitle').textContent=topics[i];const wrap=document.getElementById('answers');wrap.replaceChildren();const selected=faq.filter(x=>x.topic===i);document.getElementById('emptyAnswers').hidden=selected.length>0;selected.forEach(x=>{const d=document.createElement('details');d.className='qa';const summary=document.createElement('summary');summary.textContent=x.q;const p=document.createElement('p');p.textContent=x.a;const link=document.createElement('a');link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Источник: публикация WB';if(x.asker){const who=document.createElement('p');who.className='muted';who.textContent='Спрашивает: '+x.asker;d.append(summary,who)}else d.append(summary);if(x.answers){x.answers.forEach(ans=>{const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=ans.name+': ';p.append(strong,document.createTextNode(ans.text));d.append(p)})}else d.append(p);link.textContent=x.asker?'Обсуждение в чате':'Источник: публикация WB';d.append(link);wrap.append(d)})}document.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{showTopic(Number(b.dataset.topic));location.hash='detail'}));window.addEventListener('hashchange',()=>{if(location.hash!=='#detail')document.getElementById('detail').style.display=''});</script></body></html>

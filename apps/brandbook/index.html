umns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px;padding:12px;background:#faf7fa}.card .gallery img{border-radius:9px;max-height:460px;object-fit:contain}.card .gallery:empty{display:none}.card .gallery[data-missing]:not(:has(img:not([style*="display: none"])))::after{content:attr(data-missing);color:#8a7381;font-size:12px;padding:12px}.card .body{white-space:pre-line!important;line-height:1.8!important;letter-spacing:.01em}.card h3{line-height:1.35}.card{break-inside:avoid} .card .gallery{grid-template-columns:1fr!important;padding:0!important;background:#fff!important}.card .gallery img{max-height:none!important;width:100%;height:auto;object-fit:contain;border-radius:0!important}.card .source{margin:0;border-top:1px solid #eee4ed}.card .source summary{padding:13px 15px;font-weight:600;color:#514354;cursor:pointer}.card .source .body{padding:12px 15px 20px;white-space:normal!important;line-height:1.6!important}.card h3{font-size:16px}.card small{font-size:12px}#cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))!important}@media(max-width:700px){#cards{grid-template-columns:1fr!important}.main{padding:12px!important}.card{border-radius:12px}}  .meaning{padding:14px;display:grid;gap:12px}.topic{padding:14px 15px;border:1px solid #eae4eb;border-radius:13px;background:#fff}.topic h4{font-size:14px;margin:0 0 10px;font-weight:750;color:#3b2d3a}.topic p{font-size:14px;line-height:1.6;margin:0;padding:8px 0;white-space:normal}.topic p+p{border-top:1px solid #f2eef2}.topic.warnings{background:#fff7f8;border-color:#f0d8df}.topic.sizes{background:#f8f5fb}.card .gallery{padding:10px!important}.card .gallery img{border-radius:10px!important}.card .source{margin-top:4px} </style></head><body><header><a class="back" href="../../">← Все инструменты Эд ПВЗ</a><div class="hero"><h1>Брендбуки Wildberries</h1><p>Оригинальные формулировки и иллюстрации, разделённые по темам. Стандартный и упрощённый форматы.</p></div><div class="tabs"><button class="tab on" data-mode="standard">Стандартный · 185 страниц</button><button class="tab" data-mode="simplified">Упрощённый · 33 страницы</button></div><input id="q" class="search" placeholder="Поиск по тексту: вывеска, розетки, примерочная…" type="search"><div class="actions"><button class="action" id="all">Все темы</button></div></header><div class="main layout"><aside id="toc"></aside><main><h2 id="heading">Входная группа</h2><p id="count" class="muted"></p><div id="cards"></div><button class="more" id="more" hidden>Показать ещё</button></main></div><script>const groups={standard:[['О документе',1,3],['Входная группа',4,38],['Планировка',39,72],['Ремонт',73,130],['Мебель',131,153],['Текстиль',154,160],['Брендирование',161,173],['Информационные материалы',174,185]],simplified:[['О документе',1,8],['Входная группа',9,20],['Оборудование и мебель',21,26],['Брендирование',27,33]]};let data={},mode='standard',section=1,matching=[],pos=0;const el=id=>document.getElementById(id);function setMode(m){mode=m;section=1;el('q').value='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));update()}function toc(){el('toc').replaceChildren();groups[mode].forEach(([name,a,b],i)=>{const btn=document.createElement('button');btn.textContent=name+' · '+a+'–'+b;btn.className=i===section?'on':'';btn.onclick=()=>{section=i;el('q').value='';update()};el('toc').append(btn)})}function update(){toc();const query=el('q').value.trim().toLocaleLowerCase('ru');matching=data[mode].filter(p=>query?(p.text+' '+p.title).toLocaleLowerCase('ru').includes(query):section<0||p.page>=groups[mode][section][1]&&p.page<=groups[mode][section][2]);el('heading').textContent=query?'Результаты поиска':section<0?'Все темы':groups[mode][section][0];el('count').textContent=matching.length+' страниц';el('cards').replaceChildren();pos=0;append()}function makeSections(p){const raw=p.text.replace(/\u0003/g,' ').replace(/\u2028/g,'\n');const lines=raw.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);const title=p.title.replace(/\s+/g,' ').trim();const candidates=[];let buffer=[];function flush(){if(!buffer.length)return;const joined=buffer.join(' ').replace(/\s+/g,' ').trim();buffer=[];if(joined.length>8&&!/^\d{1,3}$/.test(joined)&&!candidates.includes(joined))candidates.push(joined)}for(const line of lines){if(/^\d{1,3}$/.test(line)||/^\d{1,2}\s+\d{1,2}$/.test(line))continue;if(line.length<70&&(/[:：]$/.test(line)||/^(?:Вариант|Базовый набор|Дополнительные|Что здесь|Размер|Важно|Запрещено|Рекомендуем|Если|Где|Как|Нужно|Можно)/i.test(line))){flush();buffer.push(line);continue}if(buffer.join(' ').length+line.length>220)flush();buffer.push(line);if(/[.!?]$/.test(line)&&buffer.join(' ').length>55)flush()}flush();const bins={main:[],sizes:[],options:[],warnings:[],other:[]};for(let t of candidates){if(t.length<14||t===title||title.startsWith(t)&&t.length<65)continue;const small=t.toLowerCase();if(/запрещ|не долж|нельзя|обязательно|не забуд|согласу|требовани|пожалуйста|не менее|не больше|не устанавлива|не размеща|должен|должна/.test(small))bins.warnings.push(t);else if(/(?:\d+\s*[×хx]\s*\d+|\d+\s*(?:см|мм|м²|метр|м\b)|размер|высот|ширин|расстояни|отступ)/i.test(t))bins.sizes.push(t);else if(/вариант|альтернатив|дополнительн|можно|по желанию|если|подойдёт|выберите/.test(small))bins.options.push(t);else if(/^\s*(?:[—–-]\s*)?(?:что |как |где |базов|постав|установ|размест|провед|покрас|отдел|использ|сдел|повесь|наклей|планир)/i.test(t)||t.length>65)bins.main.push(t);else bins.other.push(t)}return bins}
function sectionBlock(parent,label,items,kind){if(!items.length)return;const section=document.createElement('section');section.className='topic '+kind;const h=document.createElement('h4');h.textContent=label;section.append(h);for(const t of items){const p=document.createElement('p');p.textContent=t;section.append(p)}parent.append(section)}
function renderMeaning(card,p){const bins=makeSections(p);const wrapper=document.createElement('div');wrapper.className='meaning';sectionBlock(wrapper,'Что нужно сделать',bins.main,'main');sectionBlock(wrapper,'Размеры и размещение',bins.sizes,'sizes');sectionBlock(wrapper,'Варианты и рекомендации',bins.options,'options');sectionBlock(wrapper,'Важные условия',bins.warnings,'warnings');sectionBlock(wrapper,'Дополнительная информация',bins.other,'other');if(wrapper.children.length)card.append(wrapper)}function append(){const batch=matching.slice(pos,pos+12);pos+=batch.length;for(const p of batch){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=p.title.replace(/\s+/g,' ').slice(0,105);const number=document.createElement('small');number.textContent='Страница '+p.page;card.append(h,number);const gallery=document.createElement('div');gallery.className='gallery';for(const src of p.media){const img=document.createElement('img');img.src='../../'+src;img.loading='lazy';img.alt='Иллюстрация из брендбука, страница '+p.page;img.onerror=()=>{img.style.display='none';gallery.dataset.missing='Иллюстрация временно недоступна'};gallery.append(img)}card.append(gallery);renderMeaning(card,p);const details=document.createElement('details');details.className='source';const summary=document.createElement('summary');summary.textContent='Полный текст страницы из документа';const body=document.createElement('div');body.className='body';body.textContent=p.text.replace(/[\u0000-\u001f\u2028\u2029]+/g,' ').replace(/\s+/g,' ').trim();details.append(summary,body);card.append(details);el('cards').append(card)}el('more').hidden=pos>=matching.length}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));el('q').oninput=update;el('all').onclick=()=>{section=-1;el('q').value='';update()};el('more').onclick=append;fetch('../../content.json?v=20261107b').then(r=>{if(!r.ok)throw Error('Missing content.json');return r.json()}).then(j=>{data=j;update()}).catch(()=>{el('count').textContent='Не найден content.json. Загрузите файл данных в apps/brandbook/.'});</script></body></html>

</div><button class="more" id="more" hidden>Показать ещё</button></main></div><script>const groups={standard:[['О документе',1,3],['Входная группа',4,38],['Планировка',39,72],['Ремонт',73,130],['Мебель',131,153],['Текстиль',154,160],['Брендирование',161,173],['Информационные материалы',174,185]],simplified:[['О документе',1,8],['Входная группа',9,20],['Оборудование и мебель',21,26],['Брендирование',27,33]]};let data={},mode='standard',section=1,matching=[],pos=0;const el=id=>document.getElementById(id);function setMode(m){mode=m;section=1;el('q').value='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));update()}function toc(){el('toc').replaceChildren();groups[mode].forEach(([name,a,b],i)=>{const btn=document.createElement('button');btn.textContent=name+' · '+a+'–'+b;btn.className=i===section?'on':'';btn.onclick=()=>{section=i;el('q').value='';update()};el('toc').append(btn)})}function update(){toc();const query=el('q').value.trim().toLocaleLowerCase('ru');matching=data[mode].filter(p=>query?(p.text+' '+p.title+' '+JSON.stringify(checked[mode]?.[p.page]||'')).toLocaleLowerCase('ru').includes(query):section<0||p.page>=groups[mode][section][1]&&p.page<=groups[mode][section][2]);el('heading').textContent=query?'Результаты поиска':section<0?'Все темы':groups[mode][section][0];el('count').textContent=matching.length+' страниц · оригинальные схемы и иллюстрации';el('cards').replaceChildren();pos=0;append()}function makeSections(p){const raw=p.text.replace(/\u0003/g,' ').replace(/\u2028/g,'\n');const lines=raw.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);const title=p.title.replace(/\s+/g,' ').trim();const candidates=[];let buffer=[];function flush(){if(!buffer.length)return;const joined=buffer.join(' ').replace(/\s+/g,' ').trim();buffer=[];if(joined.length>8&&!/^\d{1,3}$/.test(joined)&&!candidates.includes(joined))candidates.push(joined)}for(const line of lines){if(/^\d{1,3}$/.test(line)||/^\d{1,2}\s+\d{1,2}$/.test(line))continue;if(line.length<70&&(/[:：]$/.test(line)||/^(?:Вариант|Базовый набор|Дополнительные|Что здесь|Размер|Важно|Запрещено|Рекомендуем|Если|Где|Как|Нужно|Можно)/i.test(line))){flush();buffer.push(line);continue}if(buffer.join(' ').length+line.length>220)flush();buffer.push(line);if(/[.!?]$/.test(line)&&buffer.join(' ').length>55)flush()}flush();const bins={main:[],sizes:[],options:[],warnings:[],other:[]};for(let t of candidates){if(t.length<14||t===title||title.startsWith(t)&&t.length<65)continue;const small=t.toLowerCase();if(/запрещ|не долж|нельзя|обязательно|не забуд|согласу|требовани|пожалуйста|не менее|не больше|не устанавлива|не размеща|должен|должна/.test(small))bins.warnings.push(t);else if(/(?:\d+\s*[×хx]\s*\d+|\d+\s*(?:см|мм|м²|метр|м\b)|размер|высот|ширин|расстояни|отступ)/i.test(t))bins.sizes.push(t);else if(/вариант|альтернатив|дополнительн|можно|по желанию|если|подойдёт|выберите/.test(small))bins.options.push(t);else if(/^\s*(?:[—–-]\s*)?(?:что |как |где |базов|постав|установ|размест|провед|покрас|отдел|использ|сдел|повесь|наклей|планир)/i.test(t)||t.length>65)bins.main.push(t);else bins.other.push(t)}return bins}

const checked={standard:{2:[["Если ПВЗ уже работает",["Ремонт делать не надо. Изучите разделы про оформление входной группы и помещения перед следующим плановым ремонтом."]],["Если планируете новый ПВЗ",["Изучите руководство до поиска помещения: рекомендации по ремонту и планировке помогут с выбором."]],["Требования",["ПВЗ должен отвечать строительным, санитарным, противопожарным и другим требованиям закона, а также правилам Wildberries на портале и в оферте."]]],6:[["Порядок действий",["Согласовать размещение конструкций.","Установить вывеску, панель-кронштейн, лайтбокс или табличку.","Продумать навигацию до пункта выдачи.","Привести в порядок территорию у входа.","Установить электронный замок и контроллер."]]],8:[["Подсветка",["Вывеска, панель-кронштейн и лайтбокс с режимом работы должны светиться днём и ночью."]]],10:[["Виды вывесок",["Объёмные световые буквы на подрамнике — приоритетный вариант.","Объёмные буквы на цветной подложке.","Объёмные белые световые буквы на подрамнике.","Мини-версия цветная.","Мини-версия белая."]],["Выбор",["Учитывайте дизайн-код населённого пункта, оформление соседних вывесок и размеры фасада."]]],11:[["Стандартные размеры",["Большая: 50 × 325 см.","Средняя: 40 × 260 см.","Маленькая: 30 × 204 см."]],["При ограничениях по высоте",["25 × 162,5 см.","20 × 130 см.","15 × 97,5 см."]]],12:[["Подложка",["Закажите подложку самостоятельно: её размеры зависят от фриза.","Соблюдайте охранные поля — см. страницу 16."]]],13:[["Стандартные размеры",["Большая: 50 × 325 см.","Средняя: 40 × 260 см.","Маленькая: 30 × 204 см."]],["При ограничениях по высоте",["25 × 162,5 см.","20 × 130 см.","15 × 97,5 см."]]],14:[["Стандартные размеры",["Большая: 50 × 82,6 см.","Средняя: 40 × 66,1 см.","Маленькая: 30 × 49,6 см."]],["При ограничениях по высоте",["25 × 41,3 см.","20 × 33 см.","15 × 24,8 см."]]],15:[["Стандартные размеры",["Большая: 50 × 90 см.","Средняя: 40 × 72 см.","Маленькая: 30 × 54 см."]],["При ограничениях по высоте",["25 × 45,4 см.","20 × 36 см.","15 × 27 см."]]],16:[["Охранные поля",["Вокруг логотипа оставляйте свободное пространство.","Минимальное и рекомендуемое охранные поля рассчитываются относительно элементов букв логотипа; точные схемы — на оригинальной иллюстрации."]]],18:[["Размещение на фасаде",["Если рядом есть другие вывески, расположите свою на одном уровне с ними.","Центральная ось вывески — на линии перекрытия между первым и вторым этажами или ниже.","Вывеска должна оставаться в границах помещения ПВЗ."]]],19:[["Размещение на фризе",["Вывеска должна находиться строго в границах фриза.","Высота объёмных букв — не более 70% высоты фриза.","Для прямоугольной подложки: высота как у фриза, длина как у фасада помещения ПВЗ.","Подложка должна стыковаться с подложками соседних компаний."]]],20:[["Размещение на козырьке",["Подложка должна полностью совпадать по размеру с козырьком и закрывать его.","Если козырёк светлый и гладкий либо уже есть светлая подложка, можно использовать объёмные световые буквы на подрамнике."]]],21:[["Для цокольного помещения",["Вывеску можно разместить над окнами.","От нижнего края вывески до земли — не менее 60 см.","Максимальная высота вывески — 50 см.","Максимальная глубина вывески — 10 см.","Вывеска должна оставаться в границах помещения ПВЗ."]]],23:[["Место установки",["Центральная ось панели-кронштейна — на линии перекрытия или ниже.","При наличии соседних панелей-кронштейнов установите свою на одном уровне.","Панель может быть справа или слева от вывески, но в границах помещения.","Высота размещения по схеме — не менее 250 см."]]],25:[["Расположение лайтбокса",["Слева или справа от двери на высоте 165 см от пола.","Отступ от дверного проёма — 20 см.","Если расстояние между дверью и окном 50–80 см, разместите лайтбокс по центру между ними.","Если расстояние меньше 50 см — справа от двери."]],["Подключение",["Подсветка должна работать круглосуточно.","Провода лучше скрыть; при необходимости использовать кабель-канал с соблюдением требований к электропроводке."]]],26:[["Недопустимые варианты",["Слишком близко к двери.","Выше или ниже уровня глаз.","С видимой проводкой."]]],27:[["Когда нужна табличка",["Если фасад состоит из панорамных окон или установка лайтбокса на здании запрещена.","Используйте пластиковую табличку и наклейку с режимом работы и юридическими данными."]],["Размер",["40 × 40 см."]]],29:[["Юридическая информация",["На табличке и лайтбоксе укажите наименование организации, реквизиты и юридический адрес.","Передайте в типографию макет и юридические данные для внесения перед печатью."]],["Оформление",["Кавычки-ёлочки «».","Текст в 3 или 4 строки.","ИНН и ОГРН — в первой или второй строке; юридический адрес — в последующих строках."]]],30:[["Наклейки на дверь",["Режим работы — 30 × 30 см.","Направление двери «На себя» или «От себя» — 5 × 10 см."]]],31:[["Где наклеить",["Стикер режима работы — по центру стеклянной двери на высоте 165 см от пола.","Наклейки «От себя» и «На себя» — ближе к ручке на высоте 120 см.","Перед наклеиванием обезжирьте поверхность."]]],32:[["Когда нужна навигация",["Если ПВЗ сложно найти, продумайте путь от остановок и торговых центров.","При входе со двора или торца указатели на фасаде возможны, если разрешены нормативами."]],["Варианты",["Табличка из ПЭТ или акрила с УФ-печатью — для улицы и непрозрачных поверхностей.","Инвертированная наклейка с фирменным фоном — для стеклянных поверхностей."]]],33:[["Размещение навигации",["По направлению к ПВЗ на уровне глаз — 165 см от пола.","Между окон или дверей — по центру между проёмами.","Наклейку на витрине размещайте по центру.","Согласуйте навигацию до монтажа."]]],34:[["Территория у входа",["Отремонтируйте повреждённые стены, лестницу, козырёк, двери и окна.","Установите урну для мусора.","Предусмотрите съезды и пандусы для посетителей на колясках и родителей с детьми."]]],35:[["Доступ без ключей",["Установите систему WB-Lock для управления входной дверью через приложение на смартфоне."]],["Когда замок не нужен",["Если стоят рольставни или стеклянные двери.","Если в регионе суровый климат."]]],42:[["Разделение площади",["Под склад — не менее 50% площади, предпочтительно 60–70%.","Под клиентскую зону — 30–50%.","Предусмотрите проход на склад."]],["Клиентская зона",["Рабочая зона, зона проверки, примерочные; по возможности ожидание и детская зона."]],["Склад",["Зона хранения, туалет, стол для работы."]]],48:[["Базовая мебель",["Стол менеджера.","Кресло.","Стол выдачи."]],["Расположение",["Напротив входа, чтобы менеджер встречал клиентов.","Близко к складу.","Не менее 100 см от стены."]]],51:[["Мебель зоны ожидания",["Зеркало, скамейка и урна.","Скамейки и урны разместите вдоль очереди к столу выдачи."]],["Проход",["Оставьте проход шириной 135 см."]]],57:[["Зона проверки",["Стол для проверки товаров.","Скамейка, если есть место."]],["Расположение",["При двух столах поставьте их в ряд или спинками друг к другу.","Разместите в 100–300 см от стола менеджера.","Между мебелью оставьте проход не менее 100 см."]]],60:[["Безопасность детской зоны",["Выбирайте устойчивую и прочную мебель с закруглёнными углами.","В детской зоне не должно быть розеток, проводов, батарей и зеркал."]]],64:[["Расстановка стеллажей",["Вдоль стен — один ряд, в центре — островок из двух рядов."]],["Проходы",["Оптимальная ширина — 100 см.","В маленьком ПВЗ с одним менеджером проход может быть 70 см."]],["Безопасность",["Не перекрывайте стеллажами эвакуационные выходы, пожарные краны и электрические счётчики."]]],65:[["Оборудование склада",["Стеллажи, полки, боковые и задние стенки.","Скрепите стеллажи болтами между собой и прикрепите к стене или полу."]]],69:[["Туалетная комната",["Существующий туалет сохраните и отремонтируйте.","Если есть только мокрая точка, отведите её под туалетную комнату."]],["Видеонаблюдение",["Камеры не должны быть направлены на туалетную комнату, в том числе внутрь неё."]]],71:[["Обязательно",["Унитаз.","Раковина.","Гигиенический душ."]],["Дополнительно",["Мусорное ведро, ёршик, держатель бумаги, дозатор мыла, диспенсер полотенец, зеркало."]],["Запрет",["Камеры видеомониторинга внутри туалетной комнаты запрещены."]]],77:[["Разделение помещения",["Перегородка отделяет склад от клиентской зоны.","Варианты: закрытый вход, открытый вход или сохранение существующего проёма.","Новые перегородки согласуйте с арендодателем до начала работ."]]],79:[["Закрытый вход на склад",["Оставьте проём шириной 150 см.","Если проём расположен за столом менеджера, минимальная ширина перегородки — 150 см для бренд-стены."]]],80:[["Открытый вход на склад",["Штора не требуется, если клиентам не виден склад.","При высоте потолка 270 см или меньше перегородка должна быть до потолка."]]],86:[["Покрытие пола",["Пол должен быть ровным и нескользким.","При высокой проходимости предпочтительны плитка или коммерческий линолеум."]]],87:[["Плитка",["Kerama Marazzi, керамогранит терраццо светло-серый SG632400R.","Допустимый бежевый вариант — SG631800R.","Размер 60 × 60 см.","Затирка Ceresit серого цвета (07)."]],["При заказе",["Производитель может менять артикулы: называйте продавцу полное название плитки."]]],88:[["Укладка плитки",["Начинайте от центра помещения, чтобы по краям остались отрезки одинаковой ширины.","Не начинайте от угла — это нарушит симметрию."]]],89:[["Плинтус",["Рекомендуется плинтус из той же плитки, что и пол.","Размер — 60 × 20 см."]]],101:[["Где нужны розетки",["В примерочных при наличии светильников.","У стола проверки товаров для тестирования техники.","У стола менеджера для рабочего оборудования."]]],113:[["Рекламный экран",["Если планируете установить экран, предусмотрите место на этапе ремонта.","Не перекрывайте элементы брендирования и соблюдайте отступ от бренд-стены."]]],118:[["Климатическое оборудование",["Кондиционер и тепловая завеса не обязательны.","Решение зависит от условий в помещении."]]],127:[["Пожарная безопасность",["Эвакуационные выходы должны вести на улицу или в безопасную зону.","Пути эвакуации и оборудование необходимо предусмотреть заранее; подробности — в оригиналь

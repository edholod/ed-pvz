<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Брендбуки Wildberries — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9fb;color:#302b32;font:15px/1.5 system-ui,-apple-system,Arial,sans-serif}button,input{font:inherit}header,.main{max-width:1150px;margin:auto;padding:18px}.back{font-size:13px;color:#736a76;text-decoration:none}.hero{background:#fce7f1;border-radius:20px;padding:23px;margin:15px 0}.hero h1{margin:0;font-size:32px}.hero p{margin:7px 0 0;color:#755c6c}</style><style>.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.tab,.action,.more{background:white;border:1px solid #e6dfe7;border-radius:12px;padding:11px 14px;color:#332d36;cursor:pointer}.tab.on{background:#302633;color:white}.search{width:100%;border:1px solid #e4dce5;border-radius:12px;padding:13px;font-size:16px}.layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}aside{background:#fff;border:1px solid #eee7ee;border-radius:16px;padding:12px;position:sticky;top:12px}aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px;border-radius:9px}aside button.on{background:#fce7f1}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}.card{background:#fff;border:1px solid #eee7ee;border-radius:16px;overflow:hidden}.card h3{font-size:17px;margin:0;padding:14px 14px 3px}.card small{display:block;color:#8c7d8b;padding:0 14px 9px}.card img{width:100%;height:auto;display:block;object-fit:contain;background:#f4f1f5}.card .body{padding:13px 15px;white-space:pre-wrap;font:14px/1.6 system-ui,Arial,sans-serif;overflow-wrap:anywhere}.muted{color:#857b86;font-size:13px}.more{margin:16px auto;display:block}.more[hidden]{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{position:static}#cards{grid-template-columns:1fr}}</style></head><body><header><a class="back" href="../../">← Все инструменты Эд ПВЗ</a><div class="hero"><h1>Брендбуки Wildberries</h1><p>Оригинальные формулировки и иллюстрации, разделённые по темам. Стандартный и упрощённый форматы.</p></div><div class="tabs"><button class="tab on" data-mode="standard">Стандартный · 185 страниц</button><button class="tab" data-mode="simplified">Упрощённый · 33 страницы</button></div><input id="q" class="search" placeholder="Поиск по тексту: вывеска, розетки, примерочная…" type="search"><div class="actions"><button class="action" id="all">Все темы</button></div></header><div class="main layout"><aside id="toc"></aside><main><h2 id="heading">Входная группа</h2><p id="count" class="muted"></p><div id="cards"></div><button class="more" id="more" hidden>Показать ещё</button></main></div><script>const groups={standard:[['О документе',1,3],['Входная группа',4,38],['Планировка',39,72],['Ремонт',73,130],['Мебель',131,153],['Текстиль',154,160],['Брендирование',161,173],['Информационные материалы',174,185]],simplified:[['О документе',1,8],['Входная группа',9,20],['Оборудование и мебель',21,26],['Брендирование',27,33]]};let data={},mode='standard',section=1,matching=[],pos=0;const el=id=>document.getElementById(id);function setMode(m){mode=m;section=1;el('q').value='';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));update()}function toc(){el('toc').replaceChildren();groups[mode].forEach(([name,a,b],i)=>{const btn=document.createElement('button');btn.textContent=name+' · '+a+'–'+b;btn.className=i===section?'on':'';btn.onclick=()=>{section=i;el('q').value='';update()};el('toc').append(btn)})}function update(){toc();const query=el('q').value.trim().toLocaleLowerCase('ru');matching=data[mode].filter(p=>query?(p.text+' '+p.title).toLocaleLowerCase('ru').includes(query):section<0||p.page>=groups[mode][section][1]&&p.page<=groups[mode][section][2]);el('heading').textContent=query?'Результаты поиска':section<0?'Все темы':groups[mode][section][0];el('count').textContent=matching.length+' страниц';el('cards').replaceChildren();pos=0;append()}function append(){const batch=matching.slice(pos,pos+12);pos+=batch.length;for(const p of batch){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=p.title;const number=document.createElement('small');number.textContent='Страница '+p.page;card.append(h,number);for(const src of p.media){const img=document.createElement('img');img.src=src;img.loading='lazy';img.alt='Оригинальная иллюстрация из брендбука, страница '+p.page;card.append(img)}const body=document.createElement('div');body.className='body';body.textContent=p.text;card.append(body);el('cards').append(card)}el('more').hidden=pos>=matching.length}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));el('q').oninput=update;el('all').onclick=()=>{section=-1;el('q').value='';update()};el('more').onclick=append;fetch('content.json').then(r=>{if(!r.ok)throw Error('Missing content.json');return r.json()}).then(j=>{data=j;update()}).catch(()=>{el('count').textContent='Не найден content.json. Загрузите файл данных в apps/brandbook/.'});</script></body></html>

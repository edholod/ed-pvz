<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fce7f1"><title>Брендбуки Wildberries — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9fb;color:#29242d;font:15px/1.5 system-ui,-apple-system,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:16px}.back{font-size:13px;color:#726975;text-decoration:none}.hero{background:#fce7f1;border-radius:22px;padding:22px;margin:14px 0}.hero h1{font-size:clamp(26px,4vw,38px);margin:4px 0}.hero p{margin:0;color:#765d6b}.tabs,.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pill,.btn{border:1px solid #e6dce6;background:white;border-radius:12px;padding:11px 15px;color:#403642;text-decoration:none;font-size:14px}.pill[aria-selected=true]{background:#302732;color:white}.search{width:100%;padding:13px 15px;border:1px solid #e4dce5;border-radius:13px;background:white;font-size:16px}.layout{display:grid;grid-template-columns:255px minmax(0,1fr);gap:16px;align-items:start}.nav{position:sticky;top:10px;max-height:86dvh;overflow:auto;border:1px solid #eee4ed;border-radius:16px;background:#fff;padding:12px}.nav h2{font-size:13px;margin:5px 7px 12px}.nav button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;border-radius:9px;padding:10px 9px;text-align:left;font-size:13px}.nav button:hover,.nav button.active{background:#fce7f1}.nav small{color:#897b87}.content{min-width:0}.status{color:#786e7b;font-size:13px;margin:8px 0 14px}.section-head{font-size:23px;margin:6px 0 12px}.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}.page{background:white;border:1px solid #ece5ec;border-radius:17px;overflow:hidden;min-width:0}.page .meta{padding:12px 14px;border-bottom:1px solid #f0e9f0;display:flex;align-items:center;justify-content:space-between;gap:8px}.page .meta strong{font-size:14px}.page .meta span{font-size:12px;color:#8b7e89;white-space:nowrap}.page canvas{display:block;width:100%;height:auto}.page .txt{padding:12px 14px;border-top:1px solid #f1ebf1;font-size:13px;white-space:pre-line;color:#615764;max-height:250px;overflow:auto}.page details summary{cursor:pointer;padding:9px 14px;font-size:12px;color:#786b7a}.empty{padding:30px;border:1px dashed #d9cad8;border-radius:15px;color:#776a78}.hide{display:none!important}.floating{position:sticky;bottom:12px;display:flex;justify-content:flex-end;pointer-events:none}.floating button{pointer-events:auto;border:0;background:#312634;color:white;border-radius:12px;padding:12px 17px;box-shadow:0 4px 20px #0002}@media(max-width:740px){.layout{grid-template-columns:1fr}.nav{position:static;max-height:220px}.hero{padding:17px}.pages{grid-template-columns:1fr}.page .txt{max-height:300px}}</style></head><body><div class="wrap"><a class="back" href="../../">← Все инструменты Эд ПВЗ</a><header class="hero"><h1>Брендбуки Wildberries</h1><p>Разделы, иллюстрации, требования и поиск по содержимому. Материалы представлены без изменения оригинальных страниц.</p></header><div class="tabs" role="tablist"><button class="pill" id="standard" aria-selected="true">Стандартный ПВЗ · 185 страниц</button><button class="pill" id="simplified" aria-selected="false">Упрощённые условия · 33 страницы</button></div><input id="search" class="search" type="search" placeholder="Найти по брендбуку: вывеска, камеры, примерочная…" aria-label="Поиск по содержимому"><div class="tools"><button class="btn" id="all">Все разделы</button><a class="btn" id="original" target="_blank" rel="noopener noreferrer">Оригинальный PDF ↗</a></div><div class="layout"><aside class="nav"><h2>Содержание</h2><div id="toc"></div></aside><main class="content"><h2 class="section-head" id="heading">Входная группа</h2><div id="status" class="status" aria-live="polite">Загрузка материалов…</div><div id="pages" class="pages"></div></main></div><div class="floating"><button id="up" type="button">↑ Наверх</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>'use strict';const base='https://pvz.wb.ru/api/media/file/';const sources={standard:{url:base+'brandbook-standard-ru.pdf?prefix=Docs%2F%D0%91%D1%80%D0%B5%D0%BD%D0%B4%D0%B1%D1%83%D0%BA%D0%B8%2F%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D1%8F%2F',groups:[['О документе',1,3],['Входная группа',4,38],['Планировка',39,72],['Ремонт',73,130],['Мебель',131,153],['Текстиль',154,160],['Брендирование',161,173],['Информационные материалы',174,185]]},simplified:{url:base+'brandbook-simplified-ru.pdf?prefix=Docs%2F%D0%91%D1%80%D0%B5%D0%BD%D0%B4%D0%B1%D1%83%D0%BA%D0%B8%2F%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D1%8F%2F',groups:[['О документе',1,8],['Входная группа',9,20],['Оборудование и мебель',21,26],['Брендирование',27,33]]}};let type='standard',pdf=null,items=[],generation=0,active=-1;const $=id=>document.getElementById(id);function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sections(){return sources[type].groups}function drawToc(){const box=$('toc');box.replaceChildren();sections().forEach(([name,a,b],i)=>{const btn=document.createElement('button');btn.textContent=name+' · '+a+'–'+b;btn.className=i===active?'active':'';btn.onclick=()=>{active=i;$('search').value='';drawToc();render()};box.append(btn)})}function textFor(page){return items[page-1]||''}async function render(){const gen=++generation,query=$('search').value.trim().toLocaleLowerCase('ru');$('pages').replaceChildren();let nums=[];if(query){nums=items.map((t,i)=>t.toLocaleLowerCase('ru').includes(query)?i+1:0).filter(Boolean);$('heading').textContent='Результаты поиска: '+query}else if(active<0){nums=items.map((_,i)=>i+1);$('heading').textContent='Все разделы'}else{const [name,a,b]=sections()[active];$('heading').textContent=name;nums=Array.from({length:Math.min(b,items.length)-a+1},(_,i)=>a+i)}$('status').textContent=nums.length+' страниц';if(!nums.length){$('pages').innerHTML='<div class="empty">Совпадений нет. Попробуйте другое слово.</div>';return}let pos=0;async function batch(){if(gen!==generation)return;const current=nums.slice(pos,pos+6);pos+=current.length;for(const n of current){if(gen!==generation)return;const card=document.createElement('article');card.className='page';const meta=document.createElement('div');meta.className='meta';const name=document.createElement('strong');name.textContent='Страница '+n;const count=document.createElement('span');count.textContent=n+' / '+items.length;meta.append(name,count);const canvas=document.createElement('canvas');const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Показать текст страницы';const t=document.createElement('div');t.className='txt';t.textContent=textFor(n);details.append(summary,t);card.append(meta,canvas,details);$('pages').append(card);try{const p=await pdf.getPage(n);const v=p.getViewport({scale:1.35});canvas.width=Math.round(v.width);canvas.height=Math.round(v.height);await p.render({canvasContext:canvas.getContext('2d'),viewport:v}).promise}catch(e){canvas.replaceWith(document.createTextNode('Изображение страницы недоступно'))}}if(pos<nums.length&&gen===generation){const trigger=document.createElement('button');trigger.className='btn';trigger.textContent='Показать следующие страницы';trigger.onclick=()=>{trigger.remove();batch()};$('pages').append(trigger)}}await batch()}async function load(next){type=next;active=0;generation++;$('standard').setAttribute('aria-selected',String(next==='standard'));$('simplified').setAttribute('aria-selected',String(next==='simplified'));$('search').value='';$('original').href=sources[type].url;drawToc();$('pages').replaceChildren();$('status').textContent='Загрузка документа…';if(!window.pdfjsLib){$('status').textContent='Не удалось загрузить просмотрщик страниц. Откройте оригинальный PDF.';return}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';try{pdf=await pdfjsLib.getDocument({url:sources[type].url,withCredentials:false}).promise;items=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const t=await p.getTextContent();items.push(t.items.map(x=>x.str).join(' '))}await render()}catch(e){$('status').textContent='Для просмотра оригинальных материалов используйте автономную версию сайта.';$('pages').innerHTML='<div class="empty">Содержимое не удалось получить. Для полноценной автономной версии требуется разместить материалы на сервере сайта.</div>'}}$('standard').onclick=()=>load('standard');$('simplified').onclick=()=>load('simplified');$('all').onclick=()=>{active=-1;$('search').value='';drawToc();render()};let searchDelay;$('search').oninput=()=>{clearTimeout(searchDelay);searchDelay=setTimeout(()=>render(),220)};$('up').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});load('standard');</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль пользователя — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff6fb,#edf4ff);font:16px system-ui,-apple-system,sans-serif;color:#302635}main{max-width:650px;margin:auto;padding:18px 15px 60px}a{color:#823365;text-decoration:none}.card{background:#fff;border:1px solid #eadce9;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 6px 28px #5228460b}.header{display:flex;align-items:center;gap:14px}.avatar{width:66px;height:66px;border-radius:20px;background:linear-gradient(140deg,#f7b7d9,#c3c6ff);display:grid;place-items:center;font-size:30px;font-weight:750;color:#6c3367}.muted{color:#807381;font-size:13px}h1{font-size:23px;margin:0;overflow-wrap:anywhere}h2{font-size:17px;margin:0 0 15px}label{display:block;font-weight:650;font-size:13px;margin:14px 0 5px}input,textarea{display:block;width:100%;border:1px solid #dfd2df;border-radius:12px;padding:12px;font:16px system-ui;background:#fff;color:inherit}textarea{resize:vertical;min-height:100px}button,.action{display:inline-flex;align-items:center;justify-content:center;border:0;background:#873669;color:white;border-radius:12px;padding:12px 16px;font:650 14px system-ui;cursor:pointer;margin-top:15px}.action{background:#f4e6f0;color:#79335e}.field{margin-top:15px;white-space:pre-wrap;overflow-wrap:anywhere}.field b{display:block;font-size:12px;color:#806e80;margin-bottom:4px}.field span{font-size:15px}#status{color:#8a376d;font-size:13px;margin-top:10px}.hidden{display:none!important} .social-list{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}.social-link{display:inline-flex;align-items:center;gap:8px;border:1px solid #e9d9e6;background:#fff9fd;padding:9px 12px;border-radius:13px;font-size:14px;font-weight:650;color:#59354f}.social-link img{width:20px;height:20px;object-fit:contain}.social-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}@media(max-width:480px){.social-editor{grid-template-columns:1fr}} </style></head><body><main><a href="../users/">← Пользователи</a><section class="card"><div class="header"><div class="avatar" id="avatar">•</div><div><h1 id="username">Профиль</h1><div class="muted" id="role"></div><a id="shortlink" href="/" style="display:inline-block;font-size:13px;margin-top:5px;overflow-wrap:anywhere"></a><button id="copylink" type="button" style="display:none;margin:7px 0 0;padding:6px 10px;font-size:12px;background:#f4e6f0;color:#79335e">Копировать ссылку</button></div></div><div id="details"></div><a class="action hidden" id="message" href="../messages/">Написать сообщение</a></section><section class="card hidden" id="editor"><h2>Редактировать профиль</h2><p class="muted">Эту информацию смогут видеть другие зарегистрированные пользователи. Логин и роль здесь не изменяются.</p><label for="display_name">Имя или название</label><input id="display_name" maxlength="80" placeholder="Как к вам обращаться"><label for="bio">О себе</label><textarea id="bio" maxlength="600" placeholder="Опыт, интересы, чем можете помочь"></textarea><label for="city">Город</label><input id="city" maxlength="100" placeholder="Например, Москва"><label for="specialization">Чем занимаетесь</label><input id="specialization" maxlength="120" placeholder="Например, управляю ПВЗ Wildberries"><label for="contact_link">Ссылка для связи</label><input id="contact_link" maxlength="200" placeholder="https://t.me/username"><h2 style="margin-top:24px">Социальные сети</h2><p class="muted">Укажите ник, без ссылки. В профиле появится значок с переходом в вашу соцсеть.</p><div class="social-editor"><div><label for="telegram">Telegram</label><input id="telegram" maxlength="80" placeholder="@username" autocomplete="off"></div><div><label for="vk">ВКонтакте</label><input id="vk" maxlength="80" placeholder="username или id123" autocomplete="off"></div><div><label for="instagram">Instagram</label><input id="instagram" maxlength="80" placeholder="username" autocomplete="off"></div><div><label for="tiktok">TikTok</label><input id="tiktok" maxlength="80" placeholder="@username" autocomplete="off"></div><div><label for="youtube">YouTube</label><input id="youtube" maxlength="120" placeholder="@channel" autocomplete="off"></div></div><label style="display:flex;align-items:flex-start;gap:10px;margin-top:22px;font-size:15px"><input type="checkbox" id="show_in_directory" style="width:20px;height:20px;flex:none;margin:1px 0" checked><span>Показывать меня в списке зарегистрированных пользователей<small style="display:block;color:#807381;font-weight:400;margin-top:4px">Если выключить, ваш аккаунт исчезнет из общего списка. По точному нику вас по-прежнему смогут найти; прямые ссылки и переписки продолжат работать.</small></span></label><button id="save">Сохранить изменения</button><div id="status" role="status"></div></section></main><script src="../../assets/account.js"></script><script>(()=>{'use strict';const base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV',ids=['display_name','bio','city','specialization','contact_link','telegram','vk','instagram','tiktok','youtube'],get=id=>document.getElementById(id);const name=new URLSearchParams(location.search).get('user');async function request(path,opts={}){const session=await window.EdPVZAccount.ensure();if(!session?.access_token)throw Error('Войдите в аккаунт');const response=await fetch(base+'/rest/v1/'+path,{...opts,headers:{apikey:key,Authorization:'Bearer '+session.access_token,...opts.headers}});if(!response.ok){const error=await response.json().catch(()=>({}));throw Error(error.message||'Ошибка '+response.status)}return response.status===204?null:response.json()}async function run(){try{const session=await window.EdPVZAccount.ensure();if(!session?.user)throw Error('Войдите в аккаунт');const self=await request('edpvz_profiles?user_id=eq.'+encodeURIComponent(session.user.id)+'&select=user_id,username,role');const mine=self[0];if(!mine)throw Error('Профиль не найден');const username=name||mine.username;if(!/^[a-zA-Z0-9_]{2,32}$/.test(username))throw Error('Неверный логин');const profiles=await request('edpvz_profiles?username=ilike.'+encodeURIComponent(username)+'&select=user_id,username,role');const profile=profiles[0];if(!profile)throw Error('Пользователь не найден');get('username').textContent='@'+profile.username;const publicUrl=location.origin+'/'+encodeURIComponent(profile.username);get('shortlink').href=publicUrl;get('shortlink').textContent=location.host+'/'+profile.username;get('copylink').style.display='inline-flex';get('copylink').onclick=async()=>{try{await navigator.clipboard.writeText(publicUrl);get('copylink').textContent='Скопировано'}catch(e){prompt('Ссылка на профиль',publicUrl)}};get('avatar').textContent=profile.username[0].toUpperCase();get('role').textContent=profile.role==='owner'?'Собственник':'Сотрудник';const details=await request('edpvz_profile_details?user_id=eq.'+encodeURIComponent(profile.user_id)+'&select=display_name,bio,city,specialization,contact_link,telegram,vk,instagram,tiktok,youtube,show_in_directory');const data=details[0]||{};const socials=[['telegram','Telegram','telegram','https://t.me/'],['vk','ВКонтакте','vk','https://vk.com/'],['instagram','Instagram','instagram','https://www.instagram.com/'],['tiktok','TikTok','tiktok','https://www.tiktok.com/@'],['youtube','YouTube','youtube','https://www.youtube.com/@']];function handle(field,value){let v=String(value||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v)){try{const u=new URL(v);const domains={telegram:['t.me','telegram.me'],vk:['vk.com'],instagram:['instagram.com','www.instagram.com'],tiktok:['tiktok.com','www.tiktok.com'],youtube:['youtube.com','www.youtube.com']};if(!domains[field].includes(u.hostname.toLowerCase()))throw Error('Ссылка не соответствует соцсети');v=decodeURIComponent(u.pathname.replace(/^\/+|\/+$/g,''));}catch(e){throw Error('Проверьте адрес '+field)}}v=v.replace(/^@/,'');if(field==='youtube')v=v.replace(/^@/,'');if(!/^[a-zA-Z0-9_.-]{2,80}$/.test(v))throw Error('Неверный ник для '+field);if(field==='telegram'&&!/^[a-zA-Z0-9_]{5,32}$/.test(v))throw Error('Telegram: ник должен содержать 5–32 символа (буквы, цифры, _)');if(field==='instagram'&&!/^[a-zA-Z0-9_.]{1,30}$/.test(v))throw Error('Неверный ник Instagram');if(field==='youtube'&&!/^[a-zA-Z0-9_.-]{3,30}$/.test(v))throw Error('Укажите @ник YouTube-канала');return v}function socialUrl(field,v){const info=socials.find(x=>x[0]===field);return info[3]+encodeURIComponent(v)}function socialIcon(icon){const img=document.createElement('img');img.src='https://cdn.jsdelivr.net/npm/simple-icons@15/icons/'+icon+'.svg';img.alt='';img.loading='lazy';return img}function draw(){get('details').replaceChildren();for(const [field,label] of [['display_name','Имя'],['bio','О себе'],['city','Город'],['specialization','Деятельность'],['contact_link','Связь']]){if(!data[field])continue;const div=document.createElement('div');div.className='field';const b=document.createElement('b'),value=document.createElement('span');b.textContent=label;value.textContent=data[field];div.append(b,value);if(field==='contact_link'&&/^https:\/\/(t\.me|telegram\.me|vk\.com|wa\.me)\/[a-zA-Z0-9_./?=&%-]+$/.test(data[field])){const link=document.createElement('a');link.href=data[field];link.target='_blank';link.rel='noopener noreferrer';link.textContent=data[field];value.replaceChildren(link)}get('details').append(div)}const socialList=document.createElement('div');socialList.className='social-list';for(const [field,label,icon] of socials){if(!data[field])continue;let nick;try{nick=handle(field,data[field])}catch(e){continue}if(!nick)continue;const a=document.createElement('a');a.className='social-link';a.href=socialUrl(field,nick);a.target='_blank';a.rel='noopener noreferrer';a.append(socialIcon(icon),document.createTextNode(label+' · @'+nick));socialList.append(a)}if(socialList.children.length)get('details').append(socialList);if(!get('details').children.length)get('details').textContent='Пользователь пока не заполнил информацию о себе.'}draw();if(profile.user_id===session.user.id){get('editor').classList.remove('hidden');for(const id of ids)get(id).value=data[id]||'';get('show_in_directory').checked=data.show_in_directory!==false;get('save').onclick=async()=>{const btn=get('save');btn.disabled=true;get('status').textContent='Сохранение…';try{const payload={user_id:session.user.id};for(const id of ids)payload[id]=socials.some(x=>x[0]===id)?handle(id,get(id).value):get(id).value.trim();payload.show_in_directory=get('show_in_directory').checked;const rows=await request('edpvz_profile_details?on_conflict=user_id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(payload)});Object.assign(data,rows[0]||payload);draw();get('status').textContent='Профиль сохранён'}catch(e){get('status').textContent='Не удалось сохранить: '+e.message}finally{btn.disabled=false}}}else{get('message').href='../messages/?user='+encodeURIComponent(profile.username);get('message').classList.remove('hidden')}}catch(e){get('details').textContent=e.message}}run()})();</script></body></html>

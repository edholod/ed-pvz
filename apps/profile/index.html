<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль пользователя — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff6fb,#edf4ff);font:16px system-ui,-apple-system,sans-serif;color:#302635}main{max-width:650px;margin:auto;padding:18px 15px 60px}a{color:#823365;text-decoration:none}.card{background:#fff;border:1px solid #eadce9;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 6px 28px #5228460b}.header{display:flex;align-items:center;gap:14px}.avatar{width:66px;height:66px;border-radius:20px;background:linear-gradient(140deg,#f7b7d9,#c3c6ff);display:grid;place-items:center;font-size:30px;font-weight:750;color:#6c3367}.muted{color:#807381;font-size:13px}h1{font-size:23px;margin:0;overflow-wrap:anywhere}h2{font-size:17px;margin:0 0 15px}label{display:block;font-weight:650;font-size:13px;margin:14px 0 5px}input,textarea{display:block;width:100%;border:1px solid #dfd2df;border-radius:12px;padding:12px;font:16px system-ui;background:#fff;color:inherit}textarea{resize:vertical;min-height:100px}button,.action{display:inline-flex;align-items:center;justify-content:center;border:0;background:#873669;color:white;border-radius:12px;padding:12px 16px;font:650 14px system-ui;cursor:pointer;margin-top:15px}.action{background:#f4e6f0;color:#79335e}.field{margin-top:15px;white-space:pre-wrap;overflow-wrap:anywhere}.field b{display:block;font-size:12px;color:#806e80;margin-bottom:4px}.field span{font-size:15px}#status{color:#8a376d;font-size:13px;margin-top:10px}.hidden{display:none!important}</style></head><body><main><a href="../users/">← Пользователи</a><section class="card"><div class="header"><div class="avatar" id="avatar">•</div><div><h1 id="username">Профиль</h1><div class="muted" id="role"></div></div></div><div id="details"></div><a class="action hidden" id="message" href="../messages/">Написать сообщение</a></section><section class="card hidden" id="editor"><h2>Редактировать профиль</h2><p class="muted">Эту информацию смогут видеть другие зарегистрированные пользователи. Логин и роль здесь не изменяются.</p><label for="display_name">Имя или название</label><input id="display_name" maxlength="80" placeholder="Как к вам обращаться"><label for="bio">О себе</label><textarea id="bio" maxlength="600" placeholder="Опыт, интересы, чем можете помочь"></textarea><label for="city">Город</label><input id="city" maxlength="100" placeholder="Например, Москва"><label for="specialization">Чем занимаетесь</label><input id="specialization" maxlength="120" placeholder="Например, управляю ПВЗ Wildberries"><label for="contact_link">Ссылка для связи</label><input id="contact_link" maxlength="200" placeholder="https://t.me/username"><button id="save">Сохранить изменения</button><div id="status" role="status"></div></section></main><script src="../../assets/account.js"></script><script>(()=>{'use strict';const base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV',ids=['display_name','bio','city','specialization','contact_link'],get=id=>document.getElementById(id);const name=new URLSearchParams(location.search).get('user');async function request(path,opts={}){const session=await window.EdPVZAccount.ensure();if(!session?.access_token)throw Error('Войдите в аккаунт');const response=await fetch(base+'/rest/v1/'+path,{...opts,headers:{apikey:key,Authorization:'Bearer '+session.access_token,...opts.headers}});if(!response.ok){const error=await response.json().catch(()=>({}));throw Error(error.message||'Ошибка '+response.status)}return response.status===204?null:response.json()}async function run(){try{const session=await window.EdPVZAccount.ensure();if(!session?.user)throw Error('Войдите в аккаунт');const self=await request('edpvz_profiles?user_id=eq.'+encodeURIComponent(session.user.id)+'&select=user_id,username,role');const mine=self[0];if(!mine)throw Error('Профиль не найден');const username=name||mine.username;if(!/^[a-zA-Z0-9_]{2,32}$/.test(username))throw Error('Неверный логин');const profiles=await request('edpvz_profiles?username=ilike.'+encodeURIComponent(username)+'&select=user_id,username,role');const profile=profiles[0];if(!profile)throw Error('Пользователь не найден');get('username').textContent='@'+profile.username;get('avatar').textContent=profile.username[0].toUpperCase();get('role').textContent=profile.role==='owner'?'Собственник':'Сотрудник';const details=await request('edpvz_profile_details?user_id=eq.'+encodeURIComponent(profile.user_id)+'&select=display_name,bio,city,specialization,contact_link');const data=details[0]||{};function draw(){get('details').replaceChildren();for(const [field,label] of [['display_name','Имя'],['bio','О себе'],['city','Город'],['specialization','Деятельность'],['contact_link','Связь']]){if(!data[field])continue;const div=document.createElement('div');div.className='field';const b=document.createElement('b'),value=document.createElement('span');b.textContent=label;value.textContent=data[field];div.append(b,value);if(field==='contact_link'&&/^https:\/\/(t\.me|telegram\.me|vk\.com|wa\.me)\/[a-zA-Z0-9_./?=&%-]+$/.test(data[field])){const link=document.createElement('a');link.href=data[field];link.target='_blank';link.rel='noopener noreferrer';link.textContent=data[field];value.replaceChildren(link)}get('details').append(div)}if(!get('details').children.length)get('details').textContent='Пользователь пока не заполнил информацию о себе.'}draw();if(profile.user_id===session.user.id){get('editor').classList.remove('hidden');for(const id of ids)get(id).value=data[id]||'';get('save').onclick=async()=>{const btn=get('save');btn.disabled=true;get('status').textContent='Сохранение…';try{const payload={user_id:session.user.id};for(const id of ids)payload[id]=get(id).value.trim();const rows=await request('edpvz_profile_details?on_conflict=user_id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(payload)});Object.assign(data,rows[0]||payload);draw();get('status').textContent='Профиль сохранён'}catch(e){get('status').textContent='Не удалось сохранить: '+e.message}finally{btn.disabled=false}}}else{get('message').href='../messages/?user='+encodeURIComponent(profile.username);get('message').classList.remove('hidden')}}catch(e){get('details').textContent=e.message}}run()})();</script></body></html>

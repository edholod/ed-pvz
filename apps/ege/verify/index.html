<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка сертификата WB ЕГЭ — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7fb,#eef4ff);color:#392e3b;font:16px/1.5 system-ui}main{max-width:540px;margin:35px auto;padding:16px}.cert{background:#fff;border:2px solid #e6c77b;border-radius:22px;padding:30px;text-align:center;box-shadow:0 12px 35px #8d668c18}.cert.silver{border-color:#bdc9d8;background:#fbfcff}h1{font-size:26px}.star{font-size:44px;color:#bd943b}.silver .star{color:#8996aa}.muted{color:#827482;font-size:13px}a{color:#8a326e}</style></head><body><main><div class="cert" id="cert"><div class="star">★</div><h1>WB ЕГЭ</h1><p>Проверка сертификата</p><div id="data">Проверяем подлинность…</div><p class="muted">Независимая учебная аттестация, не официальный документ Wildberries.</p></div><p><a href="../../">Вернуться к экзамену</a></p></main><script>(async()=>{let el=document.getElementById('data'),token=new URLSearchParams(location.search).get('token');if(!/^[a-f0-9]{64}$/.test(token||'')){el.textContent='Сертификат не найден';return}try{let r=await fetch('https://duerixyhzapotoeclggz.supabase.co/rest/v1/rpc/edpvz_exam_verify',{method:'POST',headers:{apikey:'sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV','Content-Type':'application/json'},body:JSON.stringify({p_token:token})});let x=await r.json();if(!r.ok||!x?.valid)throw Error('Сертификат не найден');if(x.level==='silver')document.getElementById('cert').classList.add('silver');el.replaceChildren();let h=document.createElement('h2');h.textContent=x.level==='gold'?'Золотой сертификат':'Серебряный сертификат';let n=document.createElement('p');n.textContent='№ '+x.number;let p=document.createElement('p');p.textContent='Результат: '+x.score+'/100';let d=document.createElement('p');d.textContent='Выдан: '+new Date(x.issuedAt).toLocaleDateString('ru-RU');el.append(h,n,p,d)}catch(e){el.textContent='Не удалось подтвердить сертификат'}})();</script></body></html>

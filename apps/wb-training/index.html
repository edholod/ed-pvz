<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Тренажёр WB ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f1f8;color:#282133}header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:#412366;color:white}header small{margin-left:auto}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px}main{max-width:1500px;margin:auto;padding:20px}#stage{position:relative;background:white;border-radius:12px;overflow:hidden}#stage img{display:block;width:100%;height:auto}.spot{position:absolute;background:transparent;border:0;padding:0;border-radius:0}.spot:focus-visible{outline:3px solid #9254db}.empty{padding:60px;text-align:center}#feedback{min-height:24px;padding:10px}</style><style>#splash{position:fixed;inset:0;background:#fcfcfc;z-index:9999;color:#000}#splash .brand{position:absolute;top:25.3%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2vw;font:bold clamp(36px,6vw,100px) Arial;white-space:nowrap}#splash .logo{width:clamp(90px,13.2vw,212px);aspect-ratio:1;border-radius:30%;background:linear-gradient(35deg,#7900f5,#fa35d2);display:grid;place-items:center;color:white;font-size:clamp(48px,8vw,130px);letter-spacing:-.08em;padding-right:.08em}#splash .wheel{position:absolute;top:57.7%;left:50%;width:42px;height:42px;margin-left:-21px;border:4px solid #a435ff;border-right-color:transparent;border-bottom-color:transparent;border-radius:50%;animation:wbspin .8s linear infinite}@keyframes wbspin{to{transform:rotate(360deg)}}#load-error{position:absolute;top:66%;width:100%;text-align:center;color:#6b258e}</style><div id="splash" hidden role="status" aria-label="Загрузка тренажёра"><div class="brand"><span class="logo">wb</span><span>ПВЗ</span></div><div class="wheel"></div><div id="load-error"></div></div><section id="launcher" style="position:fixed;inset:0;z-index:9998;background:#f4f1f8;padding:clamp(20px,5vw,70px)"><h1>Тренажёры ПВЗ</h1><p>Выберите учебную программу</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:900px"><button id="launch-wb" style="background:#fff;color:#7400d5;text-align:left;padding:30px;border:1px solid #d9c4ee"><b style="font-size:24px">WB ПВЗ</b><p>Учебная программа</p></button><div style="border:2px dashed #c8bfd4;border-radius:12px;padding:30px;color:#756b80">Место для новых программ</div></div></section><header><button onclick="location.reload()">Все программы</button><b>WB ПВЗ · Тренажёр</b><small>Учебная среда · без реальных операций</small><button id="reset">Начать заново</button></header><main><p id="task"></p><div id="stage"></div><div id="feedback" role="status"></div></main><script src="scenarios.js"></script><script>const steps=window.trainingSteps||[],stage=document.querySelector('#stage'),task=document.querySelector('#task'),feedback=document.querySelector('#feedback');let current=0;function render(){stage.replaceChildren();feedback.textContent='';const step=steps[current];if(!step){task.textContent='';const e=document.createElement('div');e.className='empty';e.textContent=steps.length?'Тренировка завершена':'Учебные экраны ещё не добавлены.';stage.append(e);return}task.textContent=step.task||'';const img=document.createElement('img');img.src=step.image;img.alt=step.alt||'Учебный экран';stage.append(img);for(const h of step.hotspots||[]){const b=document.createElement('button');b.className='spot';b.setAttribute('aria-label',h.label||'Учебное действие');Object.assign(b.style,{left:h.x+'%',top:h.y+'%',width:h.w+'%',height:h.h+'%'});b.onclick=e=>{e.stopPropagation();current=h.next??current+1;render()};stage.append(b)}stage.onclick=()=>{feedback.textContent='Попробуйте выбрать нужную область.'}}document.querySelector('#reset').onclick=()=>{current=0;render()};async function boot(){try{const urls=[location.href.split('#')[0],new URL('scenarios.js',location.href).href,...steps.flatMap(s=>[s.image,...(s.assets||[])])].filter(Boolean).map(x=>new URL(x,location.href).href);const cache=await caches.open('edpvz-wb-training-v1');await Promise.all([...new Set(urls)].map(async u=>{let response;try{response=await fetch(u,{cache:'no-cache'});if(!response.ok)throw Error('HTTP');await cache.put(u,response.clone())}catch(e){response=await cache.match(u);if(!response)throw e}await response.arrayBuffer()}));await Promise.all(steps.filter(s=>s.image).map(s=>new Promise((ok,no)=>{const i=new Image;i.onload=ok;i.onerror=no;i.src=s.image})));render();document.querySelector('#splash').remove()}catch(e){const el=document.querySelector('#load-error');el.textContent='Не удалось загрузить файлы. ';const b=document.createElement('button');b.textContent='Повторить';b.onclick=()=>{el.replaceChildren();boot()};el.append(b)}}document.querySelector("#launch-wb").onclick=()=>{document.querySelector("#launcher").hidden=true;document.querySelector("#splash").hidden=false;boot()};</script></html>

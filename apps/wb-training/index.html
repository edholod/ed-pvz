<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Тренажёр WB ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f1f8;color:#282133}header{display:flex;align-items:center;gap:16px;padding:14px 20px;background:#412366;color:white}header small{margin-left:auto}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px}main{max-width:1500px;margin:auto;padding:20px}#stage{position:relative;background:white;border-radius:12px;overflow:hidden}#stage img{display:block;width:100%;height:auto}.spot{position:absolute;background:transparent;border:0;padding:0;border-radius:0}.spot:focus-visible{outline:3px solid #9254db}.empty{padding:60px;text-align:center}#feedback{min-height:24px;padding:10px}</style><header><b>WB ПВЗ · Тренажёр</b><small>Учебная среда · без реальных операций</small><button id="reset">Начать заново</button></header><main><p id="task"></p><div id="stage"></div><div id="feedback" role="status"></div></main><script src="scenarios.js"></script><script>const steps=window.trainingSteps||[],stage=document.querySelector('#stage'),task=document.querySelector('#task'),feedback=document.querySelector('#feedback');let current=0;function render(){stage.replaceChildren();feedback.textContent='';const step=steps[current];if(!step){task.textContent='';const e=document.createElement('div');e.className='empty';e.textContent=steps.length?'Тренировка завершена':'Учебные экраны ещё не добавлены.';stage.append(e);return}task.textContent=step.task||'';const img=document.createElement('img');img.src=step.image;img.alt=step.alt||'Учебный экран';stage.append(img);for(const h of step.hotspots||[]){const b=document.createElement('button');b.className='spot';b.setAttribute('aria-label',h.label||'Учебное действие');Object.assign(b.style,{left:h.x+'%',top:h.y+'%',width:h.w+'%',height:h.h+'%'});b.onclick=e=>{e.stopPropagation();current=h.next??current+1;render()};stage.append(b)}stage.onclick=()=>{feedback.textContent='Попробуйте выбрать нужную область.'}}document.querySelector('#reset').onclick=()=>{current=0;render()};render()</script></html>

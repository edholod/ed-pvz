<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ff">
  <title>Личные заметки — Эд ПВЗ</title>
  <link rel="stylesheet" href="./notes.css?v=1">
  <script defer src="../../assets/account.js"></script>
  <script defer src="./notes.js?v=1"></script>
</head>
<body>
<main>
  <a class="back" href="../../">← Главная</a>
  <header>
    <div><h1>Личные заметки</h1><p>Заметки доступны в твоём аккаунте.</p></div>
    <button class="primary" id="new-note" type="button" hidden>Новая заметка</button>
  </header>
  <p id="status" role="status" aria-live="polite">Проверяем вход…</p>
  <a class="button primary" id="login" href="../account/" hidden>Войти в аккаунт</a>
  <button id="retry" type="button" hidden>Загрузить снова</button>
  <div class="layout" id="workspace" hidden>
    <section aria-label="Список заметок">
      <input type="search" id="search" placeholder="Поиск по заметкам" aria-label="Поиск по заметкам">
      <p id="empty" hidden></p>
      <div id="notes"></div>
    </section>
    <form id="editor" aria-label="Редактирование заметки" hidden>
      <label for="title">Заголовок</label>
      <input id="title" maxlength="120" placeholder="Без названия" autocomplete="off">
      <label for="body">Заметка</label>
      <textarea id="body" maxlength="20000" rows="12" placeholder="Напиши, что нужно запомнить"></textarea>
      <div class="actions">
        <button class="primary" id="save" type="submit">Сохранить</button>
        <button id="cancel" type="button">Закрыть</button>
        <button class="danger" id="delete" type="button" hidden>Удалить</button>
      </div>
      <p id="editor-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ff">
  <title>Личные заметки — Эд ПВЗ</title>
  <link rel="stylesheet" href="./notes.css?v=3">
  <script defer src="../../assets/account.js?v=20261115-notes"></script>
  <script defer src="./format.js?v=1"></script>
  <script defer src="./notes.js?v=4"></script>
  <script defer src="./export.js?v=1"></script>
</head>
<body>
<main>
  <a class="back" href="../../">← Главная</a>
  <header>
    <div><h1>Личные заметки</h1><p>Заметки доступны в твоём аккаунте.</p></div>
    <button class="primary" id="new-note" type="button" hidden>Новая заметка</button>
  </header>
  <p id="status" role="status" aria-live="polite">Проверяем вход…</p>
  <a class="button primary" id="login" href="../account/" hidden>Войти в аккаунт</a>
  <button id="retry" type="button" hidden>Загрузить снова</button>
  <div class="layout" id="workspace" hidden>
    <section aria-label="Список заметок">
      <input type="search" id="search" placeholder="Поиск по заметкам" aria-label="Поиск по заметкам">
      <p id="empty" hidden></p>
      <div id="notes"></div>
    </section>
    <form id="editor" aria-label="Редактирование заметки" hidden>
      <label for="title">Заголовок</label>
      <input id="title" maxlength="120" placeholder="Без названия" autocomplete="off">
      <label for="body">Заметка</label>
      <div class="editor-tools" id="tools" role="group" aria-label="Форматирование">
        <button data-format="heading" type="button">Заголовок</button>
        <button data-format="bold" type="button"><strong>Жирный</strong></button>
        <button data-format="italic" type="button"><em>Курсив</em></button>
        <button data-format="strike" type="button"><s>Зачеркнуть</s></button>
        <button data-format="bullets" type="button">Список</button>
        <button data-format="numbered" type="button">Нумерация</button>
        <button data-format="checklist" type="button">Чек-лист</button>
        <button data-format="table" type="button">Таблица</button>
        <button data-format="link" type="button">Ссылка</button>
        <button data-format="quote" type="button">Цитата</button>
        <button data-format="code" type="button">Код</button>
        <button data-format="divider" type="button">Разделитель</button>
      </div>
      <button id="preview-toggle" type="button" aria-pressed="false">Предпросмотр</button>
      <div id="preview" class="formatted-note" aria-label="Предпросмотр заметки" hidden></div>
      <textarea id="body" maxlength="20000" rows="12" placeholder="Напиши, что нужно запомнить"></textarea>
      <div class="actions">
        <button class="primary" id="save" type="submit">Сохранить</button>
        <button id="cancel" type="button">Закрыть</button>
        <button class="danger" id="delete" type="button" hidden>Удалить</button>
      </div>
      <div class="export-actions">
        <label for="export-format">Формат файла</label>
        <select id="export-format">
          <option value="txt">Текст (.txt)</option>
          <option value="pdf">Документ (.pdf)</option>
          <option value="jpg">Изображение (.jpg)</option>
          <option value="png">Изображение (.png)</option>
          <option value="xlsx">Таблица Excel (.xlsx)</option>
        </select>
        <button id="export-note" type="button">Скачать заметку</button>
        <p id="export-status" role="status" aria-live="polite"></p>
      </div>
      <p id="editor-status" role="status" aria-live="polite"></p>
    </form>
  </div>
  <dialog id="insert-table">
    <form method="dialog">
      <h2>Вставить таблицу</h2>
      <label for="table-cols">Столбцы</label>
      <input id="table-cols" type="number" min="1" max="10" value="3" required>
      <label for="table-rows">Строки без заголовка</label>
      <input id="table-rows" type="number" min="1" max="30" value="2" required>
      <div class="actions">
        <button class="primary" value="insert">Вставить</button>
        <button type="button" id="cancel-table">Отмена</button>
      </div>
    </form>
  </dialog>
</main>
</body>
</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Сообщения — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf8fc;color:#292330;font:15px system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}main{max-width:1000px;margin:auto;padding:12px 14px 24px}a{color:#853067;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 16px}.top h1{font-size:20px;margin:0}.back{font-size:13px;color:#805373}.layout{display:grid;grid-template-columns:minmax(230px,320px) minmax(0,1fr);height:min(760px,calc(100dvh - 130px));min-height:420px;border:1px solid #eadce7;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 6px 28px #5428470b}.sidebar{border-right:1px solid #f0e5ee;min-width:0;display:flex;flex-direction:column}.side-head{padding:16px 14px 12px;border-bottom:1px solid #f0e5ee;display:flex;align-items:center;justify-content:space-between}.side-head strong{font-size:17px}.small-btn{background:#f7eef5;color:#853067;border:0;border-radius:10px;padding:8px 11px;font-size:13px}.inbox{overflow:auto;flex:1}.dialog{display:flex;width:100%;align-items:center;gap:11px;padding:13px 14px;border:0;border-bottom:1px solid #f5eef4;background:#fff;text-align:left;color:inherit}.dialog.selected{background:#f9edf6}.avatar{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f1e0ed;color:#82396c;font-weight:700;font-size:16px}.dialog-info{min-width:0;flex:1}.dialog-name{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview{font-size:13px;color:#867b88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.conversation{display:flex;flex-direction:column;min-width:0;min-height:0}.chat-head{height:67px;flex-shrink:0;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0e5ee;font-weight:700}.mobile-back{display:none;border:0;background:transparent;color:#853067;padding:8px}.thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:16px;background:#fcfafd}.bubble{max-width:80%;align-self:flex-start;background:#f1eaf2;padding:10px 13px;border-radius:15px 15px 15px 4px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.42}.bubble.mine{align-self:flex-end;background:#ead8ed;border-radius:15px 15px 4px 15px}.bubble small{display:block;text-align:right;color:#817383;margin-top:5px;font-size:10px}.composer{display:flex;gap:9px;align-items:flex-end;padding:12px;border-top:1px solid #f0e5ee;background:white}.composer textarea{flex:1;min-width:0;min-height:43px;max-height:125px;resize:none;border:1px solid #e4d6e1;border-radius:14px;padding:11px 13px;outline:none}.composer textarea:focus{border-color:#a87599}.send{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:14px;background:#873369;color:#fff;font-size:23px}.send:disabled{opacity:.45}.notice{margin:0;padding:0 14px;color:#985274;font-size:12px}.notice:empty{display:none}.empty-chat{display:grid;place-items:center;flex:1;color:#8e8390;text-align:center;padding:24px}.muted{color:#827785;font-size:13px}#conversation[hidden],#emptyChat[hidden]{display:none!important}@media(max-width:650px){main{padding:0}.top{padding:10px 14px}.layout{height:calc(100dvh - 112px);min-height:390px;border-radius:0;border-left:0;border-right:0;display:block;position:relative}.sidebar,.conversation{height:100%;width:100%}.conversation{display:none}.layout.chat-open .sidebar{display:none}.layout.chat-open .conversation{display:flex}.mobile-back{display:block}.chat-head{height:58px}.thread{padding:12px}.bubble{max-width:87%}.composer{padding:9px 10px calc(10px + env(safe-area-inset-bottom))}} </style></head><body><main><div class="top"><a class="back" href="../users/">← Пользователи</a><h1>Сообщения</h1><span style="width:75px"></span></div><div class="layout" id="layout"><aside class="sidebar"><div class="side-head"><strong>Чаты</strong><button class="small-btn" id="refresh" type="button">Обновить</button></div><div class="inbox" id="inbox"></div></aside><section class="conversation" id="conversation" hidden><div class="chat-head"><button type="button" class="mobile-back" id="backChats" aria-label="К списку чатов">←</button><span class="avatar" id="peerAvatar">•</span><span id="peer"></span><button type="button" id="blockUser" class="small-btn" style="margin-left:auto;white-space:nowrap" aria-label="Заблокировать пользователя">Заблокировать</button></div><div class="thread" id="thread" aria-live="polite"></div><p id="notice" class="notice" role="status"></p><div class="composer"><textarea id="message" maxlength="2000" rows="1" aria-label="Сообщение" placeholder="Сообщение…"></textarea><button id="send" class="send" aria-label="Отправить" title="Отправить">➤</button></div></section><div id="emptyChat" class="empty-chat"><div>Выберите диалог или найдите пользователя, чтобы начать переписку.</div></div></div></main><script src="../../assets/account.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV';let peer='',refreshBusy=false,threadRequest=0,inboxRequest=0,realtimeClient=null,realtimeChannels=[],blocked=false,blockRequest=0;function el(t,text,cls){const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}async function rpc(name,args={}){const session=await window.EdPVZAccount.ensure();if(!session?.access_token)throw Error('Войдите в аккаунт');const r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args)}),data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||data.error_description||('Ошибка сервера ('+r.status+')'));return data}async function inbox(){const requestId=++inboxRequest;try{const rows=await rpc('edpvz_dm_inbox');if(requestId!==inboxRequest)return;$('inbox').replaceChildren();if(!rows.length)$('inbox').append(el('p','Пока нет диалогов.','muted'));for(const x of rows){const b=el('button',undefined,'dialog'+(peer===x.username?' selected':''));b.type='button';const avatar=el('span',x.username.slice(0,1).toUpperCase(),'avatar'),info=el('span',undefined,'dialog-info'),name=el('div','@'+x.username,'dialog-name'),preview=el('div',x.last_body||'','preview');info.append(name,preview);b.append(avatar,info);b.onclick=()=>openPeer(x.username);$('inbox').append(b)}}catch(e){if(requestId===inboxRequest){$('inbox').append(el('p','Не удалось загрузить диалоги: '+e.message,'muted'))}}}async function checkBlock(username){const requestId=++blockRequest;try{const value=await rpc('edpvz_dm_block_status',{target_username:username});if(peer!==username||requestId!==blockRequest)return;blocked=!!value;$('blockUser').textContent=blocked?'Разблокировать':'Заблокировать';$('send').disabled=blocked;$('message').disabled=blocked;$('message').placeholder=blocked?'Пользователь заблокирован':'Сообщение…'}catch(e){if(peer===username)$('notice').textContent=e.message}}$('blockUser').onclick=async()=>{if(!peer)return;const target=peer,next=!blocked;if(next&&!confirm('Заблокировать @'+target+'? Вы не сможете отправлять друг другу сообщения.'))return;const btn=$('blockUser');btn.disabled=true;try{await rpc('edpvz_dm_set_block',{target_username:target,should_block:next});if(peer===target){await checkBlock(target);$('notice').textContent=next?'Пользователь заблокирован':'Пользователь разблокирован'}}catch(e){$('notice').textContent=e.message}finally{btn.disabled=false}};async function openPeer(username){if(!/^[a-zA-Z0-9_]{2,32}$/.test(username))return;peer=username;blocked=false;$('send').disabled=false;$('message').disabled=false;$('message').placeholder='Сообщение…';$('thread').dataset.signature='';$('conversation').hidden=false;$('emptyChat').hidden=true;$('layout').classList.add('chat-open');$('peer').textContent='@'+username;$('peerAvatar').textContent=username.slice(0,1).toUpperCase();history.replaceState(null,'','?user='+encodeURIComponent(username));await Promise.all([loadThread(),inbox(),checkBlock(username)])}$('backChats').onclick=()=>{$('layout').classList.remove('chat-open');$('conversation').hidden=true;$('emptyChat').hidden=false;peer='';history.replaceState(null,'',location.pathname);inbox()};$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});async function loadThread(){if(!peer)return;const requestedPeer=peer,requestId=++threadRequest,thread=$('thread'),atBottom=thread.scrollHeight-thread.scrollTop-thread.clientHeight<65;try{const rows=await rpc('edpvz_dm_thread',{target_username:requestedPeer});if(requestedPeer!==peer||requestId!==threadRequest)return;const signature=JSON.stringify(rows.map(m=>[m.id,m.body,m.created_at,m.is_mine]));if(thread.dataset.signature===signature)return;thread.dataset.signature=signature;thread.replaceChildren();if(!rows.length)$('thread').append(el('p','Начните переписку.','muted'));for(const m of rows.reverse()){const b=el('div',m.body,'bubble'+(m.is_mine?' mine':''));b.append(el('small',new Date(m.created_at).toLocaleString('ru-RU')));$('thread').append(b)}if(atBottom||!thread.dataset.seen)thread.scrollTop=thread.scrollHeight;thread.dataset.seen='1';$('notice').textContent=''}catch(e){if(requestedPeer===peer&&requestId===threadRequest)$('notice').textContent=e.message}}$('send').onclick=async()=>{const body=$('message').value.trim(),target=peer;if(!body||!target||blocked)return;const btn=$('send');btn.disabled=true;try{await rpc('edpvz_dm_send',{target_username:target,message_body:body});$('notice').textContent='';if(peer===target){$('message').value='';await loadThread()}await inbox()}catch(e){$('notice').textContent='Не удалось отправить: '+e.message}finally{btn.disabled=false}};async function connectRealtime(){if(!window.supabase?.createClient||realtimeClient)return;const session=await window.EdPVZAccount.ensure();if(!session?.access_token)return;realtimeClient=window.supabase.createClient(base,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},accessToken:async()=>{const s=await window.EdPVZAccount.ensure();return s?.access_token||null}});const uid=session.user.id;const schedule=()=>{if(!document.hidden)refresh()};for(const column of ['sender_id','recipient_id']){const channel=realtimeClient.channel('edpvz-dm-'+column+'-'+uid).on('postgres_changes',{event:'INSERT',schema:'public',table:'edpvz_direct_messages',filter:column+'=eq.'+uid},schedule).subscribe();realtimeChannels.push(channel)}}window.addEventListener('edpvz-auth-changed',async()=>{if(realtimeClient){for(const c of realtimeChannels)await realtimeClient.removeChannel(c);realtimeChannels=[];realtimeClient=null}connectRealtime().catch(()=>{})});async function refresh(){if(refreshBusy||document.hidden)return;refreshBusy=true;try{await inbox();await loadThread()}finally{refreshBusy=false}}$('refresh').onclick=refresh;document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('focus',refresh);setInterval(refresh,12000);(async()=>{await inbox();const user=new URLSearchParams(location.search).get('user');if(user)await openPeer(user);connectRealtime().catch(()=>{})})();})();</script></body></html>

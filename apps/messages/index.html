<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Сообщения — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7fb;color:#292330;font:15px system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:22px 16px 60px}a{color:#853067;text-decoration:none}h1{font-size:25px;margin:20px 0}h2{font-size:18px}.panel{background:white;border:1px solid #eadce7;border-radius:18px;padding:16px;margin:15px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1eaf0}.row:last-child{border:0}button{border:0;border-radius:12px;background:#873369;color:white;padding:11px 14px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5}input,textarea{width:100%;border:1px solid #ddd2df;border-radius:12px;padding:12px;font:inherit}textarea{min-height:95px;resize:vertical}.thread{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow-y:auto;padding:8px 0}.bubble{max-width:86%;align-self:flex-start;background:#f2edf6;padding:11px 13px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#e5d7f3}.bubble small{display:block;color:#796f7d;margin-top:5px;font-size:11px}.muted{color:#746b79;font-size:13px}#conversation[hidden]{display:none!important}</style></head><body><main><a href="../users/">← Поиск пользователей</a><h1>Личные сообщения</h1><p class="muted">Переписка внутри «Эд ПВЗ». Сообщения видны только отправителю и получателю.</p><p id="notice" class="muted" role="status"></p><section class="panel"><h2>Диалоги</h2><button id="refresh">Обновить</button><div id="inbox"></div></section><section class="panel" id="conversation" hidden><h2 id="peer"></h2><div class="thread" id="thread"></div><label for="message">Сообщение</label><textarea id="message" maxlength="2000" placeholder="Напишите сообщение…"></textarea><button id="send">Отправить</button></section></main><script src="../../assets/account.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV';let peer='',refreshBusy=false;function el(t,text,cls){const x=document.createElement(t);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}async function rpc(name,args={}){const session=await window.EdPVZAccount.ensure();if(!session?.access_token)throw Error('Войдите в аккаунт');const r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args)}),data=await r.json();if(!r.ok)throw Error(data.message||'Ошибка соединения');return data}async function inbox(){try{const rows=await rpc('edpvz_dm_inbox');$('inbox').replaceChildren();if(!rows.length)$('inbox').append(el('p','Диалогов пока нет. Найдите пользователя и нажмите «Написать».','muted'));for(const x of rows){const row=el('div',undefined,'row'),info=el('div'),b=el('button','Открыть');info.append(el('strong','@'+x.username),el('p',x.last_body.slice(0,90),'muted'));b.onclick=()=>openPeer(x.username);row.append(info,b);$('inbox').append(row)}}catch(e){$('notice').textContent=e.message}}async function openPeer(username){if(!/^[a-zA-Z0-9_]{2,32}$/.test(username))return;peer=username;$('thread').dataset.signature='';$('conversation').hidden=false;$('peer').textContent='@'+username;history.replaceState(null,'','?user='+encodeURIComponent(username));await loadThread();$('conversation').scrollIntoView({block:'start'})}async function loadThread(){if(!peer)return;const requestedPeer=peer,thread=$('thread'),atBottom=thread.scrollHeight-thread.scrollTop-thread.clientHeight<65;try{const rows=await rpc('edpvz_dm_thread',{target_username:requestedPeer});if(requestedPeer!==peer)return;const signature=JSON.stringify(rows.map(m=>[m.id,m.body,m.created_at,m.is_mine]));if(thread.dataset.signature===signature)return;thread.dataset.signature=signature;thread.replaceChildren();if(!rows.length)$('thread').append(el('p','Начните переписку.','muted'));for(const m of rows.reverse()){const b=el('div',m.body,'bubble'+(m.is_mine?' mine':''));b.append(el('small',new Date(m.created_at).toLocaleString('ru-RU')));$('thread').append(b)}if(atBottom)thread.scrollTop=thread.scrollHeight;$('notice').textContent=''}catch(e){$('notice').textContent=e.message}}$('send').onclick=async()=>{const body=$('message').value.trim();if(!body||!peer)return;const btn=$('send');btn.disabled=true;try{await rpc('edpvz_dm_send',{target_username:peer,message_body:body});$('message').value='';await loadThread();await inbox()}catch(e){$('notice').textContent=e.message}finally{btn.disabled=false}};async function refresh(){if(refreshBusy||document.hidden)return;refreshBusy=true;try{await inbox();await loadThread()}finally{refreshBusy=false}}$('refresh').onclick=refresh;document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('focus',refresh);setInterval(refresh,12000);(async()=>{await inbox();const user=new URLSearchParams(location.search).get('user');if(user)await openPeer(user)})();})();</script></body></html>

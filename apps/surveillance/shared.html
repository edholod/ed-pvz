<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Камеры, доступные мне — Эд ПВЗ</title>
  <link rel="stylesheet" href="surveillance.css?v=private-1">
  <script defer src="../../assets/account.js?v=ivideon-owners-1"></script>
</head>
<body>
<main>
  <nav aria-label="Навигация"><a href="./">← Видеонаблюдение</a></nav>
  <header><div><h1>Камеры, доступные мне</h1><p>Здесь находятся камеры, которыми с тобой поделились в «Эд ПВЗ».</p></div></header>
  <section class="panel">
    <p id="status" role="status">Загружаем камеры…</p>
    <a class="primary" id="login" href="../account/" hidden>Войти в «Эд ПВЗ»</a>
    <ul id="cameras" class="shortcut-list"></ul>
  </section>
  <section id="player" class="panel" aria-labelledby="camera-name" hidden>
    <h2 id="camera-name"></h2>
    <button id="stop" class="secondary" type="button">Закрыть камеру</button>
    <form id="interval" hidden>
      <label>Начало <input type="datetime-local" id="start" required></label>
      <label>Конец <input type="datetime-local" id="end" required></label>
      <button id="archive-action" class="primary" type="submit"></button>
    </form>
    <p id="progress" role="status"></p>
    <video id="video" controls playsinline muted controlslist="nodownload" style="width:100%;max-height:65vh;background:#142032;border-radius:12px" hidden></video>
    <a id="download" class="primary" target="_blank" rel="noopener noreferrer" hidden>Скачать MP4</a>
  </section>
</main>
<script type="module">
  import {playIvideon,playIvideonHls} from './ivideon-live.mjs?v=9';
  const el = id => document.getElementById(id);
  const account = window.EdPVZAccount;
  const list = el('cameras'), status = el('status'), player = el('player'), video = el('video');
  const form = el('interval'), progress = el('progress'), download = el('download');
  let sessionUser, active, stopPlayback, controller, revision = 0, refreshRevision = 0;
  const request = (action, options, quality) => account.checkIvideon(undefined,undefined,quality,action,options);
  const button = (text, handler) => {
    const control = document.createElement('button');
    control.type = 'button'; control.className = 'secondary'; control.textContent = text;
    control.addEventListener('click',handler);
    return control;
  };
  function resetPlayer() {
    revision++;
    controller?.abort(); controller = undefined;
    stopPlayback?.(); stopPlayback = undefined;
    video.pause(); video.removeAttribute('src'); video.load(); video.hidden = true;
    download.removeAttribute('href'); download.hidden = true;
    progress.textContent = ''; el('archive-action').disabled = false;
  }
  function closePlayer() {
    resetPlayer(); active = undefined; player.hidden = true; form.hidden = true;
  }
  function activate(camera, mode) {
    resetPlayer();
    active = {camera,mode};
    player.hidden = false;
    el('camera-name').textContent = camera.name;
    form.hidden = mode === 'live';
    player.scrollIntoView({block:'start'});
  }
  function play(result, current) {
    if (revision !== current) return;
    video.hidden = false;
    const start = result.streamType === 'hls' ? playIvideonHls : playIvideon;
    stopPlayback = start(video,result.streamUrl,message=>{
      if (revision === current) progress.textContent = message || '';
    });
  }
  async function live(camera) {
    activate(camera,'live');
    const current = revision;
    progress.textContent = 'Подключаем эфир…';
    try { play(await request('shared-use',{shareId:camera.id},'hls'),current); }
    catch (error) { if (revision === current) progress.textContent = error.message; }
  }
  function setupInterval(camera,mode) {
    activate(camera,mode);
    el('archive-action').textContent = mode === 'preview' ? 'Смотреть архив' : 'Подготовить MP4';
    const date = new Date();
    const local = value => new Date(value-date.getTimezoneOffset()*60000).toISOString().slice(0,16);
    el('start').value = local(date.getTime()-10*60000);
    el('end').value = local(date.getTime()-5*60000);
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    if (!active) return;
    const {camera,mode} = active;
    const start = Math.floor(new Date(el('start').value).getTime()/1000);
    const end = Math.floor(new Date(el('end').value).getTime()/1000);
    if (!(start < end && end <= Date.now()/1000) || end-start > (mode === 'preview' ? 3600 : 18000)) {
      progress.textContent = mode === 'preview' ? 'Укажи прошедший интервал до часа.' : 'Укажи прошедший интервал до 5 часов.';
      return;
    }
    resetPlayer();
    controller = new AbortController();
    const signal = controller.signal, current = revision;
    el('archive-action').disabled = true;
    try {
      const options = {shareId:camera.id,mode:mode === 'preview' ? 'preview' : 'export',start,end};
      progress.textContent = mode === 'preview' ? 'Открываем архив…' : 'Готовим MP4…';
      const result = await request('shared-use',options);
      if (signal.aborted) return;
      if (mode === 'preview') { play(result,current); return; }
      const deadline = Date.now()+600000;
      while (!signal.aborted && Date.now()<deadline) {
        const info = await request('shared-use',{shareId:camera.id,mode:'export-status',exportId:result.exportId});
        if (signal.aborted) return;
        if (info.state === 'failed') throw Error('Ivideon не подготовил запись.');
        if (info.state === 'ready') {
          download.href = info.downloadUrl;
          download.hidden = false;
          progress.textContent = 'MP4 готов.';
          return;
        }
        progress.textContent = 'Ivideon готовит MP4' + (info.progress == null ? '…' : ' · ' + info.progress + '%');
        await new Promise(resolve=>setTimeout(resolve,3000));
      }
      if (!signal.aborted) throw Error('Ivideon ещё готовит запись. Попробуй более короткий интервал.');
    } catch (error) { if (!signal.aborted) progress.textContent = error.message; }
    finally { if (revision === current) el('archive-action').disabled = false; }
  });
  async function edit(camera, row) {
    if (row.querySelector('form')) return;
    const editor = document.createElement('form');
    editor.className = 'iv-camera-edit';
    const note = document.createElement('p');
    note.setAttribute('role','status'); note.textContent = 'Загружаем настройки…';
    editor.append(note); row.append(editor);
    try {
      const detail = await request('shared-edit',{shareId:camera.id});
      if (!editor.isConnected) return;
      const name = document.createElement('input');
      name.maxLength = 100; name.value = detail.displayName;
      const nameLabel = document.createElement('label');
      nameLabel.append('Название в «Эд ПВЗ»',name);
      const point = document.createElement('select');
      point.add(new Option('Без привязки к ПВЗ',''));
      for (const p of detail.points) point.add(new Option(p.name || p.point_id,p.point_id));
      point.value = detail.pointId;
      const pointLabel = document.createElement('label');
      pointLabel.append('Пункт выдачи',point);
      const save = button('Сохранить',()=>{});
      save.type = 'submit'; save.className = 'primary';
      note.textContent = '';
      editor.prepend(nameLabel,pointLabel,save,button('Отмена',()=>editor.remove()));
      editor.addEventListener('submit',async event=>{
        event.preventDefault(); save.disabled = true;
        try {
          await request('shared-edit',{shareId:camera.id,displayName:name.value,pointId:point.value});
          await refresh();
        } catch (error) { note.textContent = error.message; }
        finally { save.disabled = false; }
      });
    } catch (error) { note.textContent = error.message; }
  }
  async function refresh() {
    const current = ++refreshRevision;
    const user = account?.user?.id;
    if (user !== sessionUser) { sessionUser = user; closePlayer(); list.replaceChildren(); }
    el('login').hidden = Boolean(user);
    if (!user) { status.textContent = 'Войди в свой аккаунт, чтобы увидеть камеры.'; return; }
    try {
      const {cameras} = await request('shared-list');
      if (current !== refreshRevision || account.user?.id !== user) return;
      if (active && !cameras.some(camera => camera.id===active.camera.id && camera[
        active.mode==='live' ? 'can_live' : active.mode==='preview' ? 'can_archive' : 'can_download'
      ])) closePlayer();
      list.replaceChildren();
      status.textContent = cameras.length ? '' : 'Пока никто не поделился с тобой камерой.';
      for (const camera of cameras) {
        const row = document.createElement('li'), name = document.createElement('strong');
        name.textContent = camera.name; row.append(name);
        if (camera.can_live) row.append(button('Смотреть эфир',()=>void live(camera)));
        if (camera.can_archive) row.append(button('Архив',()=>setupInterval(camera,'preview')));
        if (camera.can_download) row.append(button('Скачать запись',()=>setupInterval(camera,'download')));
        if (camera.can_edit) row.append(button('Настроить',()=>void edit(camera,row)));
        list.append(row);
      }
    } catch (error) { if (current === refreshRevision) status.textContent = error.message; }
  }
  el('stop').addEventListener('click',closePlayer);
  window.addEventListener('edpvz-auth-changed',refresh);
  window.addEventListener('pageshow',refresh);
  window.addEventListener('pagehide',closePlayer);
  void refresh();
</script>
</body>
</html>

    /^\/archive\/download\/[\w-]+\/[\w-]+$/.test(src.pathname) && src.searchParams.has('signature')) ||
    (src.origin==='https://duerixyhzapotoeclggz.supabase.co' &&

  if(!valid || src.username || src.password) throw Error();

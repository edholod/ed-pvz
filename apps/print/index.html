<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Центр печати — Эд ПВЗ</title><style>:root{font-family:system-ui,-apple-system,Arial;background:#faf8fb;color:#2a2630}*{box-sizing:border-box}main{max-width:850px;margin:auto;padding:20px 16px 60px}h1{font-size:29px}p{color:#777;line-height:1.5}.card{background:white;border:1px solid #ebe3ec;border-radius:17px;padding:18px;margin:14px 0}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;font:inherit;border:1px solid #ddd;border-radius:11px}textarea{min-height:100px}button{background:#302832;color:white;padding:12px 18px;border:0;border-radius:12px;font:inherit;cursor:pointer;margin-top:12px}.paper{width:min(100%,595px);min-height:420px;margin:20px auto;background:white;border:1px solid #ddd;box-shadow:0 6px 20px #0001;padding:48px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-wrap:anywhere}.paper h2{font-size:34px;line-height:1.2;margin:0 0 25px}.paper p{font-size:21px;color:#222;white-space:pre-wrap}.paper footer{margin-top:auto;font-size:12px;color:#777}@media print{@page{size:A4;margin:12mm}body{background:white}main{padding:0;max-width:none}main>h1,main>p,.card,.actions{display:none!important}.paper{border:0;box-shadow:none;width:100%;min-height:260mm;padding:20mm 10mm;margin:0}.paper h2{font-size:36pt}.paper p{font-size:24pt}}@media(max-width:520px){.paper{padding:35px 18px;min-height:360px}.paper h2{font-size:25px}.paper p{font-size:18px}}.library{margin:22px 0 34px}.library h2{font-size:22px}.library-tools{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.library-tools input{flex:2;min-width:180px}.library-tools select{flex:1;min-width:150px}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px}.library-item{border:1px solid #e9e1eb;border-radius:15px;background:white;padding:15px}.library-item h3{font-size:15px;margin:6px 0 9px}.library-item small{color:#806b7d}.library-item a{display:inline-block;text-decoration:none;color:#84216b;font-weight:700;margin-top:8px}.library-item .pending{color:#827987;font-size:12px;margin-top:8px}.library .status{font-size:13px;color:#706271}.library-item[hidden]{display:none}</style></head><body><main><h1>Центр печатных материалов</h1><p>Создавайте объявления для ПВЗ и печатайте на листе A4. Тексты можно редактировать перед печатью.</p><section class="library" id="library"><h2>Готовые материалы для печати</h2><p>16 оригинальных материалов: памятки, QR-коды, наклейки и флаеры. Ниже показаны доступные для скачивания файлы.</p><div class="library-tools"><input type="search" id="library-search" placeholder="Найти материал"><select id="library-category"><option value="">Все категории</option></select></div><p class="status" id="library-status">Проверяем наличие файлов…</p><div class="library-grid" id="library-grid"></div></section><div class="card"><label for="template">Шаблон</label><select id="template"><option value="custom">Своё объявление</option><option value="break">Технический перерыв</option><option value="hours">Режим работы</option><option value="maintenance">Временное закрытие</option><option value="queue">Пожалуйста, соблюдайте очередь</option><option value="camera">Ведётся видеонаблюдение</option><option value="contact">Контакты для связи</option></select><label for="heading">Заголовок</label><input id="heading" maxlength="120" value="Уважаемые посетители!"><label for="body">Основной текст</label><textarea id="body" maxlength="1200">Благодарим за понимание.</textarea><label for="footer">Подпись (необязательно)</label><input id="footer" maxlength="120" placeholder="Администрация ПВЗ"><div class="actions"><button id="print">Распечатать A4 / сохранить PDF</button></div></div><div class="paper" id="paper"><h2 id="pheading"></h2><p id="pbody"></p><footer id="pfooter"></footer></div></main><script>const $=id=>document.getElementById(id),templates={custom:['Уважаемые посетители!','Благодарим за понимание.'],break:['Технический перерыв','Пожалуйста, подождите. Скоро возобновим работу.'],hours:['Режим работы','Ежедневно с 09:00 до 21:00'],maintenance:['Временно не работаем','По техническим причинам обслуживание временно приостановлено.'],queue:['Уважаемые посетители!','Пожалуйста, соблюдайте очередь. Спасибо!'],camera:['Ведётся видеонаблюдение','В помещении установлены камеры видеонаблюдения.'],contact:['Контакты для связи','По вопросам работы пункта выдачи обращайтесь к сотруднику.']};function render(){$('pheading').textContent=$('heading').value;$('pbody').textContent=$('body').value;$('pfooter').textContent=$('footer').value}for(const id of ['heading','body','footer'])$(id).addEventListener('input',render);$('template').onchange=()=>{const x=templates[$('template').value];$('heading').value=x[0];$('body').value=x[1];render()};$('print').onclick=()=>window.print();render();</script><script>(()=>{const files=[["QR-код клиентской поддержки","QR-коды и наклейки","qr-support.pdf"],["QR-коды пакетов для клиентов","QR-коды и наклейки","qr-bags.jpg"],["QR-коды для выбора сейф-пакетов","Переупаковка и сейф-пакеты","qr-repacking.jpg"],["Пополните WB Кошелёк","Памятки для клиентов","wb-wallet.pdf"],["Детские раскраски","Для детей","coloring.pdf"],["Ищем лучших курьеров","Объявления и вакансии","couriers.pdf"],["Рекомендации по примерке товаров","Памятки для клиентов","fitting.pdf"],["Наклейки в примерочную «Отличный вкус»","Наклейки для примерочных","great-taste.pdf"],["Отправление посылок WB Track","WB Track","wb-track.pdf"],["Проверка товара перед получением","Памятки для клиентов","check-before.pdf"],["Горячая линия — складская зона","Обязательные материалы для ПВЗ","hotline.pdf"],["Оцените товар и ПВЗ","Наклейки для примерочных","rate-product.pdf"],["Не забудьте оценить наш сервис","Наклейки и объявления","rate-service.pdf"],["Флаер для поиска менеджеров","Объявления и вакансии","manager-hiring.pdf"],["Флаер «Новый пункт выдачи»","Реклама и продвижение ПВЗ","new-pvz.pdf"],["Флаер «Чаевые»","Памятки для клиентов","tips.pdf"]];const root=document.getElementById('library-grid'),search=document.getElementById('library-search'),category=document.getElementById('library-category'),status=document.getElementById('library-status');for(const c of [...new Set(files.map(x=>x[1]))].sort()){const o=document.createElement('option');o.value=o.textContent=c;category.append(o)}let available=0;const cards=files.map(([title,cat,file])=>{const el=document.createElement('article');el.className='library-item';el.dataset.title=title.toLowerCase();el.dataset.cat=cat;const small=document.createElement('small');small.textContent=cat;const h=document.createElement('h3');h.textContent=title;const slot=document.createElement('div');slot.className='pending';slot.textContent='Проверка файла…';el.append(small,h,slot);root.append(el);return {el,slot,file}});function filter(){let q=search.value.trim().toLowerCase(),c=category.value;for(const x of cards)x.el.hidden=!(x.el.dataset.title.includes(q)&&(!c||x.el.dataset.cat===c))}search.addEventListener('input',filter);category.addEventListener('change',filter);Promise.all(cards.map(async x=>{try{const r=await fetch('files/'+x.file,{method:'HEAD',cache:'no-store'});if(!r.ok)throw Error('not found');x.slot.className='';const a=document.createElement('a');a.href='files/'+x.file;a.target='_blank';a.rel='noopener';a.textContent='Открыть / скачать';x.slot.replaceWith(a);available++}catch(e){x.slot.textContent='Файл ещё не опубликован'}})).then(()=>{status.textContent='Опубликовано '+available+' из '+cards.length+' файлов'})})();</script><script defer src="../../assets/svg-icons.js?v=1"></script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отзывы клиентов — Эд ПВЗ</title><style>:root{font:16px system-ui;color:#26324a;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:20px 16px 70px}h1{font-size:29px}a{color:#4e5cb2}.card{background:white;border:1px solid #e3e7f1;border-radius:18px;padding:20px;margin:15px 0}select,textarea{font:inherit;width:100%;border:1px solid #dce1ec;border-radius:12px;padding:12px;margin:9px 0}button{font:inherit;background:#5365c5;color:white;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}button.secondary{background:#e9edfa;color:#42527d}button:disabled{opacity:.6}#qr{display:flex;justify-content:center;padding:20px}#qr canvas,#qr img{max-width:100%}#link{overflow-wrap:anywhere}#reviews article{padding:14px 0;border-bottom:1px solid #e8ebf1;white-space:pre-wrap;overflow-wrap:anywhere}small,p{color:#6c7890}#status{color:#4d5cb4;min-height:20px}</style><script defer src="/assets/account.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>html body,button,input,select{font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}body{background:#f5f3fa;color:#302438}main{max-width:1050px;padding:12px 16px 80px}main>a{font-size:13px;color:#963476;text-decoration:none;font-weight:650}.hero{display:flex;align-items:center;gap:14px;padding:18px;border-radius:22px;background:linear-gradient(115deg,#fbe5f1,#e7edff);margin:12px 0}.hero-icon{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;background:white;color:#963476;font-size:34px;flex:none}.hero h1{font-size:24px;margin:3px 0}.hero p{margin:0;font-size:13px}.hero small{font-size:11px;color:#963476;font-weight:800;letter-spacing:1px}.card{border-color:#eadfeb;padding:16px}#point[hidden],#generated[hidden],#create[hidden]{display:none!important}#point-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:10px 0 16px}.point-tile{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg,#eeedf5);color:#302438;border:2px solid transparent;padding:12px}.point-tile[aria-pressed=true]{border-color:var(--accent,#74648c)}.point-tile b{background:var(--accent,#74648c);color:white;padding:10px;border-radius:10px}.point-tile span{display:grid;gap:3px;flex:1;min-width:0;overflow-wrap:anywhere}.point-tile.wb{--bg:#fce7f1;--accent:#b62b86}.point-tile.ozon{--bg:#e4efff;--accent:#2463dc}.point-tile.ym{--bg:#fff4cc;--accent:#9a7100}#create{width:100%;background:linear-gradient(110deg,#a42d82,#7754ce);font-weight:700}.qr-poster{max-width:340px;margin:12px auto;padding:18px;text-align:center;background:#fff;border:1px solid #eadfeb;border-radius:20px}.qr-poster strong{font-size:18px}#qr{padding:16px}#qr img,#qr canvas{height:auto}.link-details{margin:12px 0;font-size:13px;color:#79516f}.link-details summary{cursor:pointer}#copy,#print{width:calc(50% - 4px);font-size:14px;font-weight:650;background:#f3e5f0;color:#87316e}#status:empty{display:none}#status{font-size:13px;margin-top:8px;color:#87316e}.review-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.review-head h2{font-size:20px;margin:0}#reviews article{background:#faf5fa;border:1px solid #eadfeb;border-radius:14px;padding:14px;margin-top:10px}#reviews article div{margin-top:8px}@media(max-width:500px){#point-tiles{grid-template-columns:1fr}#copy,#print{width:100%;margin:4px 0}}</style></head><body><main><a href="/apps/management/">← Управление ПВЗ</a><div class="hero"><span class="hero-icon">☆</span><div><small>УПРАВЛЕНИЕ ПВЗ</small><h1>Отзывы клиентов</h1><p>Обратная связь без регистрации</p></div></div><section class="card"><label for="point">Выберите ПВЗ</label><select id="point" hidden></select><div id="point-tiles" role="group" aria-label="Пункты выдачи"></div><button id="create">Создать QR-код</button><div id="status" role="status"></div><div id="generated" hidden><div class="qr-poster"><strong>Оставьте отзыв о нашем ПВЗ</strong><div id="qr"></div><small>Наведите камеру телефона на QR-код</small></div><details class="link-details"><summary>Ссылка для отзыва</summary><p id="link"></p></details><button class="secondary" id="copy">Скопировать ссылку</button> <button class="secondary" id="print">Распечатать QR</button><p><small>QR-код можно разместить на стойке. Ссылка действует постоянно, пока вы её не замените.</small></p></div></section><section class="card"><div class="review-head"><h2>Все отзывы</h2><button class="secondary" id="refresh">Обновить</button></div><div id="reviews"></div></section></main><script defer src="/assets/customer-reviews.js?v=3"></script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отзывы клиентов — Эд ПВЗ</title><style>:root{font:16px system-ui;color:#26324a;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:20px 16px 70px}h1{font-size:29px}a{color:#4e5cb2}.card{background:white;border:1px solid #e3e7f1;border-radius:18px;padding:20px;margin:15px 0}select,textarea{font:inherit;width:100%;border:1px solid #dce1ec;border-radius:12px;padding:12px;margin:9px 0}button{font:inherit;background:#5365c5;color:white;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}button.secondary{background:#e9edfa;color:#42527d}button:disabled{opacity:.6}#qr{display:flex;justify-content:center;padding:20px}#qr canvas,#qr img{max-width:100%}#link{overflow-wrap:anywhere}#reviews article{padding:14px 0;border-bottom:1px solid #e8ebf1;white-space:pre-wrap;overflow-wrap:anywhere}small,p{color:#6c7890}#status{color:#4d5cb4;min-height:20px}</style><script defer src="/assets/account.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><main><a href="/apps/management/">← Управление ПВЗ</a><h1>Отзывы от клиентов</h1><p>Создайте QR-код для своего ПВЗ. Любой посетитель сможет оставить текстовый отзыв без регистрации.</p><section class="card"><label for="point">Выберите ПВЗ</label><select id="point"></select><button id="create">Создать QR-код</button><div id="status" role="status"></div><div id="generated" hidden><div id="qr"></div><p id="link"></p><button class="secondary" id="copy">Скопировать ссылку</button> <button class="secondary" id="print">Распечатать QR</button><p><small>QR-код можно разместить на стойке. Ссылка действует постоянно, пока вы её не замените.</small></p></div></section><section class="card"><h2>Все отзывы</h2><button class="secondary" id="refresh">Обновить</button><div id="reviews"></div></section></main><script defer src="/assets/customer-reviews.js?v=2"></script></body></html>

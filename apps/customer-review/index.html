<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оставить отзыв — Эд ПВЗ</title><style>:root{font:16px system-ui;background:#f5f6fb;color:#29334c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,490px);background:white;border:1px solid #e1e5ef;border-radius:22px;padding:27px;box-shadow:0 8px 32px #2330540b}h1{font-size:26px;margin:8px 0}p{color:#6a7690;line-height:1.5}textarea{width:100%;min-height:155px;resize:vertical;font:inherit;padding:14px;border:1px solid #dce1ec;border-radius:12px}button{font:inherit;width:100%;border:0;border-radius:12px;background:#5062c5;color:white;padding:15px;margin-top:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#status{min-height:25px;color:#4054b2}small{color:#7c8699}</style></head><body><main class="card"><small>ЭД ПВЗ · ОБРАТНАЯ СВЯЗЬ</small><h1>Оставить отзыв</h1><p id="point">Загрузка ПВЗ…</p><form id="form" hidden><label for="review">Расскажите, что вам понравилось или что можно улучшить</label><textarea id="review" required minlength="5" maxlength="2000" placeholder="Ваш отзыв…" aria-label="Текст отзыва"></textarea><button id="submit">Отправить отзыв</button></form><p id="status" role="status"></p><small>Регистрация не нужна. Отзыв получит собственник пункта выдачи.</small></main><script>const endpoint='https://duerixyhzapotoeclggz.supabase.co/functions/v1/edpvz-customer-reviews',token=new URLSearchParams(location.search).get('t');(async()=>{try{const r=await fetch(endpoint+'?token='+encodeURIComponent(token||''));const d=await r.json();if(!r.ok)throw Error('Ссылка недействительна');document.getElementById('point').textContent=d.name;document.getElementById('form').hidden=false}catch(e){document.getElementById('point').textContent=e.message}})();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),status=document.getElementById('status');b.disabled=true;try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,text:document.getElementById('review').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка отправки');document.getElementById('form').hidden=true;status.textContent='Спасибо! Ваш отзыв отправлен собственнику ПВЗ.'}catch(e){status.textContent=e.message;b.disabled=false}};</script></body></html>

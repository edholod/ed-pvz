<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fce7f1">
  <title>Мои удержания — Эд ПВЗ</title>
  <link rel="stylesheet" href="cards.css?v=point-archive-months-1">
  <script defer src="../../assets/account.js?v=dispute-access-1"></script>
  <script type="module" src="owner.js?v=wb-overview-time"></script>
  <style>
    .case .owner-annotations { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid #0001; }
    .owner-annotations dd { white-space: pre-wrap; }
  </style>
<style>.copy-number{display:inline-flex;align-items:center;justify-content:center;margin-left:5px;padding:3px;border:0;box-shadow:none;border-radius:0;background:transparent;color:#963477;font:inherit;font-size:15px;line-height:1;cursor:pointer;vertical-align:middle}.copy-number:hover{background:transparent;color:#b42b86}.copy-number:focus-visible{outline:2px solid currentColor;outline-offset:2px}</style></head>
<body>
<main>
  <header><a href="../../">← Эд ПВЗ</a><span>Личный раздел</span></header>
  <h1>Мои удержания</h1>
  <p id="owner-status" role="status">Проверяем доступ…</p>
  <a id="owner-login" href="../account/" hidden>Войти в аккаунт</a>
  <section aria-label="История зависших Будапештская" style="margin:12px 0 20px"><a href="./all-stuck-budapest.html" style="display:flex;gap:12px;align-items:center;padding:17px;border:1px solid #d6e0f2;border-radius:18px;background:linear-gradient(110deg,#edf2ff,#f9e8f5);color:#634e91;font-weight:750;text-decoration:none"><span aria-hidden="true" style="font-size:27px">▤</span><span>Все зависшие<small style="display:block;font-weight:400;color:#77667f">Санкт-Петербург · Будапештская, 5к1б · История удержаний и доплат</small></span><span style="margin-left:auto">›</span></a></section>
  <section id="owner-workspace" hidden>
    <nav class="tools">
      <label>Собственник <select id="owner-organization"></select></label>
      <button id="owner-refresh" type="button">Обновить</button>
    </nav>
    <nav class="tools" aria-label="Фильтры удержаний">
      <input id="owner-search" type="search" aria-label="Поиск удержаний" placeholder="Товар, ШК, ПВЗ или тикет">
      <select id="owner-point" aria-label="ПВЗ"><option value="">Все ПВЗ</option></select>
      <select id="owner-month" aria-label="Месяц срока обращения"><option value="">Все месяцы</option></select>
      <select id="owner-state" aria-label="Статус удержания"><option value="">Все статусы</option></select>
      <select id="owner-wb" aria-label="Обращение в WB">
        <option value="">WB: все обращения</option><option value="working">WB: в работе</option>
        <option value="with">WB: обращение есть</option><option value="without">WB: без обращения</option>
      </select>
      <button id="owner-reset" type="button" hidden>Сбросить фильтры</button>
    </nav>
    <p id="owner-count" class="source-explanation" role="status"></p>
    <div id="owner-cases"></div>
  </section>
</main>
</body>
</html>

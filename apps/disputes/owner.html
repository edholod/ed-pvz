<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fce7f1">
  <title>Мои удержания — Эд ПВЗ</title>
  <link rel="stylesheet" href="cards.css?v=owner-simple-1">
  <script defer src="../../assets/account.js?v=dispute-access-1"></script>
  <script type="module" src="owner.js?v=15"></script>
  <style>
    .case .owner-annotations { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid #0001; }
    .owner-annotations dd { white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <header><a href="../account/">← Мой профиль</a><span>Личный раздел</span></header>
  <h1>Мои удержания</h1>
  <p id="owner-status" role="status">Проверяем доступ…</p>
  <a id="owner-login" href="../account/" hidden>Войти в аккаунт</a>
  <section id="roz41-history-link" hidden aria-label="История зависших товаров" style="margin:16px 0 20px"><a href="./all-stuck-roz41.html" style="display:flex;gap:12px;align-items:center;padding:17px;border:1px solid #e7d5ed;border-radius:18px;background:linear-gradient(110deg,#f9e6f4,#eaf1ff);color:#713b93;font-weight:750;text-decoration:none"><span aria-hidden="true" style="font-size:27px">▤</span><span>Все зависшие<small style="display:block;font-weight:400;color:#77667f">Сочи, ул. Роз, 41 · Сколько удержали и сколько доплатили</small></span><span style="margin-left:auto">›</span></a></section>
  <section id="owner-workspace" hidden>
    <nav class="tools">
      <label>Собственник <select id="owner-organization"></select></label>
      <button id="owner-refresh" type="button">Обновить</button>
    </nav>
    <div class="tools owner-views" role="group" aria-label="Что показать">
      <button type="button" id="owner-all-goods" aria-pressed="true">Все удержания</button>
      <button type="button" id="owner-stuck-goods" aria-pressed="false">Зависшие товары</button>
    </div>
    <p id="owner-view-help" class="source-explanation" hidden>Здесь товары, которые WB показывает в списке «К удержанию».</p>
    <nav class="tools" aria-label="Поиск по удержаниям">
      <input id="owner-search" type="search" aria-label="Поиск удержаний" placeholder="Найти по ШК, товару или тикету">
      <select id="owner-point" aria-label="ПВЗ"><option value="">Все ПВЗ</option></select>
      <button id="owner-reset" type="button" hidden>Сбросить фильтры</button>
    </nav>
    <details class="owner-filter-panel">
      <summary>Дополнительные фильтры</summary>
      <div class="tools">
      <select id="owner-month" aria-label="Месяц срока обращения"><option value="">Все месяцы</option></select>
      <select id="owner-state" aria-label="Статус удержания"><option value="">Все статусы</option></select>
      <select id="owner-wb" aria-label="Обращение в WB">
        <option value="">WB: все обращения</option><option value="working">WB: в работе</option>
        <option value="with">WB: обращение есть</option><option value="without">WB: без обращения</option>
      </select>
      </div>
    </details>
    <p id="owner-count" class="source-explanation" role="status"></p>
    <div id="owner-cases"></div>
  </section>
</main>
</body>
</html>

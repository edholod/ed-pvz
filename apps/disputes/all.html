<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Все удержания — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:#faf6fb;color:#332b37;font:15px system-ui,-apple-system,sans-serif}main{max-width:920px;margin:auto;padding:18px 14px 70px}h1{font-size:25px;margin:16px 0 6px}p,small{color:#756b78}a{color:#853565;text-decoration:none;font-weight:650}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.tools input{flex:2;min-width:190px}.tools select{flex:1;min-width:120px}input,select,button{font:inherit;padding:11px;border:1px solid #e6d7e4;border-radius:12px;background:#fff;color:inherit}button{cursor:pointer;background:#f4e5f1;color:#78345c;font-weight:700}.card{border:1px solid #e9d9e5;border-radius:17px;background:#fff;margin:10px 0;padding:15px}.card.paid{border-color:#b9dec5;background:#f5fff7}.card.withheld{border-color:#efc7cc;background:#fff8f9}.head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}.head strong{font-size:16px}.meta{font-size:13px;color:#766d77;margin:7px 0}.card details{margin-top:9px}.card summary{cursor:pointer;color:#80385f;font-weight:650}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:13px 0}.fields label{display:grid;gap:4px;font-size:12px;color:#685b68}.fields input,.fields select{min-width:0;width:100%}.fields .wide{grid-column:1/-1}.pages{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:18px}.save{background:#843563;color:white}.state{font-size:13px;color:#873669;margin-left:9px}@media(max-width:480px){.fields{grid-template-columns:1fr}.fields .wide{grid-column:auto}}[hidden]{display:none!important}</style></head><body><main><a href="./">← Удержания</a><h1>Все удержания</h1><p>Личная вкладка администратора. Изменения сохраняются в общей истории ПВЗ и видны собственникам с доступом.</p><p id="status">Проверка доступа…</p><section id="app" hidden><div class="tools"><input id="q" placeholder="Адрес, ШК или номер ПВЗ" type="search"><select id="kind"><option value="">Все операции</option><option>Удержано</option><option>Доплачено</option></select><button id="find">Найти</button></div><p id="count"></p><div id="rows"></div><div class="pages"><button id="prev">Назад</button><span id="page"></span><button id="next">Далее</button></div></section></main><script src="../../assets/account.js?v=session-20261115-2"></script><script>(()=>{'use strict';const BASE='https://duerixyhzapotoeclggz.supabase.co',KEY='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV',ADMIN='0f75065b-2b26-4a87-bf26-005f5a2284d4',api=window.EdPVZAccount,$=id=>document.getElementById(id);let offset=0,total=0;function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}async function rpc(name,args){if(!api?.signedIn||api.user?.id!==ADMIN)throw Error('Доступ только администратору');const session=await api.ensure();if(!session?.access_token)throw Error('Необходимо войти в аккаунт');const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.message||'Ошибка '+r.status)}return r.json()}function field(form,label,key,value,type='text'){const wrap=el('label',label),inp=document.createElement('input');inp.name=key;inp.type=type;inp.value=value??'';wrap.append(inp);form.append(wrap);return inp}function selectField(form,label,key,options,value){const wrap=el('label',label),sel=document.createElement('select');sel.name=key;for(const option of options){const o=new Option(option,option);sel.append(o)}sel.value=value;wrap.append(sel);form.append(wrap);return sel}function render(rows){const root=$('rows');root.replaceChildren();for(const r of rows){const card=el('article',undefined,'card '+(r.operation_type==='Доплачено'?'paid':'withheld')),head=el('div',undefined,'head'),left=el('div'),right=el('strong',new Intl.NumberFormat('ru-RU',{style:'currency',currency:r.currency||'RUB'}).format(Number(r.amount)));left.append(el('strong',r.address),el('div','ПВЗ '+r.wb_point_id+' · ШК '+r.shk,'meta'));head.append(left,right);card.append(head,el('div',(r.operation_type||'')+' · '+(r.operation_date?new Date(r.operation_date+'T12:00:00').toLocaleDateString('ru-RU'):'без даты')+(r.operation_time?' · '+r.operation_time:''),'meta'));const details=el('details'),summary=el('summary','Редактировать запись'),form=el('form',undefined,'fields');selectField(form,'Тип операции','type',['Удержано','Доплачено'],r.operation_type);selectField(form,'Валюта','currency',['RUB','BYN','KGS','AMD'],r.currency||'RUB');field(form,'Сумма','amount',r.amount,'number').step='0.01';field(form,'Дата операции','date',r.operation_date,'date');field(form,'Ячейка','cell',r.cell);field(form,'Коробка возврата','return_box',r.return_box);field(form,'Коробка приёмки','accept_box',r.accept_box);field(form,'Дата доплаты','payment_date',r.payment_date);const paidLabel=el('label','Доплата проведена'),paid=document.createElement('input');paid.type='checkbox';paid.name='paid';paid.checked=!!r.paid;paidLabel.append(paid);form.append(paidLabel);const actions=el('div',undefined,'wide'),save=el('button','Сохранить','save'),state=el('span','','state');save.type='submit';actions.append(save,state);form.append(actions);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;state.textContent='Сохранение…';const d=Object.fromEntries(new FormData(form));try{const success=await rpc('edpvz_admin_edit_withholding',{p_id:r.id,p_type:d.type,p_paid:paid.checked,p_amount:Number(d.amount),p_currency:d.currency,p_date:d.date||null,p_cell:d.cell,p_return_box:d.return_box,p_accept_box:d.accept_box,p_payment_date:d.payment_date});if(!success)throw Error('Запись не найдена');state.textContent='Сохранено';await load()}catch(err){state.textContent='Ошибка: '+err.message}finally{save.disabled=false}};details.append(summary,form);card.append(details);root.append(card)}if(!rows.length)root.append(el('p','Операций по выбранным условиям нет.'))}async function load(){try{$('status').textContent='Загружаем…';const data=await rpc('edpvz_admin_all_withholdings',{p_search:$('q').value.trim(),p_kind:$('kind').value,p_offset:offset,p_limit:50});total=Number(data.total||0);render(data.rows||[]);$('app').hidden=false;$('count').textContent='Всего операций: '+total.toLocaleString('ru-RU');$('page').textContent=total?(offset+1)+'–'+Math.min(total,offset+50)+' из '+total:'0';$('prev').disabled=offset===0;$('next').disabled=offset+50>=total;$('status').textContent=''}catch(e){$('status').textContent=e.message}}$('find').onclick=()=>{offset=0;load()};$('q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();offset=0;load()}};$('kind').onchange=()=>{offset=0;load()};$('prev').onclick=()=>{offset=Math.max(0,offset-50);load()};$('next').onclick=()=>{if(offset+50<total){offset+=50;load()}};window.addEventListener('edpvz-auth-changed',load);load()})();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#282334;background:#f5f3fa}main{max-width:920px;margin:auto;padding:16px 16px 90px}header,section{border:1px solid #e8ddeb;border-radius:20px;padding:18px;margin-bottom:14px;background:white}header{background:linear-gradient(110deg,#fbe5f1,#e7edff)}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 12px}p{color:#70677a;font-size:13px}a{color:#963476}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #e4d8eb;border-radius:13px;padding:12px;background:#f5edf8;color:#713568}button:disabled{opacity:.5;cursor:default}.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:9px}.point{text-align:left;background:var(--bg);color:#30283a}.point[aria-pressed=true]{outline:2px solid #9b4fb1;outline-offset:1px}.point small{display:block;margin-top:5px;color:#655a70}.primary{background:linear-gradient(100deg,#a42d82,#7754ce);color:white;width:100%;border:0;font-weight:650}label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px}input,textarea,select{width:100%;padding:12px;border:1px solid #e2d8e9;border-radius:12px;background:#faf8fc;color:inherit}textarea{min-height:90px;resize:vertical}article{padding:13px;border:1px solid #e8ddeb;border-radius:14px;margin-top:9px}article button{margin:5px 5px 0 0}.tag{font-size:12px;color:#76508a}#status{min-height:24px;color:#963476} [hidden]{display:none!important}</style></head><body><main><header><h1>Task Manager</h1><p>Назначайте поручения и следите за выполнением.</p></header><div id="status" role="status"></div><section id="pick" hidden><h2>1. Выберите пункт выдачи</h2><div class="points" id="points"></div></section><section id="form" hidden><h2>2. Новая задача</h2><form id="create"><label for="who">Сотрудник</label><select id="who" required></select><label for="title">Название задачи</label><input id="title" required maxlength="160" placeholder="Например, проверить зависшие товары"><label for="details">Описание</label><textarea id="details" maxlength="3000" placeholder="Что нужно сделать?"></textarea><label for="due">Срок выполнения (необязательно)</label><input id="due" type="date"><p></p><button class="primary" id="send">Назначить задачу</button></form></section><section id="list" hidden><h2 id="listTitle">Задачи</h2><div id="items"></div></section><a href="../management/">← Управление ПВЗ</a></main><script src="../../assets/account.js?v=vk-id-20261122"></script><script>
const $=id=>document.getElementById(id),api=window.EdPVZAccount,base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV',eq=encodeURIComponent;let points=[],members=[],tasks=[],selected='',owner=false,busy=false;const status=s=>$('status').textContent=s;async function rest(path,opt={}){const session=await api.ensure();if(!session)throw Error('Войдите в аккаунт');const r=await fetch(base+'/rest/v1/'+path,{...opt,headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}});const raw=await r.text();if(!r.ok)throw Error(JSON.parse(raw||'{}').message||'Ошибка сервера');return raw?JSON.parse(raw):null}function node(tag,t){const e=document.createElement(tag);e.textContent=t;return e}function renderPoints(){ $('points').replaceChildren();for(const p of points){const b=node('button',p.name||p.point_id);b.className='point';b.style.setProperty('--bg',({wb:'#fce7f1',ozon:'#e4efff',ym:'#fff4cc'})[p.market]||'#eee8fa');b.append(node('small',({wb:'Wildberries',ozon:'Ozon',ym:'Яндекс Маркет'})[p.market]||p.market||'ПВЗ'),node('small','ID: '+p.point_id));b.setAttribute('aria-pressed',String(selected===String(p.point_id)));b.onclick=()=>choose(String(p.point_id)).catch(e=>status(e.message));$('points').append(b)}}async function choose(id){selected=id;renderPoints();renderTasks();$('who').replaceChildren(new Option('Загрузка сотрудников…',''));$('send').disabled=true;const ids=[...new Set(members.filter(m=>String(m.point_id)===id&&m.status==='approved').map(m=>m.user_id))];const profiles=ids.length?await rest('edpvz_profiles?select=user_id,username,role&user_id=in.('+ids.map(eq).join(',')+')'):[];if(selected!==id)return;$('who').replaceChildren(new Option(profiles.length?'Выберите сотрудника':'Нет сотрудников с подтверждённым доступом',''));for(const p of profiles)$('who').append(new Option('@'+p.username,p.user_id));$('send').disabled=!profiles.length}function renderTasks(){const labels={new:'Новая',in_progress:'В работе',pending_approval:'На подтверждении',done:'Выполнена',cancelled:'Отменена'};$('items').replaceChildren();const rows=tasks.filter(t=>!owner||String(t.point_id)===selected);if(!rows.length)$('items').append(node('p','Задач пока нет'));for(const t of rows){const a=node('article','');a.append(node('strong',t.title),node('p',t.details||''),node('p',(labels[t.status]||t.status)+' · '+(t.due_date||'Без срока')));const actions=owner?(t.status==='pending_approval'?[['Подтвердить','done'],['Вернуть в работу','in_progress'],['Отменить','cancelled']]:['done','cancelled'].includes(t.status)?[]:[['Отменить','cancelled']]):t.status==='new'?[['Взять в работу','in_progress']]:t.status==='in_progress'?[['На подтверждение','pending_approval']]:[];for(const [label,next] of actions){const b=node('button',label);b.onclick=()=>run(async()=>{await rest('edpvz_tasks?id=eq.'+eq(t.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status:next})}).then(x=>{if(!x?.length)throw Error('Нет доступа к изменению задачи')});await loadTasks()});a.append(b)}$('items').append(a)}}async function loadTasks(){tasks=await rest('edpvz_tasks?'+(owner?'owner_id':'assignee_id')+'=eq.'+eq(api.user.id)+'&select=*&order=created_at.desc');renderTasks()}async function run(fn){if(busy)return;busy=true;try{status('Выполняется…');await fn();status('Готово')}catch(e){status(e.message)}finally{busy=false}}$('create').onsubmit=e=>{e.preventDefault();run(async()=>{if(!selected||!$('who').value||!$('title').value.trim())throw Error('Выберите ПВЗ, сотрудника и задачу');await rest('edpvz_tasks',{method:'POST',body:JSON.stringify({point_id:selected,owner_id:api.user.id,assignee_id:$('who').value,title:$('title').value.trim(),details:$('details').value.trim(),due_date:$('due').value||null})});$('title').value='';$('details').value='';$('due').value='';await loadTasks()})};run(async()=>{await api.ensure();if(!api.user)throw Error('Войдите в аккаунт Эд ПВЗ');const p=await rest('edpvz_profiles?user_id=eq.'+eq(api.user.id)+'&select=role');owner=p[0]?.role==='owner';if(owner){[points,members]=await Promise.all([rest('edpvz_points?owner_id=eq.'+eq(api.user.id)+'&select=*'),rest('edpvz_memberships?select=*')]);$('pick').hidden=false;renderPoints();if(points.length){$('form').hidden=false;await choose(String(points[0].point_id))}else $('points').append(node('p','У вас пока нет добавленных ПВЗ'))}else $('listTitle').textContent='Мои задачи';$('list').hidden=false;await loadTasks()});
</script></body></html>

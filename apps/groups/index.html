function participantCount(count){
  const form=new Intl.PluralRules('ru').select(count);
  return count+' '+({one:'участник',few:'участника',many:'участников'}[form]||'участников');
}
function updateSelected(){
  for(const button of $('groups').querySelectorAll('[data-group]')){
    const selected=button.dataset.group===String(active?.id);
    button.classList.toggle('selected',selected);
    if(selected)button.setAttribute('aria-current','true');
    else button.removeAttribute('aria-current');
  }
}
function clearThread(){
  ++threadRequest;
  $('thread').replaceChildren();
  delete $('thread').dataset.signature;
  delete $('thread').dataset.seen;
  selection?.reset();
  pins?.reset();
}
async function open(group){
  if(active?.id===group.id)return;
  active=group;
  clearThread();
  $('notice').textContent='';
  $('message').value='';
  $('conversation').hidden=false;
  $('emptyChat').hidden=true;
  $('layout').classList.add('chat-open');
  $('chatTitle').textContent=group.title;
  $('chatAvatar').textContent=group.title.trim().slice(0,1).toUpperCase()||'Г';
  $('chatCount').textContent=participantCount(group.count);
  updateSelected();
  history.replaceState(null,'','?group='+encodeURIComponent(group.id));
  await Promise.all([thread(),subscribeGroup()]);

async function thread(){
  if(!active)return;
  const id=active.id, request=++threadRequest, target=$('thread');
  try{
    const rows=await rpc('thread',{p_group:id});
    if(active?.id!==id||request!==threadRequest)return;
    const signature=JSON.stringify(rows);
    if(target.dataset.signature===signature)return;
    target.dataset.signature=signature;
    const atBottom=target.scrollHeight-target.scrollTop-target.clientHeight<65;
    const previousTop=target.scrollTop;
    target.replaceChildren();
    if(!selection){
      selection=window.EdPVZChatSelection.attach(target);
      pins=window.EdPVZChatPins.attach(target,()=>active?{kind:'group',group:active.id}:null,selection);
    }
    if(!rows.length){
      const empty=document.createElement('div');
      empty.className='thread-empty';
      empty.textContent='Напишите первое сообщение — оно появится здесь.';
      target.append(empty);
    }
    for(const message of rows){
      const bubble=window.EdSenderMessage.render(message,{
        selection,
        author:message.sender?'@'+message.sender:'',
        onForward:()=>window.EdPVZForward.show(message.body,list),
        onDelete:async()=>{await rpc(null,{p_id:message.id},'edpvz_group_message_delete');await thread();await list()},
        onError:status
      });
      target.append(bubble);
    }
    selection.sync();
    target.scrollTop=atBottom||!target.dataset.seen?target.scrollHeight:previousTop;
    target.dataset.seen='1';
    pins?.refresh();
    pins?.draw();
    status('');
  }catch(error){if(active?.id===id&&request===threadRequest)status(error.message)}
}

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Групповые чаты — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#fff8fc,#f3f5ff);font:15px system-ui;color:#35293a}main{max-width:760px;margin:auto;padding:16px}a{color:#87366d;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.card{background:#fff;border:1px solid #ead9e8;border-radius:18px;padding:17px;margin:12px 0}h1{font-size:23px}h2{font-size:18px}input,textarea{width:100%;padding:12px;border:1px solid #dfcfdd;border-radius:11px;font:inherit;margin:6px 0 12px;background:white}button{background:#85396e;color:white;border:0;border-radius:11px;padding:11px 15px;font:inherit;cursor:pointer}button.secondary{background:#f4e9f1;color:#7a3866}.muted{font-size:13px;color:#837686}.row{display:flex;gap:9px;flex-wrap:wrap}.group{display:block;width:100%;text-align:left;background:#faf2f8;color:#473249;margin:8px 0}.group strong{display:block}.group small{display:block;color:#8a7a8a;margin-top:4px}.thread{height:52vh;min-height:260px;overflow:auto;background:#fdf9fc;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:85%;background:#f0e5ee;padding:10px;border-radius:12px;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{background:#ead6ea;align-self:flex-end}.bubble small{display:block;font-size:11px;color:#786d79;margin-bottom:4px}.composer{display:flex;gap:8px;align-items:flex-end}.composer textarea{margin:8px 0;min-height:46px;max-height:110px;resize:vertical}.composer button{margin-bottom:8px}#status{color:#9d406e;min-height:18px}section[hidden]{display:none}</style><link rel="stylesheet" href="../../assets/chat-voice.css?v=2"><link rel="stylesheet" href="../../assets/chat-theme.css?v=2"></head><body class="group-messenger"><main><div class="top"><a href="../messages/">← Сообщения</a><a href="../../">Главная</a></div><h1>Групповые чаты</h1><p class="muted">Общайтесь с коллегами непосредственно на сайте «Эд ПВЗ».</p><p id="status" role="status"></p><section id="listView"><div class="card"><h2>Создать групповой чат</h2><label>Название группы<input id="title" maxlength="80" placeholder="Например, Команда ПВЗ"></label><label>Участники<input id="members" placeholder="@ivan, @maria" autocomplete="off"></label><p class="muted">Укажите имена зарегистрированных пользователей через запятую. Вы автоматически станете участником.</p><button id="create">Создать группу</button></div><div class="card"><h2>Мои группы</h2><div id="groups">Загрузка…</div></div></section><section id="chatView" hidden><div class="card"><button id="back" class="secondary">← Все группы</button><h2 id="chatTitle"></h2><p class="muted" id="chatCount"></p><div id="thread" class="thread"></div><div class="composer"><textarea id="message" rows="2" maxlength="2000" placeholder="Напишите сообщение…"></textarea><button id="recordVoice" class="voice-record-button" type="button" aria-label="Записать голосовое сообщение" title="Записать голосовое сообщение"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4m-4 0h8"/></svg></button><button id="send">Отправить</button></div></div></section></main><script src="../../assets/account.js"></script><script src="../../assets/chat-voice.js?v=2"></script><script src="../../assets/chat-forward.js?v=1"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV';let active=null,loading=false,rtClient=null,rtChannel=null;const status=s=>$('status').textContent=s||'';async function rpc(p_action,params={}){const session=await window.EdPVZAccount.ensure();if(!session?.access_token)throw Error('Войдите в аккаунт «Эд ПВЗ»');const r=await fetch(base+'/rest/v1/rpc/edpvz_group_chat_action',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_action,...params})});let d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'Ошибка сервера');return d}async function list(){try{let groups=await rpc('list');$('groups').replaceChildren();if(!groups.length)$('groups').textContent='Пока нет групповых чатов';for(let g of groups){let b=document.createElement('button');b.className='group';let name=document.createElement('strong');name.textContent=g.title;let meta=document.createElement('small');meta.textContent=g.count+' участников'+(g.last?' · '+g.last:'');b.append(name,meta);b.onclick=()=>open(g);$('groups').append(b)}}catch(e){status(e.message)}}async function open(g){active=g;$('listView').hidden=true;$('chatView').hidden=false;$('chatTitle').textContent=g.title;$('chatCount').textContent=g.count+' участников';history.replaceState(null,'','?group='+encodeURIComponent(g.id));await thread();await subscribeGroup()}async function thread(){if(!active||loading)return;loading=true;try{let rows=await rpc('thread',{p_group:active.id});$('thread').replaceChildren();for(let m of rows){let b=document.createElement('div');b.className='bubble'+(m.is_mine?' mine':'');let name=document.createElement('small');name.textContent=(m.is_mine?'Вы':'@'+m.sender)+' · '+new Date(m.created_at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});let body=document.createElement('span');const deleted=m.body==='Сообщение удалено';const audio=deleted?null:window.EdPVZVoice.render(m.body);if(!audio)body.textContent=m.body;b.append(name,audio||body);if(!deleted){const forward=document.createElement('button');forward.className='message-forward';forward.textContent='Переслать';forward.onclick=()=>window.EdPVZForward.show(m.body,()=>list());b.append(forward)}if(deleted)b.classList.add('deleted-message');if(m.is_mine&&!deleted){const del=document.createElement('button');del.type='button';del.className='message-delete';del.textContent='Удалить';del.onclick=async()=>{if(!confirm('Удалить сообщение для всех участников?'))return;try{await rpc('edpvz_group_message_delete',{p_id:m.id});await thread()}catch(e){status(e.message)}};b.append(del)}$('thread').append(b)}$('thread').scrollTop=$('thread').scrollHeight;status('')}catch(e){status(e.message)}finally{loading=false}}$('create').onclick=async()=>{let title=$('title').value.trim(),users=$('members').value.split(/[,;\n]+/).map(x=>x.trim().replace(/^@/,'')).filter(Boolean);$('create').disabled=true;try{let r=await rpc('create',{p_title:title,p_users:users});$('title').value='';$('members').value='';await list();let groups=await rpc('list');let g=groups.find(x=>x.id===r.id);if(g)await open(g)}catch(e){status(e.message)}finally{$('create').disabled=false}};$('back').onclick=()=>{unsubscribeGroup();active=null;$('chatView').hidden=true;$('listView').hidden=false;history.replaceState(null,'',location.pathname);list()};window.EdPVZVoice.attach($('recordVoice'),()=>active?{kind:'group',group:active.id}:null,async text=>{await rpc('send',{p_group:active.id,p_body:text});await thread()},msg=>status(msg));$('send').onclick=async()=>{let body=$('message').value.trim();if(!body||!active)return;$('send').disabled=true;try{await rpc('send',{p_group:active.id,p_body:body});$('message').value='';await thread()}catch(e){status(e.message)}finally{$('send').disabled=false}};$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};async function unsubscribeGroup(){if(rtChannel&&rtClient){const old=rtChannel;rtChannel=null;await rtClient.removeChannel(old)}}async function subscribeGroup(){await unsubscribeGroup();if(!active||!window.supabase?.createClient)return;try{const session=await window.EdPVZAccount.ensure();if(!session?.access_token)return;if(!rtClient)rtClient=window.supabase.createClient(base,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},accessToken:async()=>{const s=await window.EdPVZAccount.ensure();return s?.access_token||null}});const id=active.id;rtChannel=rtClient.channel('edpvz-group-'+id).on('postgres_changes',{event:'*',schema:'public',table:'edpvz_group_messages',filter:'group_id=eq.'+id},()=>{if(active?.id===id)thread()}).subscribe()}catch(e){status('Подключение обновлений: '+e.message)}}window.addEventListener('edpvz-auth-changed',()=>{if(active)subscribeGroup()});window.addEventListener('focus',()=>{if(active)thread();else list()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active)thread()});setInterval(()=>{if(active&&!document.hidden)thread();else if(!document.hidden)list()},12000);(async()=>{await list();let id=new URLSearchParams(location.search).get('group');if(id){let gs=await rpc('list').catch(()=>[]),g=gs.find(x=>x.id===id);if(g)open(g)}})()})();</script></body></html>

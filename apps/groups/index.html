<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Групповые чаты — Эд ПВЗ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#fff8fc,#f3f5ff);font:15px system-ui;color:#35293a}main{max-width:760px;margin:auto;padding:16px}a{color:#87366d;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.card{background:#fff;border:1px solid #ead9e8;border-radius:18px;padding:17px;margin:12px 0}h1{font-size:23px}h2{font-size:18px}input,textarea{width:100%;padding:12px;border:1px solid #dfcfdd;border-radius:11px;font:inherit;margin:6px 0 12px;background:white}button{background:#85396e;color:white;border:0;border-radius:11px;padding:11px 15px;font:inherit;cursor:pointer}button.secondary{background:#f4e9f1;color:#7a3866}.muted{font-size:13px;color:#837686}.row{display:flex;gap:9px;flex-wrap:wrap}.group{display:block;width:100%;text-align:left;background:#faf2f8;color:#473249;margin:8px 0}.group strong{display:block}.group small{display:block;color:#8a7a8a;margin-top:4px}.thread{height:52vh;min-height:260px;overflow:auto;background:#fdf9fc;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:85%;background:#f0e5ee;padding:10px;border-radius:12px;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{background:#ead6ea;align-self:flex-end}.bubble small{display:block;font-size:11px;color:#786d79;margin-bottom:4px}.composer{display:flex;gap:8px;align-items:flex-end}.composer textarea{margin:8px 0;min-height:46px;max-height:110px;resize:vertical}.composer button{margin-bottom:8px}#status{color:#9d406e;min-height:18px}section[hidden]{display:none}.member-suggestions{max-height:220px;overflow:auto;border:1px solid #ebddeb;border-radius:13px;padding:8px;background:#fff}.member-heading{font-size:12px;font-weight:700;color:#82698b;padding:5px 7px 9px}.member-choice{display:flex;align-items:center;gap:7px;width:100%;background:#faf4fb;color:#3d2e45;text-align:left;margin:4px 0;padding:10px;border-radius:10px}.member-choice strong{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis}.member-choice small{font-size:11px;color:#886e92}.member-choice span{font-size:20px;color:#9149a7}.member-selected{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.member-chip{padding:7px 10px;border-radius:25px;background:#eadcf5;color:#754286;font-size:12px}</style><link rel="stylesheet" href="../../assets/chat-voice.css?v=14"><link rel="stylesheet" href="../../assets/chat-theme.css?v=8"><link rel="stylesheet" href="../../assets/edsender-groups.css?v=1"></head><body class="group-messenger"><main><div class="top"><a href="../messages/">← Эдсенджер</a><a href="../../">Главная</a></div><h1>Групповые чаты</h1><p class="muted">Общайтесь с коллегами непосредственно на сайте «Эд ПВЗ».</p><p id="status" role="status"></p><section id="listView"><div class="card"><h2>Создать групповой чат</h2><label>Название группы<input id="title" maxlength="80" placeholder="Например, Команда ПВЗ"></label><label>Добавить участников<input id="memberSearch" placeholder="Поиск по нику или имени" autocomplete="off"></label><div id="memberSuggestions" class="member-suggestions"></div><div id="memberSelected" class="member-selected"></div><p class="muted">Выберите коллег из команды или найдите пользователей по нику. Все выбранные участники сразу попадут в чат, без подтверждения.</p><button id="create">Создать группу</button></div><div class="card"><h2>Мои группы</h2><div id="groups">Загрузка…</div></div></section><section id="chatView" hidden><div class="card"><button id="back" class="secondary">← Все группы</button><h2 id="chatTitle"></h2><p class="muted" id="chatCount"></p><div id="thread" class="thread"></div><div class="composer"><textarea id="message" rows="2" maxlength="2000" placeholder="Напишите сообщение…"></textarea><button id="attachDispute" class="chat-dispute-button" type="button" aria-label="Прикрепить зависший, брак или подмену" title="Прикрепить товар"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5M9 13h6M9 17h6"/></svg></button><button id="addPhoto" class="chat-photo-button" type="button" aria-label="Прикрепить фото" title="Добавить фото"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg></button><button id="recordVoice" class="voice-record-button" type="button" aria-label="Записать голосовое сообщение" title="Записать голосовое сообщение"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4m-4 0h8"/></svg></button><button id="send">Отправить</button></div></div></section></main><script src="../../assets/account.js"></script><script src="../../assets/chat-voice.js?v=3"></script><script src="../../assets/chat-image.js?v=2"></script><script src="../../assets/chat-dispute.js?v=3"></script><script src="../../assets/chat-location.js?v=2"></script><script src="../../assets/chat-qr.js?v=1"></script><script src="../../assets/chat-task.js?v=1"></script><script src="../../assets/chat-selection.js?v=3"></script><script src="../../assets/chat-pins.js?v=1"></script><script src="../../assets/chat-attachments.js?v=4" defer></script><script src="../../assets/chat-saved.js?v=1"></script><script src="../../assets/chat-forward.js?v=3"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),base='https://duerixyhzapotoeclggz.supabase.co',key='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV';let selection=null,pins=null;let active=null,loading=false,rtClient=null,rtChannel=null;const chosenMembers=new Map();let searchSerial=0;const status=s=>$('status').textContent=s||'';async function rpc(p_action,params={}){const session=await window.EdPVZAccount.ensure();if(!session?.access_token)throw Error('Войдите в аккаунт «Эд ПВЗ»');const r=await fetch(base+'/rest/v1/rpc/edpvz_group_chat_action',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_action,...params})});let d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'Ошибка сервера');return d}async function list(){try{let groups=await rpc('list');$('groups').replaceChildren();if(!groups.length)$('groups').textContent='Пока нет групповых чатов';for(let g of groups){let b=document.createElement('button');b.className='group';let name=document.createElement('strong');name.textContent=g.title;let meta=document.createElement('small');meta.textContent=g.count+' участников'+(g.last?' · '+(window.EdPVZChatDispute.parse(g.last)?'Карточка ПВЗ':window.EdPVZChatImage.parse(g.last)?'Фото':window.EdPVZVoice.parse(g.last)?'Голосовое сообщение':g.last):'');b.append(name,meta);b.onclick=()=>open(g);$('groups').append(b)}}catch(e){status(e.message)}}async function open(g){active=g;$('listView').hidden=true;$('chatView').hidden=false;$('chatTitle').textContent=g.title;$('chatCount').textContent=g.count+' участников';history.replaceState(null,'','?group='+encodeURIComponent(g.id));await thread();await subscribeGroup()}async function thread(){if(!active||loading)return;loading=true;try{let rows=await rpc('thread',{p_group:active.id});$('thread').replaceChildren();if(!selection){selection=window.EdPVZChatSelection.attach($('thread'));pins=window.EdPVZChatPins.attach($('thread'),()=>active?{kind:'group',group:active.id}:null,selection)}for(let m of rows){let b=document.createElement('div');b.className='bubble'+(m.is_mine?' mine':'');selection.decorate(b,m.id,m.body,m.body==='Сообщение удалено');let name=document.createElement('small');name.textContent=(m.is_mine?'Вы':'@'+m.sender)+' · '+new Date(m.created_at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});let body=document.createElement('span');const deleted=m.body==='Сообщение удалено';const audio=deleted?null:(window.EdPVZChatTask.render(m.body)||window.EdPVZChatQR.render(m.body)||window.EdPVZChatLocation.render(m.body)||window.EdPVZChatDispute.render(m.body)||window.EdPVZChatImage.render(m.body)||window.EdPVZVoice.render(m.body));if(!audio)body.textContent=m.body;b.append(name,audio||body);if(!deleted){const forward=document.createElement('button');forward.className='message-forward';forward.setAttribute('aria-label','Переслать сообщение');forward.title='Переслать';forward.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5l7 7-7 7v-4c-6 0-9 1.5-12 5 1-8 5-12 12-12V5z"/></svg>';forward.onclick=()=>window.EdPVZForward.show(m.body,()=>list());b.append(forward)}if(deleted)b.classList.add('deleted-message');if(m.is_mine&&!deleted){const del=document.createElement('button');del.type='button';del.className='message-delete';del.setAttribute('aria-label','Удалить сообщение');del.title='Удалить';del.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 4h4m-8 3 1 13h10l1-13M10 11v6m4-6v6"/></svg>';del.onclick=async()=>{if(!confirm('Удалить сообщение для всех участников?'))return;try{await rpc('edpvz_group_message_delete',{p_id:m.id});await thread()}catch(e){status(e.message)}};b.append(del)}$('thread').append(b)}$('thread').scrollTop=$('thread').scrollHeight;pins?.refresh();pins?.draw();status('')}catch(e){status(e.message)}finally{loading=false}}async function peopleSearch(query=''){const id=++searchSerial;const target=$('memberSuggestions');target.textContent='Загрузка…';try{const session=await window.EdPVZAccount.ensure();if(!session?.access_token)throw Error('Войдите в аккаунт');const response=await fetch(base+'/rest/v1/rpc/edpvz_group_people',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_search:query})});const rows=await response.json();if(!response.ok)throw Error(rows.message||'Ошибка поиска');if(id!==searchSerial)return;target.replaceChildren();const heading=document.createElement('div');heading.className='member-heading';heading.textContent=query?'Результаты поиска':'Люди из вашей команды';target.append(heading);if(!rows.length){const empty=document.createElement('p');empty.className='muted';empty.textContent=query?'Никого не найдено':'В команде пока нет пользователей. Найдите человека по нику.';target.append(empty)}for(const person of rows){if(chosenMembers.has(person.username.toLowerCase()))continue;const b=document.createElement('button');b.type='button';b.className='member-choice';const name=document.createElement('strong');name.textContent=person.display_name||'@'+person.username;const sub=document.createElement('small');sub.textContent='@'+person.username+(person.is_team?' · Ваша команда':'');const plus=document.createElement('span');plus.textContent='+';b.append(name,sub,plus);b.onclick=()=>{chosenMembers.set(person.username.toLowerCase(),person.username);renderSelected();peopleSearch($('memberSearch').value.trim())};target.append(b)}}catch(e){if(id===searchSerial)target.textContent=e.message}}
function renderSelected(){const target=$('memberSelected');target.replaceChildren();for(const [key,username] of chosenMembers){const chip=document.createElement('button');chip.type='button';chip.className='member-chip';chip.textContent='@'+username+' ×';chip.title='Убрать участника';chip.onclick=()=>{chosenMembers.delete(key);renderSelected();peopleSearch($('memberSearch').value.trim())};target.append(chip)}}
let memberSearchTimer;$('memberSearch').addEventListener('input',()=>{clearTimeout(memberSearchTimer);memberSearchTimer=setTimeout(()=>peopleSearch($('memberSearch').value.trim().replace(/^@/,'')),250)});
$('create').onclick=async()=>{let title=$('title').value.trim(),users=Array.from(chosenMembers.values());$('create').disabled=true;try{let r=await rpc('create',{p_title:title,p_users:users});$('title').value='';chosenMembers.clear();$('memberSearch').value='';renderSelected();peopleSearch();await list();let groups=await rpc('list');let g=groups.find(x=>x.id===r.id);if(g)await open(g)}catch(e){status(e.message)}finally{$('create').disabled=false}};$('back').onclick=()=>{unsubscribeGroup();active=null;$('chatView').hidden=true;$('listView').hidden=false;history.replaceState(null,'',location.pathname);list()};window.EdPVZTaskAttachment=window.EdPVZChatTask.attach(()=>active?{kind:'group',group:active.id}:null,async text=>{await rpc('send',{p_group:active.id,p_body:text});await thread()},msg=>status(msg));window.EdPVZQRAttachment=window.EdPVZChatQR.attach(()=>active?{kind:'group',group:active.id}:null,async text=>{await rpc('send',{p_group:active.id,p_body:text});await thread()},msg=>status(msg));window.EdPVZLocationAttachment=window.EdPVZChatLocation.attach(()=>active?{kind:'group',group:active.id}:null,async text=>{await rpc('send',{p_group:active.id,p_body:text});await thread()},msg=>status(msg));window.EdPVZChatDispute.attach($('attachDispute'),()=>active?{kind:'group',group:active.id}:null,async text=>{await rpc('send',{p_group:active.id,p_body:text});await thread()},msg=>status(msg));window.EdPVZChatImage.attach($('addPhoto'),()=>active?{kind:'group',group:active.id}:null,async text=>{await rpc('send',{p_group:active.id,p_body:text});await thread()},msg=>status(msg));window.EdPVZVoice.attach($('recordVoice'),()=>active?{kind:'group',group:active.id}:null,async text=>{await rpc('send',{p_group:active.id,p_body:text});await thread()},msg=>status(msg));$('send').onclick=async()=>{let body=$('message').value.trim();if(!body||!active)return;$('send').disabled=true;try{await rpc('send',{p_group:active.id,p_body:body});$('message').value='';await thread()}catch(e){status(e.message)}finally{$('send').disabled=false}};$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};async function unsubscribeGroup(){if(rtChannel&&rtClient){const old=rtChannel;rtChannel=null;await rtClient.removeChannel(old)}}async function subscribeGroup(){await unsubscribeGroup();if(!active||!window.supabase?.createClient)return;try{const session=await window.EdPVZAccount.ensure();if(!session?.access_token)return;if(!rtClient)rtClient=window.supabase.createClient(base,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},accessToken:async()=>{const s=await window.EdPVZAccount.ensure();return s?.access_token||null}});const id=active.id;rtChannel=rtClient.channel('edpvz-group-'+id).on('postgres_changes',{event:'*',schema:'public',table:'edpvz_group_messages',filter:'group_id=eq.'+id},()=>{if(active?.id===id)thread()}).subscribe()}catch(e){status('Подключение обновлений: '+e.message)}}window.addEventListener('edpvz-auth-changed',()=>{if(active)subscribeGroup()});window.addEventListener('focus',()=>{if(active)thread();else list()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active)thread()});setInterval(()=>{if(active&&!document.hidden)thread();else if(!document.hidden)list()},12000);(async()=>{peopleSearch();await list();let id=new URLSearchParams(location.search).get('group');if(id){let gs=await rpc('list').catch(()=>[]),g=gs.find(x=>x.id===id);if(g)open(g)}})()})();</script></body></html>

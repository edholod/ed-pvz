<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fce7f1"><title>Статистика регистраций — Эд ПВЗ</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#29232c;background:#faf9fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px 15px}a{color:#9b286c;text-decoration:none;font-weight:650}h1{font-size:26px;margin:25px 0 6px}p{color:#746a78;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:25px 0}.stat{border:1px solid #e8dce7;background:white;border-radius:17px;padding:20px}.stat strong{display:block;font-size:32px;margin-bottom:8px}.stat span{color:#716779}button{font:inherit;border:1px solid #e5cddf;border-radius:11px;padding:11px 17px;background:#fff;color:#792b5f;cursor:pointer}#content[hidden]{display:none}</style></head><body><main><a href="../../">← На главную</a><h1>Статистика регистраций</h1><p>Личная статистика пользователей «Эд ПВЗ». Доступна только администратору.</p><p id="status">Проверяем доступ…</p><section id="content" hidden><div class="stats"><div class="stat"><strong id="registrations">—</strong><span>Всего регистраций</span></div><div class="stat"><strong id="owners">—</strong><span>Собственников</span></div><div class="stat"><strong id="employees">—</strong><span>Сотрудников</span></div><div class="stat"><strong id="managers">—</strong><span>Управляющих</span></div></div><p id="note"></p><button id="refresh" type="button">Обновить статистику</button></section></main><script src="../../assets/account.js"></script><script>(()=>{'use strict';const BASE='https://duerixyhzapotoeclggz.supabase.co',KEY='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV',ADMIN='0f75065b-2b26-4a87-bf26-005f5a2284d4',api=window.EdPVZAccount,$=id=>document.getElementById(id);let busy=false;async function load(){if(busy)return;busy=true;$('content').hidden=true;try{if(!api?.signedIn||api.user?.id!==ADMIN)throw Error('Доступ только для администратора. Войдите в свой аккаунт на главной странице.');const session=await api.ensure();if(!session?.access_token)throw Error('Требуется повторный вход');const response=await fetch(BASE+'/rest/v1/rpc/edpvz_private_registration_stats',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!response.ok)throw Error(response.status===403?'Доступ запрещён':'Ошибка получения статистики (HTTP '+response.status+')');const data=await response.json();for(const key of ['registrations','owners','employees','managers'])$(key).textContent=Number(data[key]||0).toLocaleString('ru-RU');$('note').textContent='Роли учитываются по профилям. Всего профилей: '+Number(data.profiles||0).toLocaleString('ru-RU')+'. Данные обновлены: '+new Date(data.updated_at).toLocaleString('ru-RU');$('content').hidden=false;$('status').textContent='';}catch(e){$('status').textContent=e.message}finally{busy=false}}$('refresh').onclick=load;window.addEventListener('edpvz-auth-changed',load);load()})();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fce7f1"><title>Статистика регистраций — Эд ПВЗ</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#29232c;background:#faf9fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px 15px}a{color:#9b286c;text-decoration:none;font-weight:650}h1{font-size:26px;margin:25px 0 6px}p{color:#746a78;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:25px 0}.stat{border:1px solid #e8dce7;background:white;border-radius:17px;padding:20px}.stat strong{display:block;font-size:32px;margin-bottom:8px}.stat span{color:#716779}button{font:inherit;border:1px solid #e5cddf;border-radius:11px;padding:11px 17px;background:#fff;color:#792b5f;cursor:pointer}#content[hidden]{display:none}.directory{margin-top:24px;padding:18px;background:#fff;border:1px solid #e8dce7;border-radius:17px}.directory h2{font-size:20px;margin:0 0 12px}.directory-tools{display:flex;gap:8px;flex-wrap:wrap}.directory input{min-width:0;flex:1;padding:12px;border:1px solid #e5cddf;border-radius:11px;font:inherit}.directory .user{padding:12px 0;border-bottom:1px solid #f0e7ee;display:flex;justify-content:space-between;gap:12px;align-items:center}.directory .user:last-child{border-bottom:0}.directory .user small{display:block;color:#746a78;margin-top:4px}.directory .user a{overflow-wrap:anywhere}.directory .pages{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}.directory .pages button:disabled{opacity:.4}.directory [hidden]{display:none!important}</style></head><body><main><a href="../../">← На главную</a><h1>Статистика регистраций</h1><p>Личная статистика пользователей «Эд ПВЗ». Доступна только администратору.</p><p id="status">Проверяем доступ…</p><button id="retryStats" type="button" hidden>Повторить загрузку</button><section id="content" hidden><div class="stats"><div class="stat"><strong id="registrations">—</strong><span>Всего регистраций</span></div><div class="stat"><strong id="owners">—</strong><span>Собственников</span></div><div class="stat"><strong id="employees">—</strong><span>Сотрудников</span></div><div class="stat"><strong id="managers">—</strong><span>Управляющих</span></div></div><p id="note"></p><button id="refresh" type="button">Обновить статистику</button><section class="directory" aria-labelledby="directoryTitle"><h2 id="directoryTitle">Все зарегистрированные пользователи</h2><div class="directory-tools"><input id="userFilter" type="search" placeholder="Поиск по логину" maxlength="64" aria-label="Поиск пользователей"><button id="filterUsers" type="button">Найти</button></div><p id="usersStatus" role="status"></p><div id="userRows"></div><div class="pages"><button id="prevUsers" type="button">Назад</button><span id="userPage"></span><button id="nextUsers" type="button">Далее</button></div></section></section></main><script src="../../assets/account.js?v=session-20261115-2"></script><script>(()=>{'use strict';const BASE='https://duerixyhzapotoeclggz.supabase.co',KEY='sb_publishable_fKE2S2rAz7VMa54rgO4uvQ_vyzFPwmV',ADMIN='0f75065b-2b26-4a87-bf26-005f5a2284d4',api=window.EdPVZAccount,$=id=>document.getElementById(id);let busy=false,userOffset=0,userTotal=0;async function loadUsers(){const box=$('userRows');box.replaceChildren();$('usersStatus').textContent='Загружаем пользователей…';try{if(!api?.signedIn||api.user?.id!==ADMIN)throw Error('Нет доступа');const session=await api.ensure();if(!session?.access_token)throw Error('Требуется вход');const response=await fetch(BASE+'/rest/v1/rpc/edpvz_private_registered_users',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({search_term:$('userFilter').value.trim(),page_size:50,page_offset:userOffset}),cache:'no-store'});if(!response.ok)throw Error(response.status===403?'Доступ запрещён':'Ошибка загрузки (HTTP '+response.status+')');const data=await response.json();userTotal=Number(data.total||0);for(const u of data.users||[]){const row=document.createElement('div');row.className='user';const info=document.createElement('div'),link=document.createElement('a'),small=document.createElement('small');link.href='../profile/?user='+encodeURIComponent(u.username);link.textContent='@'+u.username;small.textContent=(u.role==='owner'?'Собственник':u.role==='employee'?'Сотрудник':u.role||'Роль не указана')+' · '+new Date(u.created_at).toLocaleDateString('ru-RU');info.append(link,small);row.append(info);box.append(row)}$('usersStatus').textContent='Найдено пользователей: '+userTotal;$('userPage').textContent=userTotal?((userOffset+1)+'–'+Math.min(userOffset+50,userTotal)+' из '+userTotal):'Нет записей';$('prevUsers').disabled=userOffset===0;$('nextUsers').disabled=userOffset+50>=userTotal;}catch(e){$('usersStatus').textContent=e.message;$('userPage').textContent='';$('prevUsers').disabled=true;$('nextUsers').disabled=true}}async function load(){if(busy)return;busy=true;$('retryStats').hidden=true;$('status').textContent='Загружаем статистику…';try{if(!api?.signedIn||api.user?.id!==ADMIN)throw Error('Доступ только для администратора. Войдите в свой аккаунт на главной странице.');const session=await api.ensure();if(!session?.access_token)throw Error('Требуется повторный вход');let response;for(let attempt=0;attempt<3;attempt++){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{response=await fetch(BASE+'/rest/v1/rpc/edpvz_private_registration_stats',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:'{}',cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}if(response.ok||![429,502,503,504].includes(response.status))break}catch(error){if(attempt===2)throw Error('Не удалось подключиться к серверу. Проверьте интернет и повторите загрузку.')}if(attempt<2)await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)))}if(!response.ok)throw Error(response.status===403?'Доступ запрещён':'Ошибка получения статистики (HTTP '+response.status+')');const data=await response.json();for(const key of ['registrations','owners','employees','managers'])$(key).textContent=Number(data[key]||0).toLocaleString('ru-RU');$('note').textContent='Роли учитываются по профилям. Всего профилей: '+Number(data.profiles||0).toLocaleString('ru-RU')+'. Данные обновлены: '+new Date(data.updated_at).toLocaleString('ru-RU');$('content').hidden=false;$('status').textContent='';await loadUsers();}catch(e){$('status').textContent=e.message==='Load failed'?'Не удалось подключиться к серверу. Повторите загрузку.':e.message;$('retryStats').hidden=false}finally{busy=false}}$('filterUsers').onclick=()=>{userOffset=0;loadUsers()};$('userFilter').addEventListener('keydown',e=>{if(e.key==='Enter'){userOffset=0;loadUsers()}});$('prevUsers').onclick=()=>{userOffset=Math.max(0,userOffset-50);loadUsers()};$('nextUsers').onclick=()=>{if(userOffset+50<userTotal){userOffset+=50;loadUsers()}};$('refresh').onclick=load;$('retryStats').onclick=load;window.addEventListener('edpvz-auth-changed',load);load()})();</script></body></html>

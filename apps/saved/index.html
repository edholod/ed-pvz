<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7eafa"><title>Избранное — Эдсенджер</title><link rel="stylesheet" href="../../assets/chat-theme.css?v=8"><link rel="stylesheet" href="../../assets/edsender-wb-ozon.css?v=3"><style>
*{box-sizing:border-box}html,body{height:100%;height:100dvh;overflow:hidden}body{margin:0;color:#33283e;font:15px system-ui,-apple-system,sans-serif;background:#f9faff}.shell{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:850px;margin:auto;background:white;box-shadow:0 0 32px #3b276011}.head{display:flex;align-items:center;gap:12px;flex-shrink:0;padding:14px 16px;background:linear-gradient(110deg,#fae8fa,#edf3ff);border-bottom:1px solid #e7ddf0}.head a{color:#803da0;text-decoration:none;font-weight:700}.head strong{font-size:17px}.head small{display:block;color:#86738e;font-size:11px;margin-top:3px}.star{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(130deg,#a13ab7,#4076e8);color:white;border-radius:15px;font-size:23px}.messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:11px;padding:18px;background:radial-gradient(circle at 12% 10%,#f7eafa,transparent 37%),radial-gradient(circle at 90% 80%,#eaf2ff,transparent 38%),#fafaff}.bubble{align-self:flex-end;max-width:min(88%,620px);white-space:pre-wrap;overflow-wrap:anywhere;background:linear-gradient(120deg,#f3ddf8,#e6ebff);border:1px solid #e6d9f0;border-radius:18px 18px 5px 18px;padding:11px 13px;box-shadow:0 2px 9px #43356a12}.bubble small{display:block;margin-top:8px;text-align:right;color:#776a85;font-size:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.actions button{border:0;background:#ffffffa6;border-radius:9px;color:#743c93;padding:5px 8px;font-size:12px}.composer{display:flex;align-items:flex-end;gap:9px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid #e9e0f1;background:#fff}.composer textarea{flex:1;min-width:0;min-height:43px;max-height:140px;resize:none;padding:11px 13px;border-radius:15px;border:1px solid #e3d9ef;background:#f8f7fc;font:16px system-ui;outline:none}.composer textarea:focus{border-color:#9b68c0}.composer button{width:44px;height:44px;flex:none;border:0;border-radius:14px;color:#fff;background:linear-gradient(130deg,#a13ab7,#3975e8);font-size:22px}.composer button#recordVoice{background:#f3e9fa;color:#8745a4;border:1px solid #e7d9f0}.composer button[hidden]{display:none!important}.composer #attachMenu{width:44px;height:44px;flex:none;border:1px solid #e5d8ef;border-radius:14px;background:#f5eaf9;color:#8145a0}.composer #attachMenu svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.status{margin:0;padding:4px 14px;font-size:12px;color:#a33c65}.status:empty{display:none}.empty{align-self:center;margin:auto;text-align:center;color:#8c8095;line-height:1.6}@media(min-width:700px){.shell{border-left:1px solid #eae3f1;border-right:1px solid #eae3f1}}
</style></head><body><main class="shell"><header class="head"><a href="../messages/" aria-label="Назад к чатам">←</a><span class="star" aria-hidden="true">★</span><span><strong>Избранное</strong><small>Личные сообщения и сохранённые материалы</small></span></header><div id="messages" class="messages" aria-live="polite"></div><p id="status" class="status" role="status"></p><form id="form" class="composer"><textarea id="text" maxlength="20000" rows="1" placeholder="Сообщение в Избранное…" aria-label="Сообщение в Избранное"></textarea><button id="attachDispute" type="button" aria-label="Прикрепить карточку ПВЗ" title="Карточка ПВЗ">▤</button><button id="addPhoto" type="button" aria-label="Прикрепить фото" title="Фото" hidden>▧</button><button id="recordVoice" type="button" aria-label="Записать голосовое сообщение" title="Голосовое сообщение">♩</button><button type="submit" aria-label="Сохранить сообщение">➤</button></form></main><script src="../../assets/account.js"></script><script src="../../assets/chat-voice.js?v=3"></script><script src="../../assets/chat-image.js?v=2"></script><script src="../../assets/chat-qr.js?v=1"></script><script src="../../assets/chat-task.js?v=1"></script><script src="../../assets/chat-location.js?v=2"></script><script src="../../assets/chat-dispute.js?v=3"></script><script src="../../assets/chat-saved.js?v=1"></script><script src="../../assets/chat-forward.js?v=3"></script><script src="../../assets/chat-attachments.js?v=4" defer></script><script>
(()=>{'use strict';const box=document.getElementById('messages'),status=document.getElementById('status'),field=document.getElementById('text'),form=document.getElementById('form');let busy=false;async function saveAttachment(body){await window.EdPVZSaved.save(body);await load()}const savedContext=()=>({kind:'saved'});const report=e=>error(e instanceof Error?e:new Error(String(e)));window.EdPVZTaskAttachment=window.EdPVZChatTask.attach(savedContext,saveAttachment,report);window.EdPVZQRAttachment=window.EdPVZChatQR.attach(savedContext,saveAttachment,report);window.EdPVZLocationAttachment=window.EdPVZChatLocation.attach(savedContext,saveAttachment,report);window.EdPVZChatDispute.attach(document.getElementById('attachDispute'),savedContext,saveAttachment,report);window.EdPVZChatImage.attach(document.getElementById('addPhoto'),savedContext,saveAttachment,report);window.EdPVZVoice.attach(document.getElementById('recordVoice'),savedContext,saveAttachment,report);function error(e){status.textContent=e.message||String(e)}async function load(){try{const user=window.EdPVZAccount?.user?.id;if(!user){box.textContent='Войдите в аккаунт, чтобы открыть Избранное.';return}const rows=await window.EdPVZSaved.api('edpvz_saved_messages?user_id=eq.'+encodeURIComponent(user)+'&select=id,body,created_at&order=created_at.asc&limit=500');box.replaceChildren();if(!rows.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Здесь будут ваши сообщения и пересланные материалы. Они доступны только вам.';box.append(empty)}for(const m of rows){const bubble=document.createElement('div');bubble.className='bubble';const content=window.EdPVZChatTask?.render(m.body)||window.EdPVZChatQR?.render(m.body)||window.EdPVZChatLocation?.render(m.body)||window.EdPVZChatDispute?.render(m.body)||window.EdPVZChatImage?.render(m.body)||window.EdPVZVoice?.render(m.body);if(content)bubble.append(content);else{const span=document.createElement('span');span.textContent=m.body;bubble.append(span)}const time=document.createElement('small');time.textContent=new Date(m.created_at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});bubble.append(time);const actions=document.createElement('div');actions.className='actions';const forward=document.createElement('button');forward.textContent='Переслать';forward.onclick=()=>window.EdPVZForward.show(m.body);const del=document.createElement('button');del.textContent='Удалить';del.onclick=async()=>{if(!confirm('Удалить из Избранного?'))return;try{await window.EdPVZSaved.api('edpvz_saved_messages?id=eq.'+encodeURIComponent(m.id),{method:'DELETE'});await load()}catch(e){error(e)}};actions.append(forward,del);bubble.append(actions);box.append(bubble)}box.scrollTop=box.scrollHeight;status.textContent=''}catch(e){error(e)}}form.onsubmit=async e=>{e.preventDefault();if(busy||!field.value.trim())return;busy=true;const button=form.querySelector('button');button.disabled=true;try{await window.EdPVZSaved.save(field.value);field.value='';await load()}catch(e){error(e)}finally{busy=false;button.disabled=false}};field.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};load();})();
</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Эд ПВЗ — профиль</title><style>body{font:16px system-ui;background:#fff7fc;color:#633b58;text-align:center;padding:45px 18px}a{color:#823365}</style></head><body><p>Открываем профиль пользователя…</p><script>(()=>{const p=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,'');if(/^[a-zA-Z0-9_]{2,32}$/.test(p)&&!p.includes('/')){location.replace('/apps/profile/?user='+encodeURIComponent(p)+location.search+location.hash)}else{document.body.textContent='Страница не найдена';const a=document.createElement('a');a.href='/';a.textContent='На главную';document.body.append(document.createElement('p'),a)}})();</script></body></html>
